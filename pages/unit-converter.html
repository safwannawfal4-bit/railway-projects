<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unit-converter</title>
    <style>
      :root {
        --bg: #faf9f7;
        --fg: #17161a;
        --muted: #6b6870;
        --line: #e3e0da;
        --card: #fff;
        --accent: #b8452f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131215;
          --fg: #f2f0ee;
          --muted: #9a969f;
          --line: #2c2a30;
          --card: #1b1a1f;
          --accent: #ff8a6b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 2.5rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        width: 100%;
        max-width: 30rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        letter-spacing: -0.02em;
      }
      p.lede {
        margin: 0 0 2rem;
        color: var(--muted);
      }
      fieldset {
        margin: 0 0 1.25rem;
        padding: 0;
        border: 0;
      }
      legend {
        padding: 0;
        margin-bottom: 0.5rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .tabs label {
        cursor: pointer;
      }
      .tabs input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .tabs span {
        display: block;
        padding: 0.4rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 2rem;
        background: var(--card);
        font-size: 0.875rem;
      }
      .tabs input:checked + span {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .tabs input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .pair {
        display: grid;
        gap: 0.75rem;
      }
      .field {
        display: grid;
        gap: 0.375rem;
      }
      label.lbl {
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .combo {
        display: flex;
        gap: 0.5rem;
      }
      input[type='number'],
      select {
        min-width: 0;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }
      input[type='number'] {
        flex: 1 1 auto;
        width: 100%;
      }
      select {
        flex: 0 0 auto;
      }
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .swap {
        justify-self: start;
      }
      button.swap {
        padding: 0.4rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 2rem;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }
      button.swap:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      footer {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8125rem;
      }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.25rem;
        padding: 0.1em 0.35em;
      }
      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>unit-converter</h1>
      <p class="lede">Length, mass, and temperature. Converts as you type.</p>

      <fieldset>
        <legend>Category</legend>
        <div class="tabs" id="tabs"></div>
      </fieldset>

      <div class="pair">
        <div class="field">
          <label class="lbl" for="from-val">From</label>
          <div class="combo">
            <input id="from-val" type="number" value="1" step="any" />
            <select id="from-unit" aria-label="Convert from unit"></select>
          </div>
        </div>

        <button class="swap" id="swap" type="button">↕ Swap</button>

        <div class="field">
          <label class="lbl" for="to-val">To</label>
          <div class="combo">
            <input id="to-val" type="number" step="any" />
            <select id="to-unit" aria-label="Convert to unit"></select>
          </div>
        </div>
      </div>

      <footer>
        <a href="/">All pages</a> · Served from
        <code>pages/unit-converter.html</code>.
      </footer>
    </main>

    <script>
      // Length and mass convert via a base-unit ratio. Temperature can't —
      // it needs an offset, so each scale gets explicit to/from base functions.
      const CATEGORIES = {
        Length: {
          units: {
            mm: 0.001,
            cm: 0.01,
            m: 1,
            km: 1000,
            in: 0.0254,
            ft: 0.3048,
            yd: 0.9144,
            mi: 1609.344,
          },
          from: (v, r) => v * r,
          to: (v, r) => v / r,
          defaults: ['m', 'ft'],
        },
        Mass: {
          units: { mg: 0.000001, g: 0.001, kg: 1, t: 1000, oz: 0.0283495231, lb: 0.45359237 },
          from: (v, r) => v * r,
          to: (v, r) => v / r,
          defaults: ['kg', 'lb'],
        },
        Temperature: {
          units: {
            '°C': { from: (v) => v, to: (v) => v },
            '°F': { from: (v) => ((v - 32) * 5) / 9, to: (v) => (v * 9) / 5 + 32 },
            K: { from: (v) => v - 273.15, to: (v) => v + 273.15 },
          },
          from: (v, u) => u.from(v),
          to: (v, u) => u.to(v),
          defaults: ['°C', '°F'],
        },
      };

      const tabs = document.getElementById('tabs');
      const fromVal = document.getElementById('from-val');
      const toVal = document.getElementById('to-val');
      const fromUnit = document.getElementById('from-unit');
      const toUnit = document.getElementById('to-unit');

      let current = 'Length';

      Object.keys(CATEGORIES).forEach((name, i) => {
        const label = document.createElement('label');
        label.innerHTML =
          `<input type="radio" name="cat" value="${name}"${i === 0 ? ' checked' : ''}>` +
          `<span>${name}</span>`;
        label.querySelector('input').addEventListener('change', () => {
          current = name;
          fillUnits();
          convert('from');
        });
        tabs.append(label);
      });

      function fillUnits() {
        const { units, defaults } = CATEGORIES[current];
        const names = Object.keys(units);
        for (const [sel, def] of [
          [fromUnit, defaults[0]],
          [toUnit, defaults[1]],
        ]) {
          sel.innerHTML = names.map((n) => `<option value="${n}">${n}</option>`).join('');
          sel.value = def;
        }
      }

      // Round off float noise (0.30000000000000004) without truncating
      // legitimately small values.
      function tidy(n) {
        if (!Number.isFinite(n)) return '';
        return String(Number(n.toPrecision(12)));
      }

      function convert(direction) {
        const cat = CATEGORIES[current];
        const srcEl = direction === 'from' ? fromVal : toVal;
        const dstEl = direction === 'from' ? toVal : fromVal;
        const srcUnit = direction === 'from' ? fromUnit.value : toUnit.value;
        const dstUnit = direction === 'from' ? toUnit.value : fromUnit.value;

        if (srcEl.value.trim() === '') {
          dstEl.value = '';
          return;
        }
        const n = Number(srcEl.value);
        if (!Number.isFinite(n)) {
          dstEl.value = '';
          return;
        }

        const base = cat.from(n, cat.units[srcUnit]);
        dstEl.value = tidy(cat.to(base, cat.units[dstUnit]));
      }

      fromVal.addEventListener('input', () => convert('from'));
      toVal.addEventListener('input', () => convert('to'));
      fromUnit.addEventListener('change', () => convert('from'));
      toUnit.addEventListener('change', () => convert('from'));
      document.getElementById('swap').addEventListener('click', () => {
        const u = fromUnit.value;
        fromUnit.value = toUnit.value;
        toUnit.value = u;
        convert('from');
      });

      fillUnits();
      convert('from');
    </script>
  </body>
</html>
