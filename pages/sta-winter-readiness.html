<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Second Winter · STA × ITP Live</title>
<style>
/* ═══════════════════════════════════════════════════ TOKENS ═══ */
:root{
  --ff-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --ff-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ff-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:4px; --r2:8px; --r3:14px;
  --sp:clamp(16px,2.2vw,28px);
  --maxw:1560px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[dir="rtl"]{
  --ff-display:"Amiri","IBM Plex Sans Arabic",Georgia,serif;
  --ff-body:"IBM Plex Sans Arabic","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}
/* — dark (deck primary) — */
html[data-theme="dark"]{
  --bg:#080E1A; --bg2:#0B1220; --surf:#111C31; --surf2:#16233C; --surf3:#1D2C49;
  --line:rgba(233,226,213,.10); --line2:rgba(233,226,213,.18);
  --ink:#F2EEE6; --ink2:#A9B4C8; --ink3:#6E7C95;
  --gold:#B98E00; --rust:#BC4522; --steel:#4E7FC4;
  --goldbright:#E5B14C; --rustbright:#D2622C;
  --ord1:#E8C877; --ord2:#C79E33; --ord3:#8F6E12;
  --logo:var(--logo-w); --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 44px -20px rgba(0,0,0,.85);
  --grid:rgba(233,226,213,.07);
}
/* — light (deck cream pages) — */
html[data-theme="light"]{
  --bg:#EFE9DE; --bg2:#F5F0E8; --surf:#FDFBF7; --surf2:#F7F2EA; --surf3:#EFE8DA;
  --line:rgba(11,18,32,.11); --line2:rgba(11,18,32,.2);
  --ink:#0B1220; --ink2:#4C5769; --ink3:#7D8798;
  --gold:#A5820A; --rust:#8D2F15; --steel:#2F5FA8;
  --goldbright:#8A6C05; --rustbright:#8D2F15;
  --ord1:#D9B44E; --ord2:#A5820A; --ord3:#6B520A;
  --logo:var(--logo-n); --shadow:0 1px 0 rgba(255,255,255,.6),0 14px 34px -22px rgba(11,18,32,.35);
  --grid:rgba(11,18,32,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ff-body);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--ff-display); font-weight:700; margin:0; letter-spacing:-.015em; line-height:1.12}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select{font:inherit; color:inherit}
::selection{background:var(--gold); color:#fff}

/* Arabic is cursive: letter-spacing breaks glyph joining, so it is removed in RTL. */
html[dir="rtl"] .eyebrow, html[dir="rtl"] .chip, html[dir="rtl"] .modelled,
html[dir="rtl"] .btn, html[dir="rtl"] .field label, html[dir="rtl"] nav.sections button,
html[dir="rtl"] .kpi .k, html[dir="rtl"] .tb-fact .k, html[dir="rtl"] thead th,
html[dir="rtl"] .acard h4, html[dir="rtl"] .pill, html[dir="rtl"] .tgl button,
html[dir="rtl"] .scope-tgl button, html[dir="rtl"] .gate-lang button,
html[dir="rtl"] .grow .gv span, html[dir="rtl"] .tl .mh, html[dir="rtl"] svg.ch text,
html[dir="rtl"] .strip .s .k, html[dir="rtl"] h1, html[dir="rtl"] h2,
html[dir="rtl"] h3, html[dir="rtl"] h4{letter-spacing:normal !important}
html[dir="rtl"] .eyebrow, html[dir="rtl"] .chip, html[dir="rtl"] .modelled,
html[dir="rtl"] .btn, html[dir="rtl"] .field label, html[dir="rtl"] .kpi .k,
html[dir="rtl"] .tb-fact .k, html[dir="rtl"] thead th,
html[dir="rtl"] .acard h4{text-transform:none}
html[dir="rtl"] h1, html[dir="rtl"] h2{line-height:1.28}
html[dir="rtl"] h3, html[dir="rtl"] h4{line-height:1.4}
html[dir="rtl"] .kpi .v, html[dir="rtl"] .strip .s .v{letter-spacing:normal}

/* ═══════════════════════════════════════════════════ ATOMS ═══ */
.eyebrow{
  font-size:10.5px; font-weight:600; letter-spacing:.19em; text-transform:uppercase;
  color:var(--rustbright); margin:0 0 10px;
}
.eyebrow.g{color:var(--goldbright)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px;
  font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--line2); color:var(--ink2); white-space:nowrap;
}
.chip.gold{color:var(--goldbright); border-color:color-mix(in srgb,var(--gold) 45%,transparent); background:color-mix(in srgb,var(--gold) 11%,transparent)}
.chip.rust{color:var(--rustbright); border-color:color-mix(in srgb,var(--rust) 45%,transparent); background:color-mix(in srgb,var(--rust) 11%,transparent)}
.chip.steel{color:var(--steel); border-color:color-mix(in srgb,var(--steel) 45%,transparent); background:color-mix(in srgb,var(--steel) 12%,transparent)}
.modelled{
  display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink3);
  border:1px dashed var(--line2); border-radius:3px; padding:1px 6px; white-space:nowrap;
}
.logo-sta{height:38px; width:auto; display:block}
.logo-itp{height:24px; width:auto; display:block}

/* ═══════════════════════════════════════════════ LOGIN ═══ */
#gate{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  background:
    radial-gradient(1100px 620px at 88% -8%, rgba(185,142,0,.15), transparent 62%),
    radial-gradient(760px 520px at 6% 106%, rgba(188,69,34,.13), transparent 60%),
    var(--bg2);
  padding:24px; overflow-y:auto;
}
#gate.hide{display:none}
.gate-card{width:min(470px,100%); animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(18px)}to{opacity:1;transform:none}}
.gate-marks{display:flex; align-items:center; gap:20px; margin-bottom:46px}
.gate-marks .div{width:1px; height:34px; background:var(--line2)}
.gate-card h1{font-size:clamp(38px,7.2vw,56px); line-height:.98; margin:0 0 4px}
.gate-card h1 em{font-style:italic; color:var(--goldbright); font-weight:500}
.gate-sub{color:var(--ink2); font-size:14px; margin:14px 0 4px; max-width:38ch}
.gate-meta{color:var(--ink3); font-size:12px; margin:0 0 34px; letter-spacing:.02em}
.field{position:relative; margin-bottom:14px}
.field label{
  display:block; font-size:10.5px; font-weight:600; letter-spacing:.17em;
  text-transform:uppercase; color:var(--ink3); margin-bottom:9px;
}
.field input{
  width:100%; padding:15px 17px; background:color-mix(in srgb,var(--surf) 72%,transparent);
  border:1px solid var(--line2); border-radius:var(--r2); font-size:16px; letter-spacing:.1em;
  font-family:var(--ff-mono); transition:border-color .2s,box-shadow .2s; outline:none;
}
.field input::placeholder{color:var(--ink3); letter-spacing:.06em}
.field input:focus{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.btn{
  width:100%; padding:15px; border-radius:var(--r2); background:var(--gold); color:#0B1220;
  font-weight:700; font-size:13px; letter-spacing:.13em; text-transform:uppercase;
  transition:transform .16s var(--ease), filter .16s, box-shadow .16s;
  box-shadow:0 10px 26px -12px color-mix(in srgb,var(--gold) 80%,transparent);
}
.btn:hover{filter:brightness(1.1); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
#gate-err{
  color:var(--rustbright); font-size:12.5px; min-height:19px; margin-top:11px;
  opacity:0; transition:opacity .2s; font-weight:500;
}
#gate-err.on{opacity:1}
.gate-foot{
  margin-top:32px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  font-size:11px; color:var(--ink3);
}
.gate-lang{display:flex; gap:2px; border:1px solid var(--line2); border-radius:100px; padding:2px}
.gate-lang button{padding:5px 13px; border-radius:100px; font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--ink3)}
.gate-lang button.on{background:var(--gold); color:#0B1220}

/* ═══════════════════════════════════════════════ SHELL ═══ */
#app{display:none}
#app.on{display:block}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--sp)}

header.top{
  position:sticky; top:0; z-index:60; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(16px) saturate(1.5); -webkit-backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex; align-items:center; gap:18px; padding:13px 0; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:16px; min-width:0}
.brand .div{width:1px; height:28px; background:var(--line2); flex:none}
.top-sp{flex:1 1 auto; min-width:8px}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tgl{display:flex; gap:2px; border:1px solid var(--line2); border-radius:100px; padding:2px; background:color-mix(in srgb,var(--surf) 55%,transparent)}
.tgl button{
  padding:6px 13px; border-radius:100px; font-size:11px; font-weight:600;
  letter-spacing:.07em; color:var(--ink3); transition:.16s var(--ease); white-space:nowrap;
}
.tgl button.on{background:var(--gold); color:#0B1220}
.tgl button:not(.on):hover{color:var(--ink)}
.icobtn{
  width:34px; height:34px; border:1px solid var(--line2); border-radius:100px;
  display:grid; place-items:center; color:var(--ink2); transition:.16s;
  background:color-mix(in srgb,var(--surf) 55%,transparent);
}
.icobtn:hover{color:var(--ink); border-color:var(--gold)}

/* title band */
.titleband{padding:34px 0 6px; border-bottom:1px solid var(--line)}
.titleband h1{font-size:clamp(34px,5.4vw,58px); line-height:.98}
.titleband h1 em{font-style:italic; font-weight:500; color:var(--goldbright)}
.tb-row{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:24px}
.tb-facts{display:flex; gap:26px; flex-wrap:wrap; padding-bottom:4px}
.tb-fact .k{font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--ink3); margin-bottom:3px}
.tb-fact .v{font-size:14px; font-weight:600; color:var(--ink)}

/* nav */
nav.sections{
  position:sticky; top:57px; z-index:55; background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
}
nav.sections::-webkit-scrollbar{display:none}
.nav-in{display:flex; gap:2px; padding:0; min-width:max-content}
nav.sections button{
  padding:14px 15px; font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink3);
  border-bottom:2px solid transparent; transition:.16s; white-space:nowrap;
}
nav.sections button.on{color:var(--ink); border-bottom-color:var(--gold)}
nav.sections button:hover{color:var(--ink)}

/* filter bar */
.filters{
  position:sticky; top:104px; z-index:50; background:color-mix(in srgb,var(--bg2) 94%,transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); padding:11px 0;
}
.filters-in{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.fsel{position:relative}
.fsel select{
  appearance:none; -webkit-appearance:none; padding:8px 30px 8px 12px; border-radius:var(--r);
  border:1px solid var(--line2); background:var(--surf); font-size:12.5px; font-weight:500;
  cursor:pointer; transition:.16s; max-width:200px;
}
html[dir="rtl"] .fsel select{padding:8px 12px 8px 30px}
.fsel select:hover{border-color:var(--gold)}
.fsel select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent)}
.fsel::after{
  content:"▾"; position:absolute; inset-inline-end:11px; top:50%; transform:translateY(-52%);
  pointer-events:none; color:var(--ink3); font-size:11px;
}
.fsearch{
  padding:8px 12px; border-radius:var(--r); border:1px solid var(--line2);
  background:var(--surf); font-size:12.5px; width:190px; transition:.16s; outline:none;
}
.fsearch:focus{border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent)}
.scope-tgl{display:flex; gap:2px; border:1px solid var(--line2); border-radius:var(--r); padding:2px; background:var(--surf)}
.scope-tgl button{padding:6px 12px; border-radius:2px; font-size:11.5px; font-weight:600; color:var(--ink3); transition:.16s}
.scope-tgl button.on{background:var(--gold); color:#0B1220}
.fclear{font-size:11.5px; font-weight:600; color:var(--rustbright); padding:7px 10px; border-radius:var(--r)}
.fclear:hover{background:color-mix(in srgb,var(--rust) 12%,transparent)}
.fcount{font-size:11.5px; color:var(--ink3); margin-inline-start:auto; white-space:nowrap}
.fcount b{color:var(--ink); font-weight:700}

/* active filter chips */
.chips{display:flex; gap:7px; flex-wrap:wrap; padding:10px 0 0}
.chips:empty{display:none}
.fchip{
  display:inline-flex; align-items:center; gap:7px; padding:4px 8px 4px 11px; border-radius:100px;
  background:color-mix(in srgb,var(--gold) 15%,transparent); border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);
  font-size:11.5px; font-weight:500; color:var(--ink);
}
.fchip b{font-weight:700}
.fchip button{width:15px; height:15px; border-radius:100px; display:grid; place-items:center; font-size:13px; line-height:1; color:var(--ink2); opacity:.75}
.fchip button:hover{opacity:1; color:var(--rustbright)}

/* sections */
section.sec{padding:44px 0 12px; scroll-margin-top:150px}
section.sec[hidden]{display:none}
.sechead{margin-bottom:26px; max-width:80ch}
.sechead h2{font-size:clamp(24px,3.3vw,36px); margin-bottom:9px}
.sechead p{color:var(--ink2); font-size:14.5px; margin:0; max-width:74ch; line-height:1.62}

/* grid + cards */
.grid{display:grid; gap:14px; align-items:stretch}
.grid > .card, .grid > .kpi{display:flex; flex-direction:column}
.grid > .card > .rows:last-child, .grid > .card > .chartbox:last-child{margin-block-end:auto}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{
  background:var(--surf); border:1px solid var(--line); border-radius:var(--r3);
  padding:20px 22px; box-shadow:var(--shadow); min-width:0;
}
.card.flush{padding:0; overflow:hidden}
.card h3{font-size:17px; margin-bottom:4px}
.card .sub{font-size:12.5px; color:var(--ink3); margin:0 0 16px; line-height:1.5}
.cardhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px}

/* KPI tile */
.kpi{
  background:var(--surf); border:1px solid var(--line); border-radius:var(--r3); padding:18px 19px 17px;
  position:relative; overflow:hidden; box-shadow:var(--shadow); transition:border-color .2s;
}
.kpi::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--gold); opacity:.85}
.kpi.rust::before{background:var(--rust)} .kpi.steel::before{background:var(--steel)} .kpi.dim::before{background:var(--line2)}
.kpi .k{font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); margin-bottom:11px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.kpi .v{font-family:var(--ff-display); font-size:clamp(28px,3.4vw,40px); font-weight:700; line-height:1; letter-spacing:-.03em}
.kpi .v small{font-size:.46em; font-weight:600; font-family:var(--ff-body); letter-spacing:0; color:var(--ink2); margin-inline-start:4px}
.kpi .d{font-size:12px; color:var(--ink2); margin-top:9px; line-height:1.45}
.kpi .d b{color:var(--ink); font-weight:600}

/* meter */
.meter{height:5px; border-radius:100px; background:var(--surf3); overflow:hidden; margin-top:12px}
.meter i{display:block; height:100%; border-radius:100px; background:var(--gold); transition:width .8s var(--ease)}
.meter i.rust{background:var(--rust)} .meter i.steel{background:var(--steel)}

/* charts */
.chartbox{width:100%; overflow:visible}
svg.ch{width:100%; height:auto; display:block; overflow:visible}
svg.ch text{font-family:var(--ff-body); font-variant-numeric:tabular-nums}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
.lg{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink2); font-weight:500}
.lg i{width:11px; height:11px; border-radius:3px; flex:none}
.lg.dash i{height:0; border-top:2px dashed var(--rustbright); border-radius:0; width:15px}

/* tooltip */
#tip{
  position:fixed; z-index:300; pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity .12s, transform .12s; background:var(--bg2); color:var(--ink);
  border:1px solid var(--line2); border-radius:var(--r2); padding:10px 13px;
  font-size:12px; line-height:1.5; box-shadow:0 20px 46px -18px rgba(0,0,0,.8); max-width:290px;
}
#tip.on{opacity:1; transform:none}
#tip .t{font-weight:700; font-size:12.5px; margin-bottom:5px; font-family:var(--ff-display)}
#tip .r{display:flex; justify-content:space-between; gap:18px; color:var(--ink2)}
#tip .r b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

/* table */
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:920px}
thead th{
  position:sticky; top:0; z-index:2; background:var(--surf2); text-align:start;
  font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--ink3);
  padding:12px 12px; border-bottom:1px solid var(--line2); white-space:nowrap; cursor:pointer; user-select:none;
}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.4; margin-inline-start:4px; font-size:9px}
thead th.srt .ar{opacity:1; color:var(--gold)}
thead th.n, td.n{text-align:end; font-variant-numeric:tabular-nums}
tbody td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--gold) 7%,transparent)}
tbody tr.rec{box-shadow:inset 3px 0 0 var(--gold)}
html[dir="rtl"] tbody tr.rec{box-shadow:inset -3px 0 0 var(--gold)}
.cname{font-weight:600; color:var(--ink); display:block; line-height:1.3}
.chandle{font-size:11.5px; color:var(--ink3)}
.chandle a{color:var(--steel); text-decoration:none}
.chandle a:hover{text-decoration:underline}
.pill{display:inline-block; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; letter-spacing:.03em; border:1px solid var(--line2); color:var(--ink2); white-space:nowrap}
.pill.Hero{background:color-mix(in srgb,var(--ord3) 30%,transparent); border-color:color-mix(in srgb,var(--ord3) 60%,transparent); color:var(--ink)}
.pill.Mid{background:color-mix(in srgb,var(--ord2) 26%,transparent); border-color:color-mix(in srgb,var(--ord2) 55%,transparent); color:var(--ink)}
.pill.Micro{background:color-mix(in srgb,var(--ord1) 24%,transparent); border-color:color-mix(in srgb,var(--ord1) 52%,transparent); color:var(--ink)}
.flg{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:4px;font-size:11px;
  background:var(--surf3);color:var(--ink3);margin-inline-end:3px;cursor:help}
.flg.hot{background:color-mix(in srgb,var(--rust) 22%,transparent);color:var(--rustbright)}
.er-ok{color:var(--goldbright); font-weight:700}
.er-no{color:var(--rustbright); font-weight:700}
.tblfoot{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--ink3)}
.pager{display:flex; gap:5px; align-items:center}
.pager button{padding:5px 11px; border:1px solid var(--line2); border-radius:var(--r); font-size:12px; font-weight:600; color:var(--ink2); transition:.14s}
.pager button:hover:not(:disabled){border-color:var(--gold); color:var(--ink)}
.pager button:disabled{opacity:.32; cursor:default}

/* list rows */
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .lbl{flex:0 0 clamp(88px,15%,140px); font-size:12.5px; font-weight:600; min-width:0}
.rows.wide .row .lbl{flex:0 0 clamp(150px,34%,240px)}
.rows.wide .row{align-items:flex-start; padding:14px 0}
.rows.wide .row .bar{padding-top:2px}
.rows.wide .row .val{padding-top:1px}
.row .lbl small{display:block; font-weight:400; color:var(--ink3); font-size:11px}
.row .bar{flex:1 1 auto; min-width:0}
.row .val{flex:none; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; text-align:end; min-width:62px}

/* bar track — used by hbars() and bullets() */
.bul{position:relative; height:22px; background:var(--surf3); border-radius:3px; overflow:visible; cursor:default}
.bul i{
  position:absolute; inset-block:0; inset-inline-start:0; background:var(--gold);
  border-start-start-radius:2px; border-end-start-radius:2px;
  border-start-end-radius:4px; border-end-end-radius:4px;
  transition:width .7s var(--ease);
}
.bul i.short{background:var(--rust)}
.bul u{position:absolute; inset-block:-3px; width:2px; background:var(--ink); text-decoration:none; z-index:2; border-radius:2px}
.bul u::after{content:""; position:absolute; top:-4px; inset-inline-start:-3px; border:4px solid transparent; border-top-color:currentColor; color:inherit}
.bul:hover i{filter:brightness(1.14)}

/* segmented bar */
.segwrap{display:flex; gap:2px; height:26px; border-radius:3px; overflow:hidden; background:var(--surf3)}
.segwrap .seg{position:relative; display:grid; place-items:center; min-width:2px; transition:filter .15s; cursor:default}
.segwrap .seg:hover{filter:brightness(1.16)}
.segwrap .seg b{font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); font-variant-numeric:tabular-nums}
html[data-theme="light"] .segwrap .seg b{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* notes */
.note{
  border-inline-start:2px solid var(--gold); padding:12px 0 12px 16px; margin:18px 0 0;
  font-size:13px; color:var(--ink2); line-height:1.62; background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 7%,transparent),transparent 72%);
}
html[dir="rtl"] .note{padding:12px 16px 12px 0; background:linear-gradient(-90deg,color-mix(in srgb,var(--gold) 7%,transparent),transparent 72%)}
.note b{color:var(--ink); font-weight:600}
.note.rust{border-inline-start-color:var(--rust); background:linear-gradient(90deg,color-mix(in srgb,var(--rust) 8%,transparent),transparent 72%)}
html[dir="rtl"] .note.rust{background:linear-gradient(-90deg,color-mix(in srgb,var(--rust) 8%,transparent),transparent 72%)}
#demo-note{margin:22px 0 -6px}
@media print{ #demo-note{margin:12px 0} }

/* deck-style stat strip */
.strip{display:grid; gap:14px; grid-template-columns:repeat(4,minmax(0,1fr))}
.strip .s{background:var(--surf); border:1px solid var(--line); border-radius:var(--r3); padding:22px 20px; box-shadow:var(--shadow)}
.strip .s .v{font-family:var(--ff-display); font-size:clamp(26px,3.6vw,42px); font-weight:700; line-height:1; letter-spacing:-.03em; margin-bottom:12px}
.strip .s .k{font-size:12px; font-weight:600; color:var(--ink); margin-bottom:5px}
.strip .s .d{font-size:12px; color:var(--ink3); line-height:1.5}
.strip .s.hl .v{color:var(--rustbright)}
.strip .s.gd .v{color:var(--goldbright)}

/* archetype / territory cards */
.acard{background:var(--surf2); border:1px solid var(--line); border-radius:var(--r3); padding:19px 20px; display:flex; flex-direction:column; gap:9px}
.acard .n{font-family:var(--ff-display); font-size:26px; font-weight:700; color:var(--goldbright); line-height:1}
.acard h4{font-size:14px; letter-spacing:.06em; text-transform:uppercase; font-family:var(--ff-body); font-weight:700}
.acard .dsc{font-size:12.5px; color:var(--goldbright); line-height:1.5}
.acard .mt{margin-top:auto; padding-top:12px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12px; color:var(--ink3)}
.acard .mt b{font-size:15px; color:var(--ink); font-weight:700; font-family:var(--ff-display)}

/* gate list */
.gates{display:grid; gap:9px}
.grow{display:flex; align-items:center; gap:13px; padding:11px 13px; border:1px solid var(--line); border-radius:var(--r2); background:var(--surf2)}
.grow .gi{width:24px; height:24px; border-radius:100px; display:grid; place-items:center; font-size:11px; font-weight:700; flex:none; background:color-mix(in srgb,var(--gold) 22%,transparent); color:var(--goldbright)}
.grow .gt{flex:1 1 auto; min-width:0}
.grow .gt b{display:block; font-size:13px; font-weight:600}
.grow .gt span{font-size:11.5px; color:var(--ink3)}
.grow .gv{flex:none; text-align:end}
.grow .gv b{display:block; font-size:16px; font-weight:700; font-family:var(--ff-display)}
.grow .gv span{font-size:10.5px; color:var(--ink3)}

/* timeline */
.tl{display:grid; gap:3px; grid-template-columns:110px repeat(14,minmax(0,1fr)); align-items:center}
.tl .rl{font-size:12px; font-weight:600; padding-inline-end:10px}
.tl .rl small{display:block; color:var(--ink3); font-weight:400; font-size:11px}
.tl .mh{font-size:9.5px; color:var(--ink3); text-align:center; letter-spacing:.05em; padding-bottom:5px}
.tl .blk{height:38px; border-radius:3px; display:grid; place-items:center; font-size:12px; font-weight:700; color:#fff}

footer.foot{margin-top:56px; padding:30px 0 46px; border-top:1px solid var(--line); color:var(--ink3); font-size:12px}
.foot-in{display:flex; justify-content:space-between; gap:22px; flex-wrap:wrap; align-items:center}
.foot-marks{display:flex; align-items:center; gap:16px; opacity:.75}
.foot-marks .div{width:1px; height:22px; background:var(--line2)}

/* ═══════════════════════════════════════════ RESPONSIVE ═══ */
@media (max-width:1180px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:960px){
  .g3,.g23,.g32{grid-template-columns:minmax(0,1fr)}
  .tl{grid-template-columns:82px repeat(14,minmax(0,1fr))}
}
@media (max-width:720px){
  .g2{grid-template-columns:minmax(0,1fr)}
  .titleband{padding:24px 0 4px}
  nav.sections{top:53px} .filters{top:98px}
  .fsearch{width:100%} .fsel select{max-width:none; width:100%}
  .fsel{flex:1 1 130px}
  .tb-facts{gap:16px}
  .tl{grid-template-columns:1fr; gap:8px}
  .tl .mh{display:none}
  .tl .blk{height:32px}
}
@media (max-width:560px){
  .g4,.strip{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
  table{min-width:660px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }
@media print{ header.top,nav.sections,.filters,#gate{display:none!important} .card{break-inside:avoid} }
</style>

function n0(v){ return v==null||isNaN(v) ? "—" : Math.round(v).toLocaleString("en-US"); }
function nk(v,d){
  if(v==null||isNaN(v)) return "—";
  const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(d??1).replace(/\.0$/,"")+t("num.bn");
  if(a>=1e6) return (v/1e6).toFixed(d??1).replace(/\.0$/,"")+t("num.m");
  if(a>=1e3) return (v/1e3).toFixed(a>=1e5?0:(d??0))+t("num.k");
  return Math.round(v).toLocaleString("en-US");
}
function pc(v,d){ return v==null||isNaN(v) ? "—" : (v*100).toFixed(d??2)+"%"; }
function usd(v,d){                      /* rates: CPE / CPM — needs decimals */
  if(v==null||isNaN(v)) return "—";
  if(v>=1000) return "$"+Math.round(v).toLocaleString("en-US");
  return "$"+v.toFixed(d??3);
}
function usdI(v){                       /* money: fees / budgets — always whole dollars */
  return v==null||isNaN(v) ? "—" : "$"+Math.round(v).toLocaleString("en-US");
}
function tierName(x){ return t("t."+x) }
function archName(x){ return t("a."+x) }
function regName(x){ return I18N[S.lang]["r."+x] || x }
function mktName(c){ return S.lang==="ar" ? (c.market_ar||c.market) : c.market }
function mktNameS(m){
  const c = D.creators.find(x=>x.market===m);
  return S.lang==="ar" && c ? (c.market_ar||m) : m;
}
function fill(str,o){ return String(str).replace(/\{(\w+)\}/g,(_,k)=> o[k]??"") }
function nCre(n){ return n + " " + (S.lang==="ar" ? t("l.creators") : (n===1 ? t("l.creator") : t("l.creators"))) }

function gateSubmit(e){
  e.preventDefault();
  const raw = $("#code").value.trim();
  const err = $("#gate-err");
  if(!raw){ err.textContent=t("gate.empty"); err.classList.add("on"); return; }
  const hit = Object.keys(CONFIG.codes).find(k=> k.toLowerCase()===raw.toLowerCase());
  if(!hit){ err.textContent=t("gate.err"); err.classList.add("on"); $("#code").select(); return; }
  err.classList.remove("on");
  S.role = CONFIG.codes[hit];
  sessionStorage.setItem(CONFIG.store+"_role", S.role);
  openApp();
}
function openApp(){
  $("#gate").classList.add("hide");
  $("#app").classList.add("on");
  buildShell(); render();
  window.scrollTo(0,0);
}
function signOut(){
  sessionStorage.removeItem(CONFIG.store+"_role");
  S.role=null; $("#code").value="";
  $("#app").classList.remove("on"); $("#gate").classList.remove("hide");
}

/* ══════════════════════════════════════════════ FILTER ══ */
function filtered(){
  const f=S.f;
  const q=f.q.trim().toLowerCase();
  return D.creators.filter(c=>{
    if(S.scope==="rec" && !c.recommended) return false;
    if(f.region && c.region!==f.region) return false;
    if(f.market && c.market!==f.market) return false;
    if(f.platform && c.platform!==f.platform) return false;
    if(f.tier && c.tier!==f.tier) return false;
    if(f.arch && c.archetype!==f.arch) return false;
    if(f.floor==="ok" && !(c.er>=M.er_floor)) return false;
    if(f.floor==="no" && (c.er>=M.er_floor)) return false;
    if(q){
      const hay=(c.name+" "+c.handle+" "+c.pillar+" "+c.market+" "+c.language+" "+c.rationale).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ══════════════════════════════════════════════ AGG ══ */
function agg(rows){
  const ev = rows.filter(c=>c.er!=null && c.followers);
  const wf = ev.reduce((s,c)=>s+c.followers,0);
  const vv = rows.filter(c=>c.views!=null);
  const ip = rows.filter(c=>c.impressions!=null);
  const tv = rows.reduce((s,c)=>s+(c.total_views||0),0);
  const ti = rows.reduce((s,c)=>s+(c.total_imp||0),0);
  const te = rows.reduce((s,c)=>s+(c.total_eng||0),0);
  const fee= rows.reduce((s,c)=>s+(c.fee||0),0);
  const geo= rows.map(c=>c.geo_home).filter(v=>v!=null).sort((a,b)=>a-b);
  return {
    n:rows.length,
    er: wf ? ev.reduce((s,c)=>s+c.er*c.followers,0)/wf : null,
    views: vv.length ? vv.reduce((s,c)=>s+c.views,0)/vv.length : null,
    imp: ip.length ? ip.reduce((s,c)=>s+c.impressions,0)/ip.length : null,
    followers: rows.reduce((s,c)=>s+(c.followers||0),0),
    tv, ti, te, fee,
    assets: rows.reduce((s,c)=>s+(c.assets||0),0),
    cpe: te ? fee/te : null,
    cpm: tv ? fee/(tv/1000) : null,
    above: rows.filter(c=>c.er>=M.er_floor).length,
    cleared: rows.filter(c=>c.cleared).length,
    geoMed: geo.length ? geo[Math.floor(geo.length/2)] : null
  };
}
function groupBy(rows,key){
  const g={};
  rows.forEach(c=>{ (g[c[key]] = g[c[key]]||[]).push(c) });
  return Object.entries(g).map(([k,v])=>({key:k, rows:v, ...agg(v)}));
}

/* ══════════════════════════════════════ CHART: HTML BARS ══ */
function hbars(items,o){
  o=o||{};
  const max = o.max ?? Math.max(...items.map(i=>i.v||0), 0.0000001);
  const rule = o.rule!=null ? (o.rule/max)*100 : null;
  return `<div class="rows${o.wide?" wide":""}">` + items.map(i=>{
    const w = Math.max(((i.v||0)/max)*100, i.v>0?1.2:0);
    const col = i.color || (o.color||"var(--gold)");
    return `<div class="row" ${i.click?`data-click='${esc(JSON.stringify(i.click))}' style="cursor:pointer"`:""}>
      <div class="lbl">${esc(i.label)}${i.sub?`<small>${esc(i.sub)}</small>`:""}</div>
      <div class="bar"><div class="bul" data-tip="${esc(i.tip||"")}" data-tt="${esc(i.label)}">
        <i style="width:${w.toFixed(2)}%;background:${col}"></i>
        ${rule!=null?`<u style="inset-inline-start:${rule.toFixed(2)}%;background:var(--rustbright)"></u>`:""}
      </div></div>
      <div class="val num" ${i.vcolor?`style="color:${i.vcolor}"`:""}>${i.vt}</div>
    </div>`;
  }).join("") + `</div>`;
}

function bullets(items){
  const max = Math.max(...items.map(i=>Math.max(i.v,i.target)),1);
  return `<div class="rows">` + items.map(i=>{
    const w=(i.v/max)*100, m=(i.target/max)*100;
    const short = i.v < i.target;
    return `<div class="row">
      <div class="lbl">${esc(i.label)}<small>${esc(i.sub||"")}</small></div>
      <div class="bar"><div class="bul" data-tip="${esc(i.tip||"")}" data-tt="${esc(i.label)}">
        <i class="${short?"short":""}" style="width:${w.toFixed(2)}%"></i>
        ${i.target>0?`<u style="inset-inline-start:${m.toFixed(2)}%"></u>`:""}
      </div></div>
      <div class="val num" style="color:${short?"var(--rustbright)":"var(--ink)"}">${i.vt}</div>
    </div>`;
  }).join("") + `</div>`;
}

function segbar(segs,total,o){
  o=o||{};
  const T = total || segs.reduce((s,x)=>s+x.v,0) || 1;
  return `<div class="segwrap">` + segs.map(s=>{
    const p=(s.v/T)*100;
    if(p<=0) return "";
    return `<span class="seg" style="flex:0 0 ${p.toFixed(3)}%;background:${s.color}"
      data-tip="${esc(s.tip||"")}" data-tt="${esc(s.label)}">${p>=9?`<b>${p.toFixed(0)}%</b>`:""}</span>`;
  }).join("") + `</div>`;
}
function legend(items){
  return `<div class="legend">` + items.map(i=>
    `<span class="lg ${i.dash?"dash":""}">${i.dash?"<i></i>":`<i style="background:${i.color}"></i>`}${esc(i.label)}</span>`
  ).join("") + `</div>`;
}

/* ══════════════════════════════════════ CHART: SCATTER (SVG) ══ */
function scatter(rows){
  const W=880,H=420,ml=62,mr=22,mt=18,mb=48;
  const pts = rows.filter(c=>c.followers>0 && c.er!=null);
  if(!pts.length) return `<p class="muted" style="padding:24px 0">${t("l.none")}</p>`;
  const xs = pts.map(c=>Math.log10(c.followers));
  const x0 = Math.floor(Math.min(...xs)*2)/2, x1 = Math.ceil(Math.max(...xs)*2)/2;
  const y1 = Math.max(0.10, Math.ceil(Math.max(...pts.map(c=>c.er))*100)/100);
  const X = v => ml + ((Math.log10(v)-x0)/(x1-x0||1))*(W-ml-mr);
  const Y = v => H-mb - (v/y1)*(H-mt-mb);
  const TC = {Hero:"var(--ord3)", Mid:"var(--ord2)", Micro:"var(--ord1)", Nano:"var(--ink3)", Unrated:"var(--ink3)"};

  let g="";
  /* y grid */
  const ysteps=5;
  for(let i=0;i<=ysteps;i++){
    const v=(y1/ysteps)*i;
    g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
        <text x="${ml-10}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink3)">${(v*100).toFixed(0)}%</text>`;
  }
  /* x ticks at decades */
  for(let d=Math.ceil(x0); d<=Math.floor(x1); d++){
    g+=`<line x1="${X(Math.pow(10,d)).toFixed(1)}" x2="${X(Math.pow(10,d)).toFixed(1)}" y1="${mt}" y2="${H-mb}" stroke="var(--grid)" stroke-width="1"/>
        <text x="${X(Math.pow(10,d)).toFixed(1)}" y="${H-mb+20}" text-anchor="middle" font-size="11" fill="var(--ink3)">${nk(Math.pow(10,d))}</text>`;
  }
  /* tier bands */
  [[1e5,"Mid"],[5e5,"Hero"]].forEach(([v,name])=>{
    if(v>Math.pow(10,x0) && v<Math.pow(10,x1))
      g+=`<line x1="${X(v).toFixed(1)}" x2="${X(v).toFixed(1)}" y1="${mt}" y2="${H-mb}" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 4"/>
          <text x="${(X(v)+6).toFixed(1)}" y="${mt+13}" font-size="10" fill="var(--ink3)" letter-spacing=".08em">${esc(tierName(name))}</text>`;
  });
  /* floor rule */
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(M.er_floor).toFixed(1)}" y2="${Y(M.er_floor).toFixed(1)}"
        stroke="var(--rustbright)" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="${W-mr}" y="${(Y(M.er_floor)-8).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--rustbright)">${esc(t("l.floor"))}</text>`;
  /* dots */
  pts.sort((a,b)=> (b.followers)-(a.followers)).forEach(c=>{
    const r = c.views ? Math.max(4.5, Math.min(13, Math.sqrt(c.views)/95)) : 5;
    g+=`<circle cx="${X(c.followers).toFixed(1)}" cy="${Y(c.er).toFixed(1)}" r="${r.toFixed(1)}"
         fill="${TC[c.tier]}" fill-opacity="${c.recommended?".9":".45"}"
         stroke="var(--surf)" stroke-width="2"
         data-tip="${esc(mktName(c)+" · "+tierName(c.tier)+"|"+t("l.followers")+":"+nk(c.followers)+"|"+t("l.er")+":"+pc(c.er)+"|"+t("l.avgviews")+":"+nk(c.views))}"
         data-tt="${esc(c.name)}" style="cursor:crosshair"/>`;
  });
  g+=`<text x="${(ml+(W-mr))/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--ink3)" letter-spacing=".1em">${esc(t("ax.followers"))}</text>`;
  g+=`<text transform="translate(15,${(mt+H-mb)/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink3)" letter-spacing=".1em">${esc(t("ax.er"))}</text>`;
  return `<div class="chartbox" dir="ltr"><svg class="ch" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}

/* ══════════════════════════════════════════════ KPI ══ */
function kpi(o){
  return `<div class="kpi ${o.tone||""}">
    <div class="k">${esc(o.k)}${o.modelled?`<span class="modelled">◈ ${esc(t("l.modelled"))}</span>`:""}</div>
    <div class="v num">${o.v}${o.unit?`<small>${esc(o.unit)}</small>`:""}</div>
    ${o.d?`<div class="d">${o.d}</div>`:""}
    ${o.meter!=null?`<div class="meter"><i class="${o.meterTone||""}" style="width:${Math.min(100,Math.max(0,o.meter*100)).toFixed(1)}%"></i></div>`:""}
  </div>`;
}

function tierEcon(rows){
  const order=["Hero","Mid","Micro","Nano"];
  const gs = groupBy(rows,"tier").sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
  const totN = rows.length||1, totF = rows.reduce((s,c)=>s+(c.fee||0),0)||1;
  const C={Hero:"var(--ord3)",Mid:"var(--ord2)",Micro:"var(--ord1)",Nano:"var(--ink3)"};
  const plan={Hero:{n:8,s:.34},Mid:{n:22,s:.41},Micro:{n:30,s:.25}};
  return `
  <div style="font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px">${esc(t("c.tiershare"))}</div>
  ${segbar(gs.map(g=>({v:g.n,color:C[g.key],label:tierName(g.key),tip:t("l.creators")+":"+g.n})),totN)}
  <div style="font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:16px 0 7px">${esc(t("c.tierspend"))} <span class="modelled" style="margin-inline-start:6px">◈ ${esc(t("l.modelled"))}</span></div>
  ${segbar(gs.map(g=>({v:g.fee,color:C[g.key],label:tierName(g.key),tip:usdI(g.fee)})),totF)}
  ${legend(gs.map(g=>({color:C[g.key],label:tierName(g.key)})))}
  <div class="rows" style="margin-top:6px">
  ${gs.map(g=>{
    const p=plan[g.key];
    return `<div class="row" style="padding:9px 0">
      <div class="lbl">${esc(tierName(g.key))}<small>${esc(nCre(g.n)+" · "+pc(g.er,1)+" "+t("l.er"))}</small></div>
      <div class="bar" style="font-size:12px;color:var(--ink2)">${p?`${t("l.plan")} ${p.n} · ${(p.s*100).toFixed(0)}%`:"—"}</div>
      <div class="val num" style="color:var(--goldbright)">${usd(g.cpe)}</div>

function mktER(rows){
  const gs=groupBy(rows,"market").filter(g=>g.er!=null).sort((a,b)=>b.er-a.er).slice(0,14);
  return hbars(gs.map(g=>({
    label:mktNameS(g.key), sub:nCre(g.n),
    v:g.er, vt:pc(g.er,1), vcolor:g.er>=M.er_floor?"var(--goldbright)":"var(--rustbright)",
    color:g.er>=M.er_floor?"var(--gold)":"var(--rust)",
    tip:`${t("l.er")}:${pc(g.er)}|${t("l.avgviews")}:${nk(g.views)}|${t("l.creators")}:${g.n}`

  + legend([{color:"var(--gold)",label:t("f.floor.ok")},{color:"var(--rust)",label:t("f.floor.no")},{dash:true,label:t("l.floor")}]);
}

        <div style="font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px">${esc(t("c.verify.band"))}</div>

function secViews(rows){

/* ══════════════════════════════════════════════ ROSTER ══ */
const COLS = [
  {k:"name",     l:"l.name",     n:false},
  {k:"market",   l:"l.market",   n:false},
  {k:"platform", l:"l.platform", n:false},
  {k:"tier",     l:"l.tier",     n:false},
  {k:"archetype",l:"l.archetype",n:false},
  {k:"followers",l:"l.followers",n:true},
  {k:"views",    l:"l.views",    n:true},
  {k:"impressions",l:"l.imp",    n:true},
  {k:"er",       l:"l.er",       n:true},
  {k:"geo_home", l:"l.geo",      n:true},
  {k:"cpe",      l:"l.cpe",      n:true, mod:true},
  {k:"fee",      l:"l.fee",      n:true, mod:true, int:true},
  {k:"rate_source",l:"l.rate",   n:false, int:true},
  {k:"gates_passed",l:"l.gates", n:true},
  {k:"flags",    l:"l.flags",    n:false, int:true}
];
const FLAG_ICON = {round_er:"◷", above_band:"▲", below_band:"▼", eng_capped:"⚠", view_spike:"⚡", no_quote:"$"};
function secRoster(rows){
  const cols = COLS.filter(c=> !c.int || S.role==="internal");
  const sorted = rows.slice().sort((a,b)=>{
    const k=S.sort.k, d=S.sort.dir;
    let x=a[k], y=b[k];
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="string") return d*x.localeCompare(y);
    return d*(x-y);
  });
  const pages = Math.max(1, Math.ceil(sorted.length/S.per));
  if(S.page>pages) S.page=pages;
  const slice = sorted.slice((S.page-1)*S.per, S.page*S.per);

  const cell=(c,col)=>{
    const v=c[col.k];
    switch(col.k){
      case "name": return `<td><span class="cname">${esc(c.name)}</span>
        <span class="chandle">${c.link?`<a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.handle||"")}</a>`:esc(c.handle||"")}</span></td>`;
      case "market": return `<td>${esc(mktName(c))}${c.out_of_scope?` <span class="chip" style="font-size:9px;padding:1px 6px">${esc(t("l.outscope"))}</span>`:""}</td>`;
      case "tier": return `<td><span class="pill ${esc(c.tier)}">${esc(tierName(c.tier))}</span></td>`;
      case "archetype": return `<td>${esc(archName(c.archetype))}</td>`;
      case "followers": case "views": case "impressions": return `<td class="n num">${nk(v,0)}</td>`;
      case "er": return `<td class="n num"><span class="${v>=M.er_floor?"er-ok":"er-no"}">${pc(v,2)}</span></td>`;
      case "geo_home": return `<td class="n num" title="${esc(c.geo_txt)}">${pc(v,0)}</td>`;
      case "cpe": return `<td class="n num">${usd(v)}</td>`;
      case "fee": return `<td class="n num">${usdI(v)}</td>`;
      case "gates_passed": return `<td class="n num" title="${esc(c.fail_reasons.map(f=>t("g."+f)).join(", "))}">
        <span style="color:${c.cleared?"var(--goldbright)":"var(--ink2)"};font-weight:700">${v}<span style="color:var(--ink3);font-weight:400">/9</span></span></td>`;
      case "flags": return `<td>${ (c.flags||[]).length
        ? c.flags.map(f=>`<span class="flg ${f==="round_er"||f==="above_band"||f==="eng_capped"?"hot":""}" title="${esc(t("v."+f)+" — "+t("v."+f+".d"))}">${FLAG_ICON[f]||"•"}</span>`).join("")
        : `<span class="faint">—</span>` }</td>`;
      default: return `<td>${esc(v??"—")}</td>`;
    }
  };

  return `
  <div class="sechead"><p class="eyebrow">${esc(t("nav.roster"))}</p>
    <h2>${esc(t("s.roster.h"))}</h2><p>${esc(t("s.roster.p"))}</p></div>
  <div class="card flush">
    <div class="tblwrap"><table>
      <thead><tr>${cols.map(c=>`<th class="${c.n?"n":""} ${S.sort.k===c.k?"srt":""}" data-sort="${c.k}">
        ${esc(t(c.l))}${c.mod?' <span class="modelled" style="border:none;padding:0">◈</span>':""}
        <span class="ar">${S.sort.k===c.k?(S.sort.dir<0?"▼":"▲"):"▾"}</span></th>`).join("")}</tr></thead>
      <tbody>${ slice.length
        ? slice.map(c=>`<tr class="${c.recommended?"rec":""}" data-cid="${c.id}">${cols.map(col=>cell(c,col)).join("")}</tr>`).join("")
        : `<tr><td colspan="${cols.length}" style="padding:40px;text-align:center;color:var(--ink3)">${esc(t("l.none"))}</td></tr>` }</tbody>
    </table></div>
    <div class="tblfoot">
      <span>${esc(t("f.showing"))} <b style="color:var(--ink)">${(S.page-1)*S.per+1}–${Math.min(S.page*S.per,sorted.length)}</b> ${esc(t("l.of"))} ${sorted.length} · <span style="color:var(--goldbright)">▍</span> ${esc(t("l.recommended"))}</span>
      <div class="pager">
        <button id="pg-prev" ${S.page<=1?"disabled":""}>${esc(t("l.prev"))}</button>
        <span style="padding:0 8px" class="num">${S.page} / ${pages}</span>
        <button id="pg-next" ${S.page>=pages?"disabled":""}>${esc(t("l.next"))}</button>
      </div>
    </div>
  </div>
  ${S.role==="internal"?`<div class="note">${t("n.modelled")}</div>`:""}`;
}

/* ══════════════════════════════════════════════ RENDER ══ */
function render(){
  const rows = filtered();
  renderChips();
  $("#f-count").innerHTML = `${t("f.showing")} <b class="num">${rows.length}</b> ${t("l.of")} <span class="num">${D.creators.length}</span> ${t("f.creators")}`;
  const m=$("#main");
  const map = {overview:secOverview, engagement:secEngagement, views:secViews,
               economics:secEconomics, roster:secRoster, coverage:secCoverage, plan:secPlan};
  m.innerHTML = `<section class="sec">${ map[S.sec](rows) }</section>`;
  wire();
}
function wire(){
  $$("#main th[data-sort]").forEach(th=> th.onclick=()=>{
    const k=th.dataset.sort;
    if(S.sort.k===k) S.sort.dir*=-1; else { S.sort.k=k; S.sort.dir = ["name","market","platform","tier","archetype","rate_source"].includes(k)?1:-1; }
    render();
  });
  const p=$("#pg-prev"), nx=$("#pg-next");
  if(p) p.onclick=()=>{ S.page--; render(); };
  if(nx) nx.onclick=()=>{ S.page++; render(); };
  $$("#main tbody tr[data-cid]").forEach(tr=> tr.onclick=(e)=>{
    if(e.target.closest("a")) return;
    const c=D.creators.find(x=>x.id===tr.dataset.cid);
    if(c && c.link) window.open(c.link,"_blank","noopener");
  });
  $$("#main [data-click]").forEach(el=> el.onclick=()=>{
    const o=JSON.parse(el.dataset.click);
    Object.assign(S.f,o); S.page=1; buildShell(); render();
  });
}

/* ══════════════════════════════════════════════ TOOLTIP ══ */
(function(){
  const tip=$("#tip");
  let raf=null;
  document.addEventListener("pointerover", e=>{
    const el=e.target.closest("[data-tip]");
    if(!el){ tip.classList.remove("on"); return; }
    const title=el.dataset.tt||"", body=el.dataset.tip||"";
    tip.innerHTML = (title?`<div class="t">${esc(title)}</div>`:"") +
      body.split("|").filter(Boolean).map(r=>{
        const i=r.indexOf(":");
        return i>0 ? `<div class="r"><span>${esc(r.slice(0,i))}</span><b>${esc(r.slice(i+1))}</b></div>`
                   : `<div class="r"><span>${esc(r)}</span></div>`;
      }).join("");
    tip.classList.add("on");
  });
  document.addEventListener("pointerout", e=>{ if(!e.relatedTarget || !e.relatedTarget.closest?.("[data-tip]")) tip.classList.remove("on"); });
  document.addEventListener("pointermove", e=>{
    if(!tip.classList.contains("on")) return;
    if(raf) return;
    raf=requestAnimationFrame(()=>{
      raf=null;
      const r=tip.getBoundingClientRect();
      let x=e.clientX+14, y=e.clientY+14;
      if(x+r.width>innerWidth-10) x=e.clientX-r.width-14;
      if(y+r.height>innerHeight-10) y=e.clientY-r.height-14;
      tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px";
    });
  });
  addEventListener("scroll", ()=> tip.classList.remove("on"), {passive:true});
})();

/* ══════════════════════════════════════════════ BOOT ══ */
$("#gate-form").addEventListener("submit", gateSubmit);
$$("#lang-tgl button, .gate-lang button").forEach(b=> b.onclick=()=>{ S.lang=b.dataset.lang; applyLang(); });
$("#theme-btn").onclick=()=>{ S.theme = S.theme==="dark"?"light":"dark"; applyTheme(); };
$("#out-btn").onclick=signOut;
$("#code").addEventListener("input", ()=> $("#gate-err").classList.remove("on"));

applyTheme();
applyLang();
const saved = sessionStorage.getItem(CONFIG.store+"_role");
if(saved && ["client","internal"].includes(saved)){ S.role=saved; openApp(); }

</script>
