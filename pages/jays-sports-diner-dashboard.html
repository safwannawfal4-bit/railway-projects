/* ================= TOKENS ================= */
:root{
  --yellow:#F2CD1C; --yellow-soft:rgba(242,205,28,.14); --yellow-line:rgba(242,205,28,.28);
  --ember:#F5801E; --chalk:#F2EEE2;
}
:root[data-theme="dark"]{
  --bg:#0B0A07; --surface:#14120D; --surface-2:#1B1811; --panel-line:rgba(242,205,28,.13);
  --text:#F2EEE2; --text-dim:#B0A78F; --text-faint:#7A7360; --border:rgba(242,238,226,.1);
  --ember-ink:#F5801E; --chip-bg:#14120D; --grid-line:rgba(242,238,226,.07);
  --glow:0 0 22px rgba(242,205,28,.22); --scan:rgba(242,238,226,.022);
  --table-hover:rgba(242,205,28,.06); --input-bg:#0B0A07;
}
:root[data-theme="light"]{
  --bg:#F5F0E4; --surface:#FFFDF7; --surface-2:#EFE9D9; --panel-line:rgba(20,18,12,.14);
  --text:#161309; --text-dim:#6E6752; --text-faint:#98917C; --border:rgba(20,18,12,.12);
  --ember-ink:#C4640C; --chip-bg:#FFFDF7; --grid-line:rgba(20,18,12,.08);
  --glow:0 6px 18px rgba(20,18,12,.10); --scan:rgba(20,18,12,.012);
  --table-hover:rgba(242,205,28,.14); --input-bg:#FFFDF7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Barlow',system-ui,sans-serif; background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.5; min-height:100vh;
  background-image:repeating-linear-gradient(0deg,var(--scan) 0 1px,transparent 1px 4px);
}
::selection{background:var(--yellow);color:#0B0A07}
h1,h2,h3{font-weight:400}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-user-select:none;user-select:none}
.tabs,.filterbar,.fbanner,.hbars,.funnel,.pcards,.roster,table.stat th{-webkit-user-select:none;user-select:none}
input{font-family:inherit}
canvas{max-width:100%}
.anton{font-family:'Anton',Impact,sans-serif;font-weight:400}
.num{font-family:'Anton',Impact,sans-serif;letter-spacing:.02em}

/* ================= GATE ================= */
#gate{
  position:fixed;inset:0;z-index:100;background:#0B0A07;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;padding:24px;
  background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(242,205,28,.09),transparent 65%),
    repeating-linear-gradient(0deg,rgba(242,238,226,.02) 0 1px,transparent 1px 4px);
}
#gate.hidden{display:none}
#gate .logo{width:min(210px,52vw);height:auto;display:block;animation:gateLogo .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes gateLogo{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.ticket{
  margin-top:26px;width:min(360px,92vw);background:#14120D;border:1px solid rgba(242,205,28,.25);
  border-radius:10px;padding:26px 28px 24px;position:relative;
  animation:gateLogo .8s .12s cubic-bezier(.2,.9,.3,1.2) both;
}
.ticket::before{
  content:"";position:absolute;top:54px;left:14px;right:14px;border-top:2px dashed rgba(242,238,226,.14);
}
.ticket .t-label{
  font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.34em;color:var(--yellow);text-align:center;
  padding-bottom:26px;
}
.ticket .t-sub{font-size:12.5px;color:#B0A78F;text-align:center;margin-bottom:14px}
.ticket input{
  width:100%;background:#0B0A07;border:1px solid rgba(242,238,226,.18);border-radius:6px;color:#F2EEE2;
  font-size:17px;letter-spacing:.18em;text-align:center;padding:12px 10px;text-transform:uppercase;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.ticket input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(242,205,28,.15)}
.ticket .t-btn{
  width:100%;margin-top:12px;background:var(--yellow);color:#0B0A07;font-family:'Anton',sans-serif;
  font-size:16px;letter-spacing:.22em;padding:12px;border-radius:6px;
  transition:transform .12s, box-shadow .2s;box-shadow:0 0 0 rgba(242,205,28,0);
}
.ticket .t-btn:hover{box-shadow:0 0 26px rgba(242,205,28,.35)}
.ticket .t-btn:active{transform:scale(.965)}
.ticket .t-err{color:#F5801E;font-size:12.5px;text-align:center;min-height:18px;margin-top:10px;font-weight:600}
.ticket.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#gate .g-foot{margin-top:22px;font-size:11.5px;letter-spacing:.14em;color:#7A7360;text-transform:uppercase}
#gate .g-foot b{color:#B0A78F;font-weight:700}

/* ================= HEADER ================= */
header.top{
  background:#0B0A07;border-bottom:1px solid rgba(242,205,28,.18);
  padding:14px clamp(14px,3.5vw,34px);display:flex;align-items:center;gap:16px;
}
header.top .logo-chip{display:flex;align-items:center;gap:13px;min-width:0}
header.top img{height:44px;width:44px;border-radius:8px;object-fit:cover;flex:none}
header.top .h-name{line-height:1.15}
header.top .h-name .l1{font-family:'Anton',sans-serif;font-size:16.5px;letter-spacing:.09em;color:#F2EEE2;white-space:nowrap}
header.top .h-name .l2{font-size:11px;letter-spacing:.22em;color:#B0A78F;text-transform:uppercase;white-space:nowrap}
header.top .h-name .l2 b{color:var(--yellow);font-weight:700}
header.top .h-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;border:1px solid rgba(242,238,226,.2);color:#B0A78F;white-space:nowrap;
}
.pill.demo{color:#0B0A07;background:var(--ember);border-color:var(--ember)}
.pill.live{color:#0B0A07;background:var(--yellow);border-color:var(--yellow)}
.pill.role{color:var(--yellow);border-color:rgba(242,205,28,.4)}
.hbtn{
  width:36px;height:36px;border-radius:8px;border:1px solid rgba(242,238,226,.18);display:flex;
  align-items:center;justify-content:center;font-size:15px;color:#F2EEE2;transition:all .18s;flex:none;
}
.hbtn:hover{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 14px rgba(242,205,28,.2)}
.hbtn:active{transform:scale(.92)}

/* ================= TABS + FILTER DECK ================= */
.deck{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
:root[data-theme="light"] .deck{box-shadow:0 8px 20px rgba(20,18,12,.06)}
.tabs{
  display:flex;gap:6px;padding:12px clamp(14px,3.5vw,34px) 0;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-family:'Anton',sans-serif;font-size:14.5px;letter-spacing:.11em;color:var(--text-dim);
  padding:10px 16px 9px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
  transition:color .18s, background .18s, box-shadow .25s, transform .12s;white-space:nowrap;
  display:flex;align-items:center;gap:8px;position:relative;
}
.tab .t-idx{font-family:'Barlow',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--text-faint);transition:color .18s}
.tab:hover{color:var(--text)}
.tab:active{transform:translateY(1px)}
.tab.on{
  background:var(--yellow);color:#0B0A07;box-shadow:0 -4px 26px rgba(242,205,28,.3);
}
.tab.on .t-idx{color:rgba(11,10,7,.55)}
.filterbar{
  display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;
  padding:11px clamp(14px,3.5vw,34px) 12px;border-top:1px solid var(--border);
}
.fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fgroup .fg-label{
  font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--text-faint);text-transform:uppercase;margin-right:2px;
}
.chip{
  font-family:'Anton',sans-serif;font-size:12px;letter-spacing:.09em;color:var(--text-dim);
  border:1px solid var(--border);background:var(--chip-bg);border-radius:6px;padding:6px 11px 5px;
  transition:all .16s cubic-bezier(.34,1.56,.64,1);text-transform:uppercase;
}
.chip:hover{border-color:var(--yellow-line);color:var(--text)}
.chip:active{transform:scale(.9)}
.chip.on{
  background:var(--yellow);border-color:var(--yellow);color:#0B0A07;
  box-shadow:0 0 16px rgba(242,205,28,.35);transform:scale(1.04);
}
.fgroup.ctx{border-left:2px solid var(--yellow-line);padding-left:16px;
  animation:ctxIn .35s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes ctxIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* active filter banner */
.fbanner{
  display:none;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px clamp(14px,3.5vw,34px);background:var(--yellow);color:#0B0A07;
}
.fbanner.show{display:flex;animation:bannerIn .3s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes bannerIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.fbanner .fb-label{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:.16em}
.ftag{
  display:inline-flex;align-items:center;gap:6px;background:#0B0A07;color:#F2EEE2;border-radius:5px;
  font-size:12px;font-weight:700;padding:4px 9px;animation:tagPop .25s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes tagPop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.ftag b{color:var(--yellow);font-weight:800;cursor:pointer;font-size:13px;line-height:1}
.fb-clear{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:2px solid #0B0A07;padding-bottom:1px}

/* ================= LAYOUT / PANELS ================= */
main{max-width:1240px;margin:0 auto;padding:22px clamp(14px,3.5vw,34px) 40px}
.view{display:none}
.view.on{display:block}
.panel{
  background:var(--surface);border:1px solid var(--panel-line);border-radius:12px;
  padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden;
}
.panel.reveal{animation:panelIn .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes panelIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.p-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.p-title{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.07em;color:var(--text)}
.p-sub{font-size:13px;color:var(--text-dim)}
.tape{
  display:inline-block;background:var(--yellow);color:#0B0A07;font-size:10.5px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;padding:3px 9px;transform:rotate(-1.4deg);border-radius:2px;
}
.p-head .spacer{flex:1}
.switcher{display:flex;gap:5px}
.switcher .chip{font-size:10.5px;padding:5px 9px 4px}

/* ================= KPI TILES ================= */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:940px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:var(--surface);border:1px solid var(--panel-line);border-radius:10px;padding:14px 15px 12px;
  transition:border-color .2s, box-shadow .2s, transform .2s;position:relative;overflow:hidden;
}
.kpi:hover{border-color:var(--yellow-line);box-shadow:var(--glow);transform:translateY(-2px)}
.kpi .k-label{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px}
.kpi .k-val{font-family:'Anton',sans-serif;font-size:30px;line-height:1;color:var(--text);letter-spacing:.015em;transition:color .2s}
.kpi .k-val.ticked{animation:tick .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tick{
  0%{color:var(--yellow);text-shadow:0 0 18px rgba(242,205,28,.55);transform:translateY(2px) scale(1.03)}
  100%{color:var(--text);text-shadow:none;transform:none}
}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:7px;color:var(--text-faint)}
.kpi .k-delta.up{color:var(--yellow)}
:root[data-theme="light"] .kpi .k-delta.up{color:#8a6d00}
.kpi .k-delta small{color:var(--text-faint);font-weight:600;letter-spacing:.02em}

/* ================= SCOREBOARD HERO ================= */
.hero{
  background:#0A0906;border:1px solid rgba(242,205,28,.3);border-radius:14px;margin-bottom:16px;
  padding:26px clamp(16px,3vw,40px) 22px;position:relative;overflow:hidden;
  background-image:
    radial-gradient(ellipse 55% 65% at 50% -10%,rgba(242,205,28,.13),transparent 70%),
    radial-gradient(rgba(242,205,28,.1) 1px,transparent 1.4px);
  background-size:auto,9px 9px;
}
.hero .h-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.hero .h-league{font-family:'Anton',sans-serif;font-size:12px;letter-spacing:.34em;color:#B0A78F;text-transform:uppercase}
.hero .h-live{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--yellow)}
.hero .h-live i{width:7px;height:7px;border-radius:50%;background:var(--yellow);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 10px rgba(242,205,28,.9)}50%{opacity:.25;box-shadow:none}}
.score-row{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,3vw,36px);align-items:center}
.side{text-align:center}
.side .s-team{font-family:'Anton',sans-serif;font-size:clamp(13px,1.6vw,17px);letter-spacing:.2em;color:#F2EEE2;margin-bottom:2px}
.side .s-cap{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#7A7360;margin-bottom:10px}
.side .s-num{
  font-family:'Anton',sans-serif;font-size:clamp(40px,6.2vw,74px);line-height:1;color:var(--yellow);
  text-shadow:0 0 34px rgba(242,205,28,.4);letter-spacing:.01em;
}
.side.away .s-num{color:#F2EEE2;text-shadow:0 0 24px rgba(242,238,226,.22)}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.mid .m-badge{
  border:2px solid var(--yellow);border-radius:12px;padding:13px 18px 10px;text-align:center;
  box-shadow:0 0 30px rgba(242,205,28,.25), inset 0 0 22px rgba(242,205,28,.07);
}
.mid .m-x{font-family:'Anton',sans-serif;font-size:clamp(30px,3.6vw,44px);line-height:1;color:var(--yellow)}
.mid .m-cap{font-size:9.5px;font-weight:800;letter-spacing:.24em;color:#B0A78F;text-transform:uppercase;margin-top:4px}
.hero .h-foot{
  margin-top:20px;padding-top:14px;border-top:2px dashed rgba(242,238,226,.12);
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#B0A78F;text-align:center;
}
.hero .h-foot b{color:var(--yellow);font-weight:700}

/* ================= GRID HELPERS ================= */
.duo{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:stretch}
.duo>.panel{margin-bottom:0}
.gwrap{margin-bottom:16px}
@media(max-width:880px){.duo{grid-template-columns:1fr}.duo>.panel{margin-bottom:0}}
.chart-wrap{position:relative;min-height:260px}
.chart-wrap.tall{min-height:300px}
.chart-wrap canvas{position:absolute;inset:0}

/* ================= DOM BARS (who scored / formats / funnel) ================= */
.hbars{display:flex;flex-direction:column;gap:13px}
.hbar-row{cursor:default}
.hbar-row.clickable{cursor:pointer}
.hbar-row .hb-top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.hbar-row .hb-name{font-weight:700;font-size:13.5px;letter-spacing:.03em}
.hbar-row .hb-cap{font-size:11.5px;color:var(--text-faint)}
.hbar-row .hb-val{margin-left:auto;font-family:'Anton',sans-serif;font-size:16px;color:var(--text);letter-spacing:.02em}
.hbar-row .hb-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.hbar-row .hb-fill{
  height:100%;width:0;border-radius:4px;background:var(--yellow);
  transition:width .9s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 6px,transparent 6px 12px);
}
.hbar-row.alt .hb-fill{background-color:var(--ember)}
.hbar-row.mut .hb-fill{background-color:var(--text-faint)}
.hbar-row.on .hb-name{color:var(--yellow)}
:root[data-theme="light"] .hbar-row.on .hb-name{color:#8a6d00}
.hbar-row.clickable:hover .hb-name{color:var(--yellow)}
:root[data-theme="light"] .hbar-row.clickable:hover .hb-name{color:#8a6d00}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fstep{display:grid;grid-template-columns:150px 1fr 92px;gap:12px;align-items:center}
.fstep .fs-name{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);text-align:right}
.fstep .fs-track{height:26px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex;justify-content:center}
.fstep .fs-fill{
  height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--yellow));border-radius:5px;
  transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:2px;
}
.fstep .fs-val{font-family:'Anton',sans-serif;font-size:15px;color:var(--text)}
.fstep .fs-rate{grid-column:2;text-align:center;font-size:10.5px;font-weight:700;color:var(--text-faint);letter-spacing:.06em;margin-top:-3px}
@media(max-width:620px){.fstep{grid-template-columns:96px 1fr 74px}.fstep .fs-name{font-size:10px}}

/* ================= TABLES ================= */
.twrap{overflow-x:auto}
table.stat{width:100%;border-collapse:collapse;min-width:640px}
table.stat th{
  font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);
  text-align:center;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
}
table.stat th:first-child{text-align:left}
table.stat th.sorted{color:var(--yellow)}
:root[data-theme="light"] table.stat th.sorted{color:#8a6d00}
table.stat td{padding:10px;border-bottom:1px solid var(--border);text-align:center;font-size:13.5px;white-space:nowrap}
table.stat td:first-child{text-align:left}
table.stat tr.rowc{cursor:pointer;transition:background .15s}
table.stat tr.rowc:hover{background:var(--table-hover)}
table.stat tr.on td{background:var(--yellow-soft)}
table.stat tr.on td:first-child{box-shadow:inset 3px 0 0 var(--yellow)}
table.stat .t-name{font-weight:700}
table.stat .t-tag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);display:block}
table.stat td.num-cell{font-family:'Anton',sans-serif;font-size:14.5px;letter-spacing:.02em}
.badge{
  display:inline-block;font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.05em;
  padding:4px 10px 3px;border-radius:5px;background:var(--yellow);color:#0B0A07;
}
.badge.mid{background:var(--surface-2);color:var(--text)}
.badge.dim{background:var(--surface-2);color:var(--text-dim)}
.mono-month{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.14em;color:var(--text)}

/* ================= ROSTER CARDS ================= */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.player{
  background:var(--surface-2);border:1px solid var(--panel-line);border-radius:12px;padding:16px 16px 13px;
  cursor:pointer;transition:all .22s cubic-bezier(.2,.9,.3,1);position:relative;overflow:hidden;
}
.player:hover{transform:translateY(-3px);border-color:var(--yellow-line);box-shadow:var(--glow)}
.player.on{border-color:var(--yellow);box-shadow:0 0 24px rgba(242,205,28,.3)}
.player .pl-num{
  position:absolute;top:6px;right:12px;font-family:'Anton',sans-serif;font-size:44px;line-height:1;
  color:var(--yellow);opacity:.14;pointer-events:none;
}
.player.on .pl-num{opacity:.4}
.player .pl-star{
  position:absolute;top:12px;right:12px;background:var(--yellow);color:#0B0A07;font-size:9px;font-weight:800;
  letter-spacing:.14em;padding:3px 7px;border-radius:3px;transform:rotate(2deg);
}
.player .pl-name{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:.05em;margin-bottom:1px;padding-right:44px}
.player .pl-handle{font-size:11.5px;color:var(--text-faint);margin-bottom:10px}
.player .pl-tags{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.player .pl-tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--text-dim)}
.player .pl-tag.tier{border-color:var(--yellow-line);color:var(--yellow)}
:root[data-theme="light"] .player .pl-tag.tier{color:#8a6d00;border-color:rgba(138,109,0,.4)}
.player .pl-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px dashed var(--border);padding-top:11px}
.player .pl-stat .v{font-family:'Anton',sans-serif;font-size:16.5px;color:var(--text)}
.player .pl-stat .l{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-top:1px}

/* platform mini cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pcard{
  background:var(--surface-2);border:1px solid var(--panel-line);border-radius:10px;padding:13px 14px;
  cursor:pointer;transition:all .2s;
}
.pcard:hover{border-color:var(--yellow-line);transform:translateY(-2px)}
.pcard.on{border-color:var(--yellow);box-shadow:0 0 18px rgba(242,205,28,.25)}
.pcard .pc-name{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.08em;margin-bottom:8px}
.pcard.on .pc-name{color:var(--yellow)}
:root[data-theme="light"] .pcard.on .pc-name{color:#8a6d00}
.pcard .pc-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);padding:2px 0}
.pcard .pc-row b{font-family:'Anton',sans-serif;font-size:13.5px;color:var(--text);font-weight:400;letter-spacing:.03em}

/* ================= ADMIN / COACH MODE ================= */
.coach{
  display:none;background:var(--surface);border:1px dashed var(--yellow-line);border-radius:12px;
  padding:16px 18px;margin-bottom:18px;
}
.coach.show{display:block;animation:panelIn .4s cubic-bezier(.2,.9,.3,1) both}
.coach .c-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.coach .c-title{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.14em;color:var(--yellow)}
:root[data-theme="light"] .coach .c-title{color:#8a6d00}
.coach .c-sub{font-size:12px;color:var(--text-dim)}
.coach .c-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cbtn{
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);
  border-radius:6px;padding:7px 12px;color:var(--text);transition:all .15s;
}
.cbtn:hover{border-color:var(--yellow);color:var(--yellow)}
:root[data-theme="light"] .cbtn:hover{color:#8a6d00;border-color:#8a6d00}
.cbtn.primary{background:var(--yellow);color:#0B0A07;border-color:var(--yellow)}
.cbtn.primary:hover{box-shadow:0 0 16px rgba(242,205,28,.4);color:#0B0A07}
.coach .c-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:760px){.coach .c-cols{grid-template-columns:1fr}}
.coach h4{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}
.sec-row{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;
  margin-bottom:6px;background:var(--surface-2);
}
.sec-row.off{opacity:.45}
.sec-row input[type=text]{
  flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-weight:600;min-width:60px;
}
.sec-row .sbtn{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);flex:none;transition:all .15s}
.sec-row .sbtn:hover{border-color:var(--yellow);color:var(--yellow)}
.kpi-picks{display:flex;flex-wrap:wrap;gap:6px}
.kpick{
  font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:99px;padding:5px 11px;
  color:var(--text-dim);transition:all .15s;
}
.kpick.on{background:var(--yellow);border-color:var(--yellow);color:#0B0A07}
.coach .c-note{font-size:11px;color:var(--text-faint);margin-top:10px}

/* ================= FOOTER + MISC ================= */
footer{
  border-top:1px solid var(--border);padding:22px clamp(14px,3.5vw,34px) 30px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1240px;margin:0 auto;
}
footer .f-solvera{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.2em;color:var(--text)}
footer .f-note{font-size:12px;color:var(--text-faint)}
footer .f-right{margin-left:auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint)}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--yellow);
  color:#0B0A07;font-weight:700;font-size:13px;padding:10px 18px;border-radius:8px;z-index:90;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty-note{font-size:13px;color:var(--text-faint);padding:14px 0;text-align:center}

@media(max-width:560px){header.top .h-name .l2{display:none}}
@media(max-width:640px){
  .kpi .k-val{font-size:25px}
  .panel{padding:16px}
  header.top .h-name .l1{font-size:14px}
  header.top .h-name .l2{font-size:9.5px}
  .pill.role{display:none}
  .score-row{grid-template-columns:1fr;gap:14px}
  .mid{order:3}
  .side .s-num{font-size:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

function genSales(){
  const wd=[0.72,0.55,0.62,0.78,0.95,1.35,1.42]; // sun..sat
  DAYS.forEach(ds=>{
    const g=1+monthIdx(mkOf(ds))*0.075;               // season growth
    let base=2650*wd[dow(ds)]*g*rnd(0.9,1.1);
    if(monthIdx(mkOf(ds))===4) base*=1.07;   // june influencer push
    if(MATCH_NIGHTS.has(ds)) base*=rnd(1.55,1.9);      // match night pop
    const revenue=Math.round(base);
    const orders=Math.round(revenue/rnd(26,33));
    DATA.sales.push({date:ds,revenue,orders});
  });
}

function genPaid(){
  CAMPAIGNS.forEach(c=>{
    const days=DAYS.filter(ds=>{const mi=monthIdx(mkOf(ds));return mi>=c.from&&mi<=c.to});
    const active=new Set();
    while(active.size<Math.min(c.d* (monthIdx(MKEYS[c.to])-c.from+1)/2, days.length*0.75)) active.add(pick(days));
    [...active].sort().forEach(ds=>{
      const g=1+monthIdx(mkOf(ds))*0.06;
      const spend=+(rnd(14,46)*g*(MATCH_NIGHTS.has(ds)?1.5:1)).toFixed(2);
      const impressions=Math.round(spend/c.cpm*1000*rnd(0.9,1.1));
      const clicks=Math.round(impressions*c.ctr*rnd(0.85,1.15));
      const lpv=Math.round(clicks*rnd(0.72,0.86));
      const atc=Math.round(lpv*rnd(0.16,0.28));
      const orders=Math.round(clicks*c.cvr*rnd(0.8,1.25));
      const revenue=Math.round(orders*rnd(28,37));
      DATA.paid.push({date:ds,campaign:c.name,platform:c.platform,objective:c.objective,funnel:c.funnel,
        creativeType:c.type,creative:c.name+" · "+c.type,spend,impressions,clicks,lpv,atc,orders,revenue});
    });
  });
}

  Reel:["Wing drop in slow-mo","Match night crowd cam","Smash burger build","Kitchen rush hour","Derby day chants","Loaded fries pour","Halftime challenge","Buzzer beater bites","Cheese pull test","Game face check"],
  Carousel:["This week's fixtures","New menu lineup","Fan photos of the week","Burger starting XI","Sauce power rankings","Behind the pass"],

function genOrganic(){
  const plats=[["Instagram",16],["TikTok",11]];
  plats.forEach(([p,perMonth])=>{
    MONTHS.forEach(([mk,,ndays])=>{
      const mi=monthIdx(mk), g=1+mi*0.11;
      const n=Math.round(perMonth*rnd(0.9,1.15));
      for(let i=0;i<n;i++){
        const type=pick(p==="TikTok"?["Reel","Reel","Reel","Static"]:["Reel","Reel","Carousel","Static","Story"]);
        const ds=mk+"-"+String(rint(1,ndays)).padStart(2,"0");
        const baseReach=(type==="Reel"?rnd(6000,26000):type==="Carousel"?rnd(2800,7500):type==="Story"?rnd(1500,3400):rnd(2000,5600))*g*(p==="TikTok"?1.25:1);
        const reach=Math.round(baseReach*(MATCH_NIGHTS.has(ds)?rnd(1.2,1.7):1));
        const views=Math.round(reach*rnd(1.15,1.65));
        const er=type==="Reel"?rnd(0.055,0.098):type==="Story"?rnd(0.025,0.045):rnd(0.038,0.07);
        const eng=Math.round(reach*er);
        const likes=Math.round(eng*rnd(0.72,0.82)), comments=Math.round(eng*rnd(0.05,0.1)),
              saves=Math.round(eng*rnd(0.06,0.12)), shares=Math.max(0,eng-likes-comments-saves);
        DATA.organic.push({date:ds,platform:p,postType:type,name:pick(POST_BANK[type]),reach,views,likes,comments,saves,shares,
          profileVisits:Math.round(reach*rnd(0.025,0.05))});
      }
    });
  });
  DATA.organic.sort((a,b)=>a.date<b.date?-1:1);
}

function genFollowers(){

function genInfluencers(){
  const plan=[[0,1],[1,2],[2,2],[3,3],[4,4],[5,3]]; // month -> activations count
  const queue=[];
  plan.forEach(([mi,count])=>{for(let i=0;i<count;i++)queue.push(mi)});
  let ci=0;
  // ensure the macro lands in June (the big push)
  const order=[6,3,4,1,5,2,7,0, 3,5,2,4,0,6,1];
  queue.forEach((mi,qi)=>{
    const cr=CREATORS[order[qi%order.length]];
    const isJuneMacro=(mi===4&&qi===plan.slice(0,4).reduce((a,[,c])=>a+c,0)); // force one macro drop in June
    const c=isJuneMacro?CREATORS[0]:cr;
    const [mk,,nd]=MONTHS[mi];
    const ds=mk+"-"+String(rint(3,nd-2)).padStart(2,"0");
    const reach=Math.round(rnd(14000,26000)*c.mult);
    const views=Math.round(reach*rnd(1.2,1.9));
    const eng=Math.round(reach*rnd(0.05,0.09));
    const cost=Math.round(120*c.mult*rnd(0.85,1.2));
    const red=Math.round(reach*rnd(0.0007,0.0013));
    const revenue=Math.round(red*rnd(30,40)); // groups order more
    DATA.influencers.push({date:ds,influencer:c.name,handle:c.handle,tier:c.tier,platform:c.platform,
      deliverable:pick(["Reel + 3 Stories","Reel + 2 Stories","TikTok + Stories","Review Reel"]),
      cost,reach,views,engagements:eng,code:c.name.split(" ")[0].toUpperCase()+"10",redemptions:red,revenue});
    ci++;
  });
  DATA.influencers.sort((a,b)=>a.date<b.date?-1:1);
}

/* ================= AGGREGATION ================= */
const S=(rows,k)=>rows.reduce((a,r)=>a+(+r[k]||0),0);
const dv=(a,b)=>b>0?a/b:0;
const ORG_CVR=0.015, ORG_AOV=29;
function orgAssistRevenue(rows){return S(rows,"profileVisits")*ORG_CVR*ORG_AOV}
function orgAssistOrders(rows){return S(rows,"profileVisits")*ORG_CVR}

function followerEnds(rows){
  const by={};
  rows.forEach(r=>{(by[r.platform]=by[r.platform]||[]).push(r)});
  let start=0,end=0;
  Object.values(by).forEach(list=>{list.sort((a,b)=>a.date<b.date?-1:1);start+=list[0].followers;end+=list[list.length-1].followers});
  return {start,end};
}
function totals(){
  const sales=fSales(),paid=fPaid(),org=fOrganic(),inf=fInfl(),fol=fFollowers();
  const storeRev=S(sales,"revenue"),storeOrders=S(sales,"orders");
  const spend=S(paid,"spend"),paidRev=S(paid,"revenue"),paidOrders=S(paid,"orders");
  const iCost=S(inf,"cost"),iRev=S(inf,"revenue"),iRed=S(inf,"redemptions");
  const assist=orgAssistRevenue(org);
  const mktCost=spend+iCost;
  const attributed=paidRev+iRev+assist;
  const fe=followerEnds(fol);
  return {sales,paid,org,inf,fol,storeRev,storeOrders,aov:dv(storeRev,storeOrders),
    spend,paidRev,paidOrders,impressions:S(paid,"impressions"),clicks:S(paid,"clicks"),
    lpv:S(paid,"lpv"),atc:S(paid,"atc"),
    iCost,iRev,iRed,iReach:S(inf,"reach"),iViews:S(inf,"views"),iEng:S(inf,"engagements"),
    oReach:S(org,"reach"),oViews:S(org,"views"),
    oEng:S(org,"likes")+S(org,"comments")+S(org,"saves")+S(org,"shares"),
    oPV:S(org,"profileVisits"),assist,mktCost,attributed,
    ret:dv(attributed,mktCost),followersStart:fe.start,followersEnd:fe.end,newFollowers:fe.end-fe.start};
}

/* month-over-selection deltas */
function selMonths(){return F.months.size?MKEYS.filter(m=>F.months.has(m)):MKEYS.slice()}
function monthTotals(mk){
  const keep=F.months; F.months=new Set([mk]);
  const t=totals(); F.months=keep; return t;
}
function deltaFor(fn){
  const ms=selMonths();
  if(ms.length>=2){
    const a=fn(monthTotals(ms[0])),b=fn(monthTotals(ms[ms.length-1]));
    if(a<=0)return null;
    return {pct:(b-a)/a,label:"since "+mLabel(ms[0])};
  }
  const i=MKEYS.indexOf(ms[0]);
  if(i<=0)return null;
  const a=fn(monthTotals(MKEYS[i-1])),b=fn(monthTotals(ms[0]));
  if(a<=0)return null;
  return {pct:(b-a)/a,label:"vs "+mLabel(MKEYS[i-1])};
}

/* weekly buckets over the filtered months */
function weeks(){
  const ds=DAYS.filter(inM);
  const out=[];
  for(let i=0;i<ds.length;i+=7)out.push(ds.slice(i,i+7));
  return out.map(g=>({days:g,label:wLabel(g[0])}));
}
const MSHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function wLabel(ds){const d=+ds.slice(8,10),m=+ds.slice(5,7);return MSHORT[m-1]+" "+d}
function weekly(rows,key,dateKey){
  const map={};rows.forEach(r=>{map[r[dateKey||"date"]]=(map[r[dateKey||"date"]]||0)+(+r[key]||0)});
  return weeks().map(w=>w.days.reduce((a,d)=>a+(map[d]||0),0));
}

/* ================= TAB BODY RENDER ================= */
function secDef(tab,id){return SECTIONS[tab].find(s=>s.id===id)}
function panelHead(def,cfgTitle,extra){
  const title=cfgTitle||def.title||"";
  if(!title)return "";
  return `<div class="p-head">${def.tape?`<span class="tape">${esc(title)}</span>`:`<span class="p-title">${esc(title)}</span>`}
    ${def.sub?`<span class="p-sub">${esc(def.sub)}</span>`:""}<span class="spacer"></span>${extra||""}</div>`;
}
function renderTab(tab){
  const cfg=VIEWCFG.tabs[tab];
  let i=0,html="";
  cfg.sections.forEach(sc=>{
    if(!sc.on)return;
    const def=secDef(tab,sc.id);if(!def)return;
    html+=sectionShell(tab,sc,def,i++);
  });
  TABS.forEach(t=>$("view-"+t.id).classList.toggle("on",t.id===tab));
  const view=$("view-"+tab);
  view.innerHTML=html;
  buildCharts(tab);
  updateActive(true);
}
function sectionShell(tab,sc,def,i){
  const id=sc.id,st=`style="--i:${i}"`;
  if(id==="hero")return `<div class="hero reveal" ${st} id="sec-hero">
    <div class="h-top"><span class="h-league">FINAL SCORE · ${esc(CONFIG.seasonLabel)}</span><span class="h-live"><i></i>${MODE==="live"?"LIVE":"DEMO"}</span></div>
    <div class="score-row">
      <div class="side home"><div class="s-team">THE DINER</div><div class="s-cap">Store sales</div><div class="s-num" id="h-sales">$0</div></div>
      <div class="mid"><div class="m-badge"><div class="m-x" id="h-ret">0.0x</div><div class="m-cap">Marketing return</div></div></div>
      <div class="side away"><div class="s-team">THE CAMPAIGN</div><div class="s-cap">Marketing invested</div><div class="s-num" id="h-cost">$0</div></div>
    </div>
    <div class="h-foot" id="h-foot"></div>
  </div>`;
  if(id==="kpis")return `<div class="kpis reveal" ${st} id="kpis-${tab}"></div>`;
  const chartSecs={ovtrend:"tall",ogtrend:"",pftrend:"",redemp:"tall"};
  if(id in chartSecs){
    const sw=id==="redemp"?`<div class="switcher" id="inswitch">
      <button class="chip on" data-metric="redemptions">Orders</button><button class="chip" data-metric="views">Views</button>
      <button class="chip" data-metric="reach">Reach</button><button class="chip" data-metric="revenue">Revenue</button></div>`:"";
    return `<div class="panel reveal" ${st}>${panelHead(def,sc.title,sw)}
      <div class="chart-wrap ${chartSecs[id]}"><canvas id="cv-${id}"></canvas></div></div>`;
  }
  return `<div class="panel reveal" ${st}>${panelHead(def,sc.title)}<div id="sec-${id}"></div></div>`;
}

/* ================= KPI TILES ================= */
function renderKpis(tab,t){
  const cfg=VIEWCFG.tabs[tab],host=$("kpis-"+tab);if(!host)return;
  const defs=KPIS[tab].filter(k=>cfg.kpis.includes(k.k));
  if(host.childElementCount!==defs.length||host.dataset.keys!==defs.map(d=>d.k).join(",")){
    host.dataset.keys=defs.map(d=>d.k).join(",");
    host.innerHTML=defs.map(d=>`<div class="kpi"><div class="k-label">${esc(d.l)}</div>
      <div class="k-val" id="kv-${tab}-${d.k}">–</div><div class="k-delta" id="kd-${tab}-${d.k}"></div></div>`).join("");
  }
  defs.forEach(d=>{
    countUp($("kv-"+tab+"-"+d.k),d.v(t),d.f);
    const de=$("kd-"+tab+"-"+d.k);
    if(DELTA_KPIS[d.k]){
      const dl=deltaFor(d.v);
      if(dl&&isFinite(dl.pct)&&Math.abs(dl.pct)>=0.005){
        const up=dl.pct>=0;
        de.className="k-delta"+(up?" up":"");
        de.innerHTML=(up?"▲ +":"▼ ")+Math.abs(dl.pct*100).toFixed(0)+"% <small>"+esc(dl.label)+"</small>";
      } else de.innerHTML="";
    } else de.innerHTML="";
  });
}

function barsHTML(items,clickDim){
  if(!items.length)return `<div class="empty-note">No activity for the current filters.</div>`;
  const max=Math.max(...items.map(x=>x.val),1);
  return `<div class="hbars">`+items.map(x=>{
    const on=clickDim&&F[clickDim]&&F[clickDim].has(x.key);
    return `<div class="hbar-row ${x.cls||""} ${clickDim?"clickable":""} ${on?"on":""}" ${clickDim?`data-dim="${clickDim}" data-val="${esc(x.key)}"`:""}>
      <div class="hb-top"><span class="hb-name">${esc(x.name)}</span>${x.cap?`<span class="hb-cap">${esc(x.cap)}</span>`:""}<span class="hb-val">${x.fval}</span></div>
      <div class="hb-track"><div class="hb-fill" data-w="${(x.val/max*100).toFixed(1)}"></div></div></div>`;
  }).join("")+`</div>`;
}
function animateFills(host){

function funnelHTML(steps){
  const base=steps[0].val||1;
  let html=`<div class="funnel">`;
  steps.forEach((s,i)=>{
    if(i>0){const r=dv(s.val,steps[i-1].val);html+=`<div class="fstep"><span></span><div class="fs-rate">↓ ${pct(r)}</div><span></span></div>`}
    html+=`<div class="fstep"><span class="fs-name">${esc(s.name)}</span>
      <div class="fs-track"><div class="fs-fill" data-w="${Math.max(Math.pow(dv(s.val,base),0.45)*100,2).toFixed(1)}"></div></div>
      <span class="fs-val">${cmp(s.val)}</span></div>`;
  });

const SORT={posts:{k:"reach",d:-1},camps:{k:"spend",d:-1}};
function tableHTML(id,cols,rows,rowFn){
  const s=SORT[id];
  return `<div class="twrap"><table class="stat" data-tid="${id}"><thead><tr>`+
    cols.map(c=>`<th data-k="${c.k}" class="${s.k===c.k?"sorted":""}">${c.l}${s.k===c.k?(s.d<0?" ▼":" ▲"):""}</th>`).join("")+
    `</tr></thead><tbody>`+rows.map(rowFn).join("")+`</tbody></table></div>`;
}
function sortRows(id,rows){
  const s=SORT[id];
  return rows.slice().sort((a,b)=>{
    const x=a[s.k],y=b[s.k];
    if(typeof x==="string")return s.d*x.localeCompare(y);
    return s.d*((x||0)-(y||0));
  });
}

        plugins:{...base.plugins,legend:{display:false},tooltip:{...base.plugins.tooltip,
          callbacks:{label:c=>" "+(INMETRIC==="revenue"?money(c.parsed.x):num(c.parsed.x))}}},
        scales:{x:{grid:gridOpts(),ticks:{callback:v=>INMETRIC==="revenue"?moneyC(v):cmp(v)},border:{display:false}},
          y:{grid:{display:false},ticks:{font:{family:"'Anton',sans-serif",size:12}}}}}});
  }
}
function weeklyF(rows,fn){
  const map={};rows.forEach(r=>{map[r.date]=(map[r.date]||0)+fn(r)});
  return weeks().map(w=>w.days.reduce((a,d)=>a+(map[d]||0),0));
}
function updateCharts(tab,t){
  const labels=weeks().map(w=>w.label);
  if(tab==="ov"&&CH.ov){
    CH.ov.data.labels=labels;
    CH.ov.data.datasets[0].data=weeklyF(t.sales,r=>r.revenue);
    const ps=weeklyF(t.paid,r=>r.spend),ic=weeklyF(t.inf,r=>r.cost);
    CH.ov.data.datasets[1].data=ps.map((v,i)=>v+ic[i]);
    CH.ov.update();
  }
  if(tab==="og"&&CH.og){
    CH.og.data.labels=labels;
    CH.og.data.datasets[0].data=weeklyF(t.org,r=>r.reach);
    CH.og.data.datasets[1].data=weeklyF(t.org,r=>r.likes+r.comments+r.saves+r.shares);
    CH.og.update();
  }
  if(tab==="pf"&&CH.pf){
    CH.pf.data.labels=labels;
    CH.pf.data.datasets[0].data=weeklyF(t.paid,r=>r.spend);
    CH.pf.data.datasets[1].data=weeklyF(t.paid,r=>r.revenue);
    CH.pf.update();
  }
  if(tab==="in"&&CH.in){
    const by={};
    t.inf.forEach(r=>{by[r.influencer]=(by[r.influencer]||0)+(+r[INMETRIC]||0)});
    const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    CH.in.data.labels=entries.map(e=>e[0]);
    CH.in.data.datasets[0].data=entries.map(e=>e[1]);
    CH.in.data.datasets[0].backgroundColor=entries.map(e=>F.influencer.has(e[0])||!F.influencer.size?cvar("--yellow"):"rgba(242,205,28,.25)");
    CH.in.update();
  }
}

  const t=totals();
  renderKpis(ACTIVE,t);
  if(ACTIVE==="ov"){renderHero(t);renderAttrib(t);renderOvFunnel(t);renderSeason(t)}

/* ================= COUNT-UP ================= */
function countUp(el,to,fmt){
  if(!el)return;
  const from=el._v||0;
  el._v=to;
  if(REDUCED||Math.abs(to-from)<1e-9){el.textContent=fmt(to);return}
  if(el._raf)cancelAnimationFrame(el._raf);
  const t0=performance.now(),dur=750;
  if(el._filled){el.classList.remove("ticked");void el.offsetWidth;el.classList.add("ticked")}
  el._filled=true;
  const step=now=>{
    const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e);
    if(p<1)el._raf=requestAnimationFrame(step);
  };
  el._raf=requestAnimationFrame(step);
}
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ================= COACH MODE (admin layout editor) ================= */
function renderCoach(){
  const c=$("coach");
  if(ROLE!=="admin"){c.classList.remove("show");c.innerHTML="";return}
  const cfg=VIEWCFG.tabs[ACTIVE];
  const tabName=TABS.find(t=>t.id===ACTIVE).label;
  c.innerHTML=`<div class="c-head"><span class="c-title">COACH MODE</span>
      <span class="c-sub">Editing the ${tabName} tab. The client never sees this panel.</span>
      <div class="c-actions">
        <button class="cbtn" id="cReset">Reset</button>
        <button class="cbtn" id="cCopy">Copy config</button>
        <button class="cbtn primary" id="cSave">Save view</button>
      </div></div>
    <div class="c-cols"><div><h4>Sections · show, rename, reorder</h4>
      ${cfg.sections.map((sc,i)=>{
        const def=secDef(ACTIVE,sc.id);
        return `<div class="sec-row ${sc.on?"":"off"}" data-i="${i}">
          <button class="sbtn" data-act="eye" title="Show or hide">${sc.on?"●":"○"}</button>
          <input type="text" value="${esc(sc.title||def.title||def.name)}" data-act="title" ${def.title?"":"disabled"}>
          <button class="sbtn" data-act="up">↑</button><button class="sbtn" data-act="down">↓</button></div>`;
      }).join("")}</div>
    <div><h4>Headline numbers on this tab</h4><div class="kpi-picks">
      ${KPIS[ACTIVE].map(k=>`<button class="kpick ${cfg.kpis.includes(k.k)?"on":""}" data-k="${k.k}">${esc(k.l)}</button>`).join("")}
    </div><div class="c-note">Saved views live in this browser only. To make a layout the default for everyone, use Copy config and send it to Solvera.</div></div></div>`;
  c.classList.add("show");
}
function coachAction(e){
  const cfg=VIEWCFG.tabs[ACTIVE];
  const row=e.target.closest(".sec-row");
  if(row){
    const i=+row.dataset.i,act=e.target.dataset.act;
    if(act==="eye"){cfg.sections[i].on=!cfg.sections[i].on}
    else if(act==="up"&&i>0){[cfg.sections[i-1],cfg.sections[i]]=[cfg.sections[i],cfg.sections[i-1]]}
    else if(act==="down"&&i<cfg.sections.length-1){[cfg.sections[i+1],cfg.sections[i]]=[cfg.sections[i],cfg.sections[i+1]]}
    else return;
    renderCoach();renderTab(ACTIVE);return;
  }
  const kp=e.target.closest(".kpick");
  if(kp){
    const k=kp.dataset.k;
    cfg.kpis.includes(k)?cfg.kpis=cfg.kpis.filter(x=>x!==k):cfg.kpis.push(k);
    cfg.kpis.sort((a,b)=>KPIS[ACTIVE].findIndex(x=>x.k===a)-KPIS[ACTIVE].findIndex(x=>x.k===b));
    renderCoach();renderTab(ACTIVE);return;
  }
  if(e.target.id==="cSave"){localStorage.setItem(VIEWCFG_KEY,JSON.stringify(VIEWCFG));toast("View saved on this device")}
  if(e.target.id==="cReset"){localStorage.removeItem(VIEWCFG_KEY);VIEWCFG=defaultViewCfg();renderCoach();renderTab(ACTIVE);toast("Back to the default layout")}
  if(e.target.id==="cCopy"){
    const txt=JSON.stringify(VIEWCFG,null,1);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Config copied"),()=>{prompt("Copy this config:",txt)});
  }
}

/* ================= LIVE SHEETS ================= */
function normDate(v){
  if(v==null)return null;
  if(v instanceof Date)return isNaN(v)?null:v.toISOString().slice(0,10);
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10);
}
const H=(r,name)=>{const k=Object.keys(r).find(k=>k.trim().toLowerCase()===name.toLowerCase());return k?r[k]:undefined};
const NUM=v=>+String(v==null?0:v).replace(/[^0-9.\-]/g,"")||0;
const MAPPERS={
  sales:r=>({date:normDate(H(r,"Date")),revenue:NUM(H(r,"Revenue")),orders:NUM(H(r,"Orders"))}),
  paid:r=>({date:normDate(H(r,"Date")),campaign:H(r,"Campaign Name")||"Campaign",platform:H(r,"Platform")||"Other",
    objective:H(r,"Objective")||"Other",funnel:H(r,"Funnel")||"",creativeType:H(r,"Creative Type")||"Other",
    creative:H(r,"Creative Name")||"",spend:NUM(H(r,"Spend")),impressions:NUM(H(r,"Impressions")),
    clicks:NUM(H(r,"Clicks")),lpv:NUM(H(r,"Landing Page Views")),atc:NUM(H(r,"Add To Cart")),
    orders:NUM(H(r,"Orders")),revenue:NUM(H(r,"Revenue"))}),
  organic:r=>({date:normDate(H(r,"Date")),platform:H(r,"Platform")||"Instagram",postType:H(r,"Post Type")||"Post",
    name:H(r,"Post Name")||"Post",reach:NUM(H(r,"Reach")),views:NUM(H(r,"Views")),likes:NUM(H(r,"Likes")),
    comments:NUM(H(r,"Comments")),saves:NUM(H(r,"Saves")),shares:NUM(H(r,"Shares")),
    profileVisits:NUM(H(r,"Profile Visits"))}),
  followers:r=>({date:normDate(H(r,"Date")),platform:H(r,"Platform")||"Instagram",followers:NUM(H(r,"Followers"))}),
  influencers:r=>({date:normDate(H(r,"Date")),influencer:H(r,"Influencer")||"Creator",handle:H(r,"Handle")||"",
    tier:H(r,"Tier")||"Micro",platform:H(r,"Platform")||"Instagram",deliverable:H(r,"Deliverable")||"",
    cost:NUM(H(r,"Cost")),reach:NUM(H(r,"Reach")),views:NUM(H(r,"Views")),engagements:NUM(H(r,"Engagements")),
    code:H(r,"Code")||"",redemptions:NUM(H(r,"Redemptions")),revenue:NUM(H(r,"Revenue"))})
};
function rebuildCalendar(){
  const months=new Set();
  Object.values(DATA).forEach(rows=>rows.forEach(r=>{if(r.date)months.add(r.date.slice(0,7))}));
  const mks=[...months].sort();
  if(!mks.length)return;
  MONTHS=mks.map(mk=>{const y=+mk.slice(0,4),m=+mk.slice(5,7);
    return [mk,MSHORT[m-1].toUpperCase(),new Date(y,m,0).getDate()]});
  MKEYS=mks;
  DAYS=[];
  MONTHS.forEach(([mk,,n])=>{for(let d=1;d<=n;d++)DAYS.push(mk+"-"+String(d).padStart(2,"0"))});
}
async function loadLive(){
  const jobs=Object.entries(CONFIG.sheets).filter(([,u])=>u&&u.startsWith("http"));
  if(!jobs.length)return false;
  let ok=0;
  const cache=(()=>{try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")}catch(e){return{}}})();
  for(const [key,url] of jobs){
    try{
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok)throw new Error(res.status);
      const csv=await res.text();
      const parsed=Papa.parse(csv,{header:true,skipEmptyLines:true});
      const rows=parsed.data.map(MAPPERS[key]).filter(r=>r.date);
      if(rows.length){DATA[key]=rows;cache[key]={ts:Date.now(),rows};ok++}
    }catch(e){
      if(cache[key]&&cache[key].rows){DATA[key]=cache[key].rows;ok++;toast("Showing saved "+key+" data from "+new Date(cache[key].ts).toLocaleDateString())}
    }
  }
  try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}
  if(ok){MODE="live";rebuildCalendar()}
  return ok>0;
}

/* ================= GATE + SESSION + THEME ================= */
function showApp(){
  $("gate").classList.add("hidden");
  $("app").style.display="";
  $("rolePill").textContent=ROLE==="admin"?"coach":"view";
  derivePlatforms();
  VIEWCFG=loadViewCfg();
  renderTabs();renderFilterbar();renderBanner();renderCoach();renderTab(ACTIVE);
  loadLive().then(changed=>{
    if(changed){
      $("modePill").textContent="live";$("modePill").className="pill live";
      $("footMode").textContent="Live from Google Sheets";
      derivePlatforms();renderFilterbar();renderTab(ACTIVE);
    }
  });
}
function attemptLogin(){
  const v=$("passcode").value.trim();
  if(CONFIG.adminCode&&v===CONFIG.adminCode)ROLE="admin";
  else if(v===CONFIG.accessCode)ROLE="client";
  else{
    $("loginError").textContent="That code didn't scan. Try again.";
    const tk=document.querySelector(".ticket");tk.classList.remove("shake");void tk.offsetWidth;tk.classList.add("shake");
    $("passcode").value="";return;
  }
  sessionStorage.setItem(SESSION_KEY,"1");sessionStorage.setItem(ROLE_KEY,ROLE);
  $("loginError").textContent="";showApp();
}
function applyHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("tab")&&TABS.some(t=>t.id===h.get("tab")))ACTIVE=h.get("tab");
  if(h.get("theme")==="light"||h.get("theme")==="dark"){
    document.documentElement.setAttribute("data-theme",h.get("theme"));
    localStorage.setItem(THEME_KEY,h.get("theme"));
  }
  const code=h.get("code");
  if(code){$("passcode").value=code;attemptLogin()}
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const tab=e.target.closest(".tab");
  if(tab){ACTIVE=tab.dataset.tab;renderTabs();renderFilterbar();renderCoach();renderTab(ACTIVE);return}
  const chip=e.target.closest(".chip[data-dim]");
  if(chip){toggleFilter(chip.dataset.dim,chip.dataset.val==="undefined"?chip.dataset.val:isNaN(chip.dataset.val)?chip.dataset.val:chip.dataset.val);return}
  const tag=e.target.closest(".ftag b");
  if(tag){toggleFilter(tag.dataset.dim,tag.dataset.val);return}
  if(e.target.id==="fbClear"){clearFilters();return}
  const sw=e.target.closest("#inswitch .chip");
  if(sw){INMETRIC=sw.dataset.metric;
    document.querySelectorAll("#inswitch .chip").forEach(c=>c.classList.toggle("on",c===sw));
    updateActive();return}
  if(e.target.closest("#coach")){coachAction(e);return}
  const th=e.target.closest("th[data-k]");
  if(th){
    const tid=th.closest("table").dataset.tid,k=th.dataset.k;
    if(SORT[tid]){SORT[tid].k===k?SORT[tid].d*=-1:(SORT[tid]={k,d:-1});updateActive()}
    return;
  }
  const f=e.target.closest("[data-dim][data-val]");
  if(f&&!e.target.closest(".chip")){toggleFilter(f.dataset.dim,f.dataset.val);return}
});
$("enterBtn").addEventListener("click",attemptLogin);
$("passcode").addEventListener("keydown",e=>{if(e.key==="Enter")attemptLogin()});
$("themeToggle").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme"),next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem(THEME_KEY,next);
  if($("app").style.display!=="none"){renderTab(ACTIVE)}
});
$("signOut").addEventListener("click",()=>{
  sessionStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(ROLE_KEY);location.hash="";location.reload();
});

/* ================= INIT ================= */
document.documentElement.setAttribute("data-theme",localStorage.getItem(THEME_KEY)||CONFIG.defaultTheme);
applyHash();
if(sessionStorage.getItem(SESSION_KEY)==="1"&&$("app").style.display==="none"){
  ROLE=sessionStorage.getItem(ROLE_KEY)||"client";showApp();
}
