<style>
/* ============ TOKENS ============ */
:root{
  --r:14px; --r-sm:10px;
  --ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fd:'Barlow Condensed','Inter',-apple-system,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --maxw:1560px;
}
:root[data-theme="dark"]{
  --bg:#0a0b0d; --bg-2:#0e1013; --surface:#14171b; --surface-2:#1b1f25; --surface-3:#232830;
  --text:#f4f6f8; --text-dim:#98a2ae; --text-faint:#697280;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  --grid:rgba(255,255,255,.06);
  --pos:#34d399; --neg:#f87171;
  --logo-invert:1;
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --bg-2:#eceef1; --surface:#ffffff; --surface-2:#f6f7f9; --surface-3:#eceef1;
  --text:#0d1117; --text-dim:#5a6472; --text-faint:#8b95a3;
  --border:rgba(3,10,20,.10); --border-2:rgba(3,10,20,.18);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --grid:rgba(3,10,20,.07);
  --pos:#059669; --neg:#dc2626;
  --logo-invert:0;
}
/* ---- brand skins (set on <body data-brandskin="..">) ---- */
body[data-brandskin="itp"]{ --brand:#e9edf2; --brand-2:#9aa5b1; --brand-ink:#0a0b0d; --glow:rgba(233,237,242,.13); }
body[data-brandskin="spartan"]{ --brand:#d81f2a; --brand-2:#b3bfcb; --brand-ink:#ffffff; --glow:rgba(216,31,42,.20); }
body[data-brandskin="tm"]{ --brand:#f2570a; --brand-2:#ffc043; --brand-ink:#160c04; --glow:rgba(242,87,10,.22); }
body[data-brandskin="deka"]{ --brand:#ff2a26; --brand-2:#ff8f7a; --brand-ink:#ffffff; --glow:rgba(255,42,38,.22); }
:root[data-theme="light"] body[data-brandskin="itp"]{ --brand:#161b22; --brand-2:#5a6472; --brand-ink:#ffffff; --glow:rgba(22,27,34,.10); }
:root[data-theme="light"] body[data-brandskin="spartan"]{ --brand:#c2101b; --brand-ink:#ffffff; --brand-2:#5f6b78; }
:root[data-theme="light"] body[data-brandskin="tm"]{ --brand:#d94a05; --brand-ink:#ffffff; --brand-2:#b07800; }
:root[data-theme="light"] body[data-brandskin="deka"]{ --brand:#d81410; --brand-ink:#ffffff; --brand-2:#b04a3a; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ff); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
  transition:background .25s var(--ease),color .25s var(--ease);
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(900px 480px at 50% -8%, var(--glow), transparent 68%);
  transition:background .35s var(--ease);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);padding:24px}
#login::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 420px at 50% 10%,rgba(216,31,42,.16),transparent 65%)}
.lg-card{position:relative;width:min(410px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 32px 30px;box-shadow:var(--shadow);text-align:center}
.lg-hero{display:grid;place-items:center;margin-bottom:20px}
.lg-hero img{width:78px;height:78px;border-radius:16px;object-fit:cover;background:#000;border:1px solid var(--border-2);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.lg-rule{height:1px;margin:24px 0 20px;background:linear-gradient(90deg,transparent,var(--lux),transparent);opacity:.85}
.lg-marks{display:flex;align-items:flex-start;justify-content:center;gap:22px}
.lg-marks .mk{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px}
.lg-marks .mk img{height:38px;width:38px;border-radius:9px;object-fit:cover;background:#000;border:1px solid var(--border)}
.lg-marks .mk img.inv{object-fit:contain;background:transparent;border:0;filter:invert(var(--logo-invert))}
.lg-marks .mk span{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);font-weight:700;text-align:center;line-height:1.3}
.lg-title{font-family:var(--fd);font-size:27px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.lg-sub{color:var(--text-dim);font-size:12.5px;margin-top:7px;letter-spacing:.02em}
.lg-form{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.lg-form input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--border-2);background:var(--surface-2);outline:none;text-align:center;letter-spacing:.09em;font-weight:600;transition:border-color .18s}
.lg-form input:focus{border-color:var(--brand)}
.lg-form button{padding:13px;border-radius:11px;background:var(--text);color:var(--bg);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;transition:opacity .18s}
.lg-form button:hover{opacity:.85}
.lg-err{color:var(--neg);font-size:12.5px;min-height:17px;margin-top:3px}
.lg-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-faint);font-size:11px;letter-spacing:.03em}

/* ============ APP SHELL ============ */
#app{display:none;position:relative;z-index:1;min-height:100%;flex-direction:column}
#app.on{display:flex}
header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid var(--border)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark .lg{height:34px;width:auto;max-width:190px;object-fit:contain;display:block}
.brandmark .lg.sq{height:34px;width:34px;border-radius:8px;object-fit:cover;background:#000;border:1px solid var(--border)}
.brandmark .lg.mk{object-fit:contain;background:transparent;border:0}
.brandmark .lg.inv{filter:invert(var(--logo-invert))}
.bm-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bm-txt b{font-family:var(--fd);font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bm-txt span{font-size:10.5px;color:var(--text-dim);letter-spacing:.09em;text-transform:uppercase}
.spacer{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--text-dim);white-space:nowrap;transition:.16s var(--ease)}
.pill.role{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
button.pill:hover{border-color:var(--border-2);color:var(--text)}
button.pill.act{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.cur-tog{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.cur-tog button{padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--text-dim);letter-spacing:.04em}
.cur-tog button.on{background:var(--brand);color:var(--brand-ink)}

/* tabs */
nav.tabs{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{position:relative;display:flex;align-items:center;gap:8px;padding:11px 15px 12px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);white-space:nowrap;border-bottom:2px solid transparent;transition:.18s var(--ease)}
nav.tabs button img{height:13px;width:auto;max-width:88px;object-fit:contain;opacity:.55;transition:.18s}
nav.tabs button img.sq{height:20px;width:20px;border-radius:5px;object-fit:cover;background:#000}
nav.tabs button img.mk{object-fit:contain;background:transparent;height:21px;width:21px}
nav.tabs button img.inv{filter:invert(var(--logo-invert))}
nav.tabs button:hover{color:var(--text-dim)}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
nav.tabs button.on img{opacity:1}

main{max-width:var(--maxw);margin:0 auto;width:100%;padding:18px 20px 64px;flex:1}

/* ============ BRAND HERO (brand tabs) ============ */
.hero{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:var(--r);border:1px solid var(--border);background:linear-gradient(110deg,color-mix(in srgb,var(--brand) 13%,var(--surface)),var(--surface) 62%);margin-bottom:16px;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%)}
.hero .hl{height:52px;width:auto;max-width:250px;object-fit:contain;flex:none;position:relative}
.hero .hl.sq{height:56px;width:56px;border-radius:12px;object-fit:cover;background:#000;border:1px solid var(--border)}
.hero .hl.inv{filter:invert(var(--logo-invert))}
.hero h1{font-family:var(--fd);font-size:27px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;line-height:1.05}
.hero p{color:var(--text-dim);font-size:12.5px;margin-top:3px}
.hero .hstat{margin-left:auto;text-align:right;position:relative}
.hero .hstat b{display:block;font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:.01em;color:var(--brand)}
.hero .hstat span{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em}

/* ============ STICKY CONTROL BAR ============ */
.stickybar{position:sticky;top:88px;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);margin:0 -20px 14px;padding:10px 20px;border-bottom:1px solid var(--border)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1 1 250px;min-width:200px;max-width:400px}
.search-wrap input{width:100%;padding:9px 32px 9px 32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;font-size:13px;transition:border-color .16s}
.search-wrap input:focus{border-color:var(--brand)}
.search-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;pointer-events:none}
.search-wrap .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:15px;line-height:1;padding:3px}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:80;background:var(--surface);border:1px solid var(--border-2);border-radius:11px;box-shadow:var(--shadow);max-height:300px;overflow:auto;display:none}
.sugg.on{display:block}
.sugg .s-h{padding:7px 12px 4px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.sugg button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 12px;text-align:left;font-size:13px;transition:background .12s}
.sugg button:hover,.sugg button.hi{background:var(--surface-2)}
.sugg .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);border:1px solid var(--border);padding:1px 6px;border-radius:5px;flex:none}
.sugg .empty{padding:14px 12px;color:var(--text-faint);font-size:12.5px;text-align:center}

details.fdd{position:relative}
details.fdd>summary{list-style:none;display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:.16s}
details.fdd>summary::-webkit-details-marker{display:none}
details.fdd>summary:hover{border-color:var(--border-2);color:var(--text)}
details.fdd[open]>summary{border-color:var(--brand);color:var(--text)}
details.fdd>summary .cnt{background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;min-width:17px;text-align:center}
details.fdd>summary .car{font-size:9px;opacity:.6}
.fpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:260px;max-height:330px;overflow:auto;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:var(--shadow);padding:8px}
.fpanel input.fs{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);outline:none;font-size:12.5px;margin-bottom:6px}
.fpanel label{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:background .12s}
.fpanel label:hover{background:var(--surface-2)}
.fpanel input[type=checkbox]{accent-color:var(--brand);width:14px;height:14px;flex:none}
.fpanel .val{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpanel .n{color:var(--text-faint);font-size:10.5px;flex:none}
.fpanel .fp-act{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--border);margin-top:5px}
.fpanel .fp-act button{flex:1;padding:5px;border-radius:7px;border:1px solid var(--border);font-size:11px;color:var(--text-dim)}
.fpanel .fp-act button:hover{color:var(--text);border-color:var(--border-2)}
.dt-in{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text-dim);outline:none}
.dt-in:focus{border-color:var(--brand)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 10px;border-radius:999px;background:color-mix(in srgb,var(--brand) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);font-size:11.5px;font-weight:500}
.chip b{font-weight:700;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);opacity:.9}
.chip button{font-size:14px;line-height:1;opacity:.6;padding:0 2px}
.chip button:hover{opacity:1}
.chip.clr{background:transparent;border-style:dashed;color:var(--text-dim)}

/* ============ GRID + PANELS ============ */
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:stretch}
.cell{grid-column:span 6;display:flex;flex-direction:column;min-width:0}
.cell[data-w="half"]{grid-column:span 3}
.cell[data-w="third"]{grid-column:span 2}
.cell[data-w="twothird"]{grid-column:span 4}
.panel{flex:1;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:border-color .18s}
.panel:hover{border-color:var(--border-2)}
.ph{display:flex;align-items:center;gap:9px;padding:13px 15px 10px;flex-wrap:wrap}
.ph h3{font-family:var(--fd);font-size:14.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text);flex:1;min-width:0}
.ph .sub{font-size:11px;color:var(--text-faint);width:100%;margin-top:-4px;letter-spacing:.02em}
.pbody{flex:1;display:flex;flex-direction:column;padding:0 15px 15px;min-height:0}
.cwrap{position:relative;flex:1;min-height:250px;max-height:470px}
.cell[data-w="full"] .cwrap{min-height:300px}
.cwrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}

/* help "?" */
.hlp{position:relative;flex:none}
.hlp>button{width:19px;height:19px;border-radius:50%;border:1px solid var(--border-2);color:var(--text-faint);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;transition:.16s}
.hlp>button:hover{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.hlp .tip{position:absolute;top:calc(100% + 8px);right:0;z-index:90;width:280px;background:var(--surface-3);border:1px solid var(--border-2);border-radius:11px;padding:12px 13px;box-shadow:var(--shadow);font-size:12px;line-height:1.55;color:var(--text-dim);display:none;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--ff)}
.hlp.on .tip{display:block}
.hlp .tip b{color:var(--text);display:block;margin-bottom:4px;font-size:12.5px}
.hlp .tip code{display:block;margin-top:7px;padding:6px 8px;background:var(--bg-2);border-radius:7px;border:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--brand);white-space:pre-wrap}

/* ============ KPI CARDS ============ */
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.kgrid.big{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px 16px;box-shadow:var(--shadow);overflow:hidden;transition:.18s var(--ease)}
.kpi:hover{border-color:var(--border-2);transform:translateY(-1px)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.85}
.kpi .kl{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);font-weight:600}
.kpi .kv{font-family:var(--fd);font-size:31px;white-space:nowrap;font-weight:700;letter-spacing:.005em;margin-top:7px;line-height:1;word-break:break-word}
.kpi .kd{font-size:11px;color:var(--text-faint);margin-top:6px}
.kgrid.big .kpi{padding:20px 22px 22px}
.kgrid.big .kpi .kv{font-size:46px;color:var(--brand)}
.kpi .kv[data-len="m"]{font-size:25px}
.kpi .kv[data-len="l"]{font-size:21px}
.kgrid.big .kpi .kv[data-len="m"]{font-size:38px}
.kgrid.big .kpi .kv[data-len="l"]{font-size:31px}
.kgrid.big .kpi::before{width:4px}

/* ============ TABLE ============ */
.tbl-wrap{flex:1;overflow:auto;min-height:220px;max-height:430px;border:1px solid var(--border);border-radius:var(--r-sm)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);padding:9px 11px;text-align:center;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);font-weight:700;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--border);user-select:none;transition:color .14s}
table.dt thead th:first-child{text-align:left}
table.dt thead th:hover{color:var(--text)}
table.dt thead th .ar{opacity:.45;font-size:9px;margin-left:3px}
table.dt thead th.srt{color:var(--brand)}
table.dt thead th.srt .ar{opacity:1}
table.dt tbody td{padding:8px 11px;text-align:center;border-bottom:1px solid var(--border);color:var(--text-dim);white-space:nowrap}
table.dt tbody td:first-child{text-align:left;color:var(--text);font-weight:500;max-width:250px;overflow:hidden;text-overflow:ellipsis}
table.dt tbody tr{cursor:pointer;transition:background .12s}
table.dt tbody tr:hover{background:var(--surface-2)}
table.dt tbody tr.sel{background:color-mix(in srgb,var(--brand) 14%,transparent)}
table.dt tbody tr.sel td:first-child{color:var(--brand);font-weight:700}
table.dt tfoot td{padding:9px 11px;text-align:center;font-weight:700;border-top:1px solid var(--border-2);background:var(--surface-2);white-space:nowrap}
table.dt tfoot td:first-child{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim)}

/* ============ ADMIN ============ */
.adm{background:var(--surface);border:1px dashed color-mix(in srgb,var(--brand) 55%,var(--border));border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.adm>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.adm>summary::-webkit-details-marker{display:none}
.adm>summary .tg{margin-left:auto;font-size:10px;color:var(--text-faint);letter-spacing:.05em;font-weight:500;text-transform:none}
.adm-body{padding:0 16px 16px;border-top:1px solid var(--border)}
.adm-tabs{display:flex;gap:4px;margin:12px 0 14px;flex-wrap:wrap}
.adm-tabs button{padding:6px 12px;border-radius:8px;border:1px solid var(--border);font-size:11.5px;font-weight:600;color:var(--text-dim);letter-spacing:.03em}
.adm-tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.asec{margin-bottom:16px}
.asec>h4{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:8px}
.wrow{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);margin-bottom:8px;flex-wrap:wrap}
.wrow .grip{font-size:11px;color:var(--text-faint);padding-top:8px}
.wrow .fields{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;min-width:0}
.wrow .acts{display:flex;gap:4px;padding-top:2px}
.wrow .acts button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);font-size:12px;color:var(--text-dim);display:grid;place-items:center}
.wrow .acts button:hover{color:var(--text);border-color:var(--border-2)}
.wrow .acts button.del:hover{color:var(--neg);border-color:var(--neg)}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.fld input,.fld select{padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12px;outline:none;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.msel{position:relative}
.msel>summary{list-style:none;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel>summary::-webkit-details-marker{display:none}
.msel[open]>summary{border-color:var(--brand)}
.msel .mp{position:absolute;top:calc(100% + 4px);left:0;z-index:90;width:230px;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.msel .mp label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:6px;font-size:12px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:400;cursor:pointer}
.msel .mp label:hover{background:var(--surface-2)}
.msel .mp input{width:14px;height:14px;accent-color:var(--brand);flex:none}
.abtns{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border)}
.abtns button{padding:8px 14px;border-radius:9px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-dim);letter-spacing:.02em}
.abtns button:hover{color:var(--text);border-color:var(--border-2)}
.abtns button.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.abtns button.primary:hover{opacity:.88;color:var(--brand-ink)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.map-row{display:flex;align-items:center;gap:8px;font-size:12px}
.map-row span{flex:0 0 108px;color:var(--text-dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row select{flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;outline:none;min-width:0}
.map-row select.ok{border-color:color-mix(in srgb,var(--pos) 50%,transparent)}
.note{font-size:11.5px;color:var(--text-faint);line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--border)}
.note code{font-family:ui-monospace,Menlo,monospace;color:var(--brand);font-size:11px}

/* misc */
.banner{display:none;align-items:center;gap:9px;padding:9px 13px;border-radius:var(--r-sm);font-size:12px;margin-bottom:12px;border:1px solid}
.banner.on{display:flex}
.banner.warn{background:color-mix(in srgb,#f59e0b 12%,transparent);border-color:rgba(245,158,11,.4);color:#fbbf24}
.banner.err{background:color-mix(in srgb,var(--neg) 12%,transparent);border-color:color-mix(in srgb,var(--neg) 40%,transparent);color:var(--neg)}
.empty-st{padding:44px 20px;text-align:center;color:var(--text-faint);font-size:13px}
.empty-st b{display:block;color:var(--text-dim);font-family:var(--fd);font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.load{display:grid;place-items:center;padding:70px 20px;gap:14px;color:var(--text-dim);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.spin{width:26px;height:26px;border:2px solid var(--border-2);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer.ft{max-width:var(--maxw);margin:0 auto;width:100%;padding:20px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-faint);letter-spacing:.03em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-3);border:1px solid var(--border-2);color:var(--text);padding:10px 18px;border-radius:11px;font-size:12.5px;box-shadow:var(--shadow);z-index:300;opacity:0;transition:.28s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ EXECUTIVE / LUXURY LAYER ============ */
:root{ --lux:#c6ae7b; --lux-2:#8d7b55; }
:root[data-theme="light"]{ --lux:#8a743f; --lux-2:#b39d6d; }
body[data-tab="exec"]{ --bg:#07080a; }
:root[data-theme="light"] body[data-tab="exec"]{ --bg:#f2f3f5; }

.band{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--border);
  background:linear-gradient(122deg,#101317 0%,#0b0d10 46%,#0e1114 100%);
  padding:30px 34px 28px;margin-bottom:8px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
:root[data-theme="light"] .band{background:linear-gradient(122deg,#ffffff 0%,#f8f9fb 52%,#eff1f4 100%)}
:root[data-theme="light"] .band::before{background:radial-gradient(720px 280px at 84% -34%,rgba(198,174,123,.16),transparent 68%)}
:root[data-theme="light"] .bcard{background:linear-gradient(152deg,color-mix(in srgb,var(--bc) 9%,var(--surface)) 0%,var(--surface) 62%)}
:root[data-theme="light"] .bcard::after{background:radial-gradient(circle,color-mix(in srgb,var(--bc) 13%,transparent),transparent 68%)}
.band::before{content:"";position:absolute;inset:0;
  background:radial-gradient(760px 300px at 82% -30%,rgba(198,174,123,.13),transparent 66%),
             radial-gradient(520px 240px at 8% 130%,rgba(216,31,42,.10),transparent 70%);pointer-events:none}
.band::after{content:"";position:absolute;left:34px;right:34px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--lux),transparent);opacity:.55}
.band .bl{height:46px;width:46px;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--border-2);flex:none;position:relative}
.band .bt{position:relative;min-width:0;flex:1}
.band .ovl{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--lux);font-weight:700;margin-bottom:7px}
.band h1{font-family:var(--fd);font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:.055em;
  text-transform:uppercase;line-height:.98;color:var(--text)}
.band .meta{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-dim);letter-spacing:.03em}
.band .dot{display:inline-flex;align-items:center;gap:6px}
.band .dot i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.55);animation:pulse 2.4s infinite;font-style:normal}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.band .bstat{position:relative;text-align:right;padding-left:26px;border-left:1px solid var(--border);min-width:190px}
.band .bstat b{display:block;font-family:var(--fd);font-size:clamp(30px,3.2vw,40px);font-weight:700;line-height:1;color:var(--text);letter-spacing:.01em}
.band .bstat span{display:block;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--lux);margin-top:8px;font-weight:700}
.band .bmarks{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}
.band .bmarks img{height:22px;width:22px;border-radius:6px;object-fit:cover;background:#000;border:1px solid var(--border);opacity:.85}
.band .bmarks img.mk{object-fit:contain;background:transparent;border:0;filter:invert(var(--logo-invert))}

/* headline KPI — luxury */
.kgrid.lux{grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:16px;margin-top:14px}
.kgrid.lux .kpi{padding:28px 28px 26px;border-radius:18px;
  background:linear-gradient(180deg,var(--surface) 0%,color-mix(in srgb,var(--bg) 55%,var(--surface)) 100%)}
.kgrid.lux .kpi::before{left:0;right:0;top:0;bottom:auto;width:auto;height:2px;
  background:linear-gradient(90deg,var(--lux),color-mix(in srgb,var(--lux) 12%,transparent) 72%);opacity:1}
.kgrid.lux .kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--lux) 42%,transparent)}
.kgrid.lux .kl{font-size:9.5px;letter-spacing:.26em;color:var(--lux);font-weight:700}
.kgrid.lux .kv{font-family:var(--fd);font-size:clamp(40px,4.6vw,58px);color:var(--text);margin-top:14px;letter-spacing:.005em}
.kgrid.lux .kv[data-len="m"]{font-size:clamp(34px,3.8vw,47px)}
.kgrid.lux .kv[data-len="l"]{font-size:clamp(27px,3vw,38px)}
.kgrid.lux .kd{margin-top:11px;font-size:12.5px;line-height:1.5;color:var(--text-dim)}
.kgrid.lux .kd b{color:var(--text);font-weight:600}

/* brand scoreboard */
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.bcard{position:relative;overflow:hidden;text-align:left;padding:20px 21px 19px;border-radius:17px;
  border:1px solid var(--border);cursor:pointer;transition:.2s var(--ease);
  background:linear-gradient(152deg,color-mix(in srgb,var(--bc) 15%,var(--surface)) 0%,var(--surface) 58%)}
.bcard::after{content:"";position:absolute;right:-56px;top:-76px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--bc) 26%,transparent),transparent 68%);pointer-events:none}
.bcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--bc) 55%,transparent)}
.bcard.on{border-color:var(--bc);box-shadow:0 0 0 1px var(--bc),0 16px 44px color-mix(in srgb,var(--bc) 22%,transparent)}
.bcard .bh{display:flex;align-items:center;gap:11px;position:relative;min-height:34px}
.bcard .bh img{height:30px;width:auto;max-width:132px;object-fit:contain}
.bcard .bh img.sq{height:30px;width:30px;border-radius:8px;object-fit:cover;background:#000}
.bcard .bh img.mk{object-fit:contain;background:transparent;filter:invert(var(--logo-invert));height:32px;width:auto;max-width:150px}
.bcard .bh .nm{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text)}
.bcard .bh .tick{margin-left:auto;font-size:11px;color:var(--bc);opacity:0;transition:.18s}
.bcard.on .bh .tick{opacity:1}
.bcard .bmain{position:relative;margin-top:16px}
.bcard .bmain .l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.bcard .bmain .v{font-family:var(--fd);font-size:32px;font-weight:700;line-height:1.02;margin-top:5px;color:var(--text)}
.bcard .brow{position:relative;display:flex;gap:16px;margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.bcard .brow div{min-width:0}
.bcard .brow .l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.bcard .brow .v{font-family:var(--fd);font-size:19px;font-weight:700;margin-top:3px;color:var(--bc)}
.bcard .bar{position:relative;margin-top:15px}
.bcard .bar .t{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-bottom:6px;letter-spacing:.03em}
.bcard .bar .t b{color:var(--text);font-weight:600}
.bcard .bar .track{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bcard .bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bc),color-mix(in srgb,var(--bc) 55%,transparent));transition:width .5s var(--ease)}
@media(max-width:700px){
  .band{padding:22px 20px;gap:16px}
  .band .bstat{padding-left:0;border-left:0;border-top:1px solid var(--border);padding-top:14px;text-align:left;width:100%}
  .band .bmarks{justify-content:flex-start}
  .kgrid.lux .kv{font-size:38px}
}

@media(max-width:980px){
  .cell[data-w="third"],.cell[data-w="twothird"]{grid-column:span 3}
  .stickybar{top:82px}
}
@media(max-width:700px){
  .cell,.cell[data-w="half"],.cell[data-w="third"],.cell[data-w="twothird"]{grid-column:span 6}
  main{padding:14px 13px 50px}
  .stickybar{margin:0 -13px 12px;padding:9px 13px;top:78px}
  .top-in{padding:9px 13px;gap:9px}
  nav.tabs{padding:0 13px}
  .hero{flex-wrap:wrap;gap:12px;padding:16px}
  .hero .hstat{margin-left:0;text-align:left;width:100%}
  .kgrid.big .kpi .kv{font-size:36px}
  .kpi .kv{font-size:27px}
  .hlp .tip{width:min(280px,74vw)}
  #periodPill{display:none}
  .top-in{gap:7px}
  .pill{padding:6px 9px;font-size:11px}
  .cur-tog button{padding:6px 9px;font-size:11px}

}
</style>
</head>

  roas         : M('ROAS','ratio',['revenue','spend'],t=>t.spend?t.revenue/t.spend:0,'Return On Ad Spend — how many currency units of sales came back for every unit spent. Above 1× means the media paid for itself.','Sales ÷ Amount Spent'),
  cpa          : M('CPA','money',['spend','purchases'],t=>t.purchases?t.spend/t.purchases:0,'Cost Per Acquisition — average media cost to generate one purchase. Lower is better.','Amount Spent ÷ Purchases'),
  aov          : M('AOV','money',['revenue','purchases'],t=>t.purchases?t.revenue/t.purchases:0,'Average Order Value — average basket size of the purchases the ads drove.','Sales ÷ Purchases'),
  cvr          : M('Conversion Rate','rate',['purchases','link_clicks'],t=>t.link_clicks?t.purchases/t.link_clicks*100:0,'Share of people who clicked through and then purchased.','Purchases ÷ Link Clicks × 100'),
  impressions  : M('Impressions','int',['impressions'],t=>t.impressions,'Total number of times the ads were rendered on screen.','SUM(Impressions)'),
  reach        : M('Reach','int',['reach'],t=>t.reach,'Number of unique people who saw the ads at least once.','SUM(Reach)'),
  frequency    : M('Frequency','dec',['impressions','reach'],t=>t.reach?t.impressions/t.reach:0,'Average number of times each reached person saw an ad. Above ~3 usually signals creative fatigue.','Impressions ÷ Reach'),
  cpm          : M('CPM','money',['spend','impressions'],t=>t.impressions?t.spend/t.impressions*1000:0,'Cost per 1,000 impressions — the price of attention. Lower means cheaper delivery.','Amount Spent ÷ Impressions × 1,000'),
  clicks       : M('Clicks (All)','int',['clicks'],t=>t.clicks,'Every click on the ad, including likes, comments, profile taps and link clicks.','SUM(Clicks (All))'),
  link_clicks  : M('Link Clicks','int',['link_clicks'],t=>t.link_clicks,'Clicks that sent someone to the destination URL.','SUM(Link Clicks)'),
  ctr          : M('CTR','rate',['clicks','impressions'],t=>t.impressions?t.clicks/t.impressions*100:0,'Click-Through Rate — how often an impression turned into any click. A proxy for creative relevance.','Clicks (All) ÷ Impressions × 100'),
  ctr_link     : M('Link CTR','rate',['link_clicks','impressions'],t=>t.impressions?t.link_clicks/t.impressions*100:0,'Click-through rate counting only clicks to the destination URL — the stricter, more commercial read of CTR.','Link Clicks ÷ Impressions × 100'),
  cpc          : M('CPC (All)','money',['spend','clicks'],t=>t.clicks?t.spend/t.clicks:0,'Average cost of any click on the ad.','Amount Spent ÷ Clicks (All)'),
  cpc_link     : M('Cost per Link Click','money',['spend','link_clicks'],t=>t.link_clicks?t.spend/t.link_clicks:0,'Average cost to send one person to the website.','Amount Spent ÷ Link Clicks'),
  video_views  : M('Video Views','int',['video_views'],t=>t.video_views,'3-second video plays — the top of the video funnel.','SUM(3-Second Video Plays)'),
  thruplays    : M('ThruPlays','int',['thruplays'],t=>t.thruplays,'Plays to completion, or to at least 15 seconds for longer assets.','SUM(ThruPlays)'),
  vtr          : M('VTR','rate',['thruplays','impressions'],t=>t.impressions?t.thruplays/t.impressions*100:0,'View-Through Rate — the share of impressions that watched the video through. The single best signal of whether the creative holds attention.','ThruPlays ÷ Impressions × 100'),
  vtr100       : M('Completion Rate','rate',['v100','video_views'],t=>t.video_views?t.v100/t.video_views*100:0,'Of the people who started the video, the share who watched 100% of it.','Video Plays @100% ÷ 3-Second Plays × 100'),
  hook_rate    : M('Hook Rate','rate',['video_views','impressions'],t=>t.impressions?t.video_views/t.impressions*100:0,'Share of impressions that stopped the scroll for at least 3 seconds. Diagnoses the first frame.','3-Second Plays ÷ Impressions × 100'),
  hold_rate    : M('Hold Rate','rate',['v50','video_views'],t=>t.video_views?t.v50/t.video_views*100:0,'Of the people who started the video, the share still watching at the halfway point.','Video Plays @50% ÷ 3-Second Plays × 100'),
  cpv          : M('Cost per View','money',['spend','video_views'],t=>t.video_views?t.spend/t.video_views:0,'Average cost of one 3-second video view.','Amount Spent ÷ 3-Second Video Plays'),
  lpv          : M('Landing Page Views','int',['lpv'],t=>t.lpv,'People who clicked and actually waited for the page to load — a cleaner read than link clicks.','SUM(Landing Page Views)'),
  cost_per_lpv : M('Cost per LPV','money',['spend','lpv'],t=>t.lpv?t.spend/t.lpv:0,'Average cost of one fully-loaded landing page view.','Amount Spent ÷ Landing Page Views'),
  lp_rate      : M('LP View Rate','rate',['lpv','link_clicks'],t=>t.link_clicks?t.lpv/t.link_clicks*100:0,'Share of link clicks that survived to a loaded page. Low values point at site speed, not creative.','Landing Page Views ÷ Link Clicks × 100'),
  atc          : M('Adds to Cart','int',['atc'],t=>t.atc,'Number of add-to-cart events attributed to the ads.','SUM(Adds to Cart)'),
  cost_per_atc : M('Cost per ATC','money',['spend','atc'],t=>t.atc?t.spend/t.atc:0,'Average media cost of one add-to-cart.','Amount Spent ÷ Adds to Cart'),
  atc_rate     : M('ATC Rate','rate',['atc','lpv'],t=>t.lpv?t.atc/t.lpv*100:0,'Share of landing page views that added an item to cart.','Adds to Cart ÷ Landing Page Views × 100'),
  cart_to_buy  : M('Cart → Purchase','rate',['purchases','atc'],t=>t.atc?t.purchases/t.atc*100:0,'Share of carts that converted into a purchase — isolates checkout friction from ad quality.','Purchases ÷ Adds to Cart × 100'),
  leads        : M('Leads','int',['leads'],t=>t.leads,'Total lead conversions attributed to the ads.','SUM(Leads)'),
  cpl          : M('Cost per Lead','money',['spend','leads'],t=>t.leads?t.spend/t.leads:0,'Average media cost of one lead.','Amount Spent ÷ Leads'),
  results      : M('Results','int',['results'],t=>t.results,'The optimisation event each campaign was actually bought against.','SUM(Results)'),
  cost_per_result:M('Cost per Result','money',['spend','results'],t=>t.results?t.spend/t.results:0,'Average cost of the campaign’s own optimisation event.','Amount Spent ÷ Results'),
  engagements  : M('Engagements','int',['engagements'],t=>t.engagements,'All post engagement: reactions, comments, shares, saves and clicks.','SUM(Post Engagement)'),
  eng_rate     : M('Engagement Rate','rate',['engagements','impressions'],t=>t.impressions?t.engagements/t.impressions*100:0,'Share of impressions that produced an engagement — the social-health read on the creative.','Post Engagement ÷ Impressions × 100'),
  cost_per_eng : M('Cost per Engagement','money',['spend','engagements'],t=>t.engagements?t.spend/t.engagements:0,'Average media cost of one engagement.','Amount Spent ÷ Post Engagement'),
  budget       : M('Budget','money',['budget'],t=>t.budget,'Planned budget from the sheet, for pacing against actual spend.','SUM(Budget)'),
  pacing       : M('Pacing','rate',['spend','budget'],t=>t.budget?t.spend/t.budget*100:0,'Share of the planned budget delivered so far.','Amount Spent ÷ Budget × 100')
};
const METRIC_KEYS = Object.keys(METRICS);
</script>
<script>
/* ======================= STATE ======================= */
let ROLE='client', CUR='AED', RATE=CONFIG.usdRate;
const state={ rows:[], headers:[], colMap:{}, dims:[], present:new Set(),
              filters:{}, dateFrom:null, dateTo:null, tab:'exec',
              searchIdx:[], ts:null, gid:null };
let CHARTS=[];

/* ======================= HELPERS ======================= */
const $  = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=h=>String(h==null?'':h).toLowerCase().replace(/[ ]/g,' ').replace(/\s+/g,' ').trim();
const bare=h=>norm(h).replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 %]/g,'').replace(/\s+/g,' ').trim();
const defer=fn=>setTimeout(fn,0);
const uid =()=>'w'+Math.random().toString(36).slice(2,8);

function toNum(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return isFinite(v)?v:0;
  const s=String(v).replace(/[^\d.\-]/g,'');
  const n=parseFloat(s);
  return isFinite(n)?n:0;
}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m){const a=+m[1],b=+m[2];return a>12?new Date(+m[3],b-1,a):new Date(+m[3],a-1,b);}
  const d=new Date(s); return isNaN(d)?null:d;
}
const dkey=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const dlabel=d=>d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';

/* ---------- formatting ---------- */
function money(n){ return moneyIn(CUR==='USD' ? n/RATE : n); }
function moneyIn(v){                        // v is already in the displayed currency
  const sym = CUR==='USD' ? '$' : 'AED ';
  const a=Math.abs(v);
  if(a>=1e9) return sym+(v/1e9).toFixed(2)+'B';
  if(a>=1e6) return sym+(v/1e6).toFixed(2)+'M';
  if(a>=10000) return sym+Math.round(v).toLocaleString('en-US');
  if(a>=100) return sym+v.toLocaleString('en-US',{maximumFractionDigits:0});
  return sym+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmt(key,n){
  if(!isFinite(n))n=0;
  const k=METRICS[key]?METRICS[key].kind:'dec';
  if(k==='money')return money(n);
  if(k==='rate') return (Math.abs(n)>=100?n.toFixed(0):n.toFixed(2))+'%';
  if(k==='ratio')return n.toFixed(2)+'×';
  if(k==='int'){const a=Math.abs(n);
    if(a>=1e6)return (n/1e6).toFixed(2)+'M';
    if(a>=1e5)return (n/1e3).toFixed(0)+'K';
    return Math.round(n).toLocaleString('en-US');}
  return n.toFixed(2);
}
function rawVal(key,t){                     // chart-axis value (currency-converted)
  const v=METRICS[key].num(t)||0;
  return MONEY_METRICS.has(key)&&CUR==='USD' ? v/RATE : v;
}
/* Chart values come out of rawVal() already converted, so they must be formatted
   with fmtC — fmt() would divide by the rate a second time. */
function fmtC(key,n){
  if(!isFinite(n))n=0;
  const m=METRICS[key];
  return (m&&m.kind==='money'&&MONEY_METRICS.has(key)) ? moneyIn(n) : fmt(key,n);
}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600);}

/* ======================= COLUMN MAPPING ======================= */
function autoMap(headers){
  const map={}, used=new Set();
  const take=(cands)=>{
    for(const c of cands){ const h=headers.find(x=>!used.has(x)&&norm(x)===c); if(h){used.add(h);return h;} }
    for(const c of cands){ const h=headers.find(x=>!used.has(x)&&bare(x)===bare(c)); if(h){used.add(h);return h;} }
    return null;
  };
  DIMENSIONS.forEach(d=>{ const h=take(d.syn); if(h)map[d.key]=h; });
  const dh=take(DATE_SYN); if(dh)map.date=dh;
  Object.entries(MEASURES).forEach(([k,syn])=>{ const h=take(syn); if(h)map[k]=h; });
  /* last-resort fuzzy pass for the columns that matter most */
  const fuzzy={spend:'spent',impressions:'impression',reach:'reach',link_clicks:'link click',
               purchases:'purchase',revenue:'value',clicks:'click',thruplays:'thruplay',
               video_views:'video play',engagements:'engagement',lpv:'landing page'};
  Object.entries(fuzzy).forEach(([k,frag])=>{
    if(map[k])return;
    const h=headers.find(x=>!used.has(x)&&bare(x).includes(frag));
    if(h){map[k]=h;used.add(h);}
  });
  return map;
}
function saveMap(){ try{localStorage.setItem(K.map,JSON.stringify(state.colMap));}catch(e){} }
function loadSavedMap(){ try{const s=localStorage.getItem(K.map);return s?JSON.parse(s):null;}catch(e){return null;} }

/* ======================= DATA SOURCE ======================= */
function srcOverride(){ try{return JSON.parse(localStorage.getItem(K.src)||'{}');}catch(e){return {};} }
function csvUrl(gid){
  const o=srcOverride();
  let base=(o.base||CONFIG.sheetBase).trim();
  const g = gid || o.gid || CONFIG.sheetGid || '';
  const cb = '_cb='+Date.now();
  /* already a fully-formed csv link with a gid → just bust the cache */
  if(/output=csv/.test(base) && /[?&]gid=\d+/.test(base)) return base+'&'+cb;
  /* a normal /spreadsheets/d/<id>/... link (not a published /d/e/ one) → use the gviz csv endpoint */
  const m = base.match(/\/spreadsheets\/d\/(?!e\/)([a-zA-Z0-9-_]+)/);
  if(m) return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g?'&gid='+g:''}&`+cb;
  base=base.split('?')[0].replace(/\/pubhtml$/,'/pub');
  return base+'?'+(g?`gid=${g}&single=true&`:'')+'output=csv&'+cb;
}
async function resolveGid(){
  const o=srcOverride();
  if(o.gid) return o.gid;
  if(CONFIG.sheetGid) return CONFIG.sheetGid;
  const cached=localStorage.getItem(SLUG+'_gid');
  if(cached) return cached;
  const tab=norm(o.tab||CONFIG.sheetTab||'');
  if(!tab) return '';
  try{
    const base=(o.base||CONFIG.sheetBase).replace(/\/pub(\?.*)?$/,'/pubhtml');
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
    const res=await fetch(base,{signal:ctl.signal}); clearTimeout(t);
    if(!res.ok)throw 0;
    const html=await res.text();
    const re=/sheet-button-(\d+)["'][^>]*>\s*(?:<a[^>]*>)?\s*([^<]+)/g;
    let m,found='',first='';
    while((m=re.exec(html))){
      const gid=m[1], name=norm(m[2]);
      if(!first)first=gid;
      if(name===tab||name.replace(/\s+/g,'')===tab.replace(/\s+/g,'')) found=gid;
    }
    if(found){ localStorage.setItem(SLUG+'_gid',found); return found; }
  }catch(e){}
  return '';
}

function liveUrl(){
  const o=srcOverride();
  const id=(o.id||CONFIG.sheetId||'').trim(); if(!id) return '';
  const tab=(o.tab||CONFIG.sheetTab||'').trim();
  const g=o.gid||CONFIG.sheetGid||'';
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`+(g?`&gid=${g}`:(tab?`&sheet=${encodeURIComponent(tab)}`:''))+'&_cb='+Date.now();
}
async function pullCsv(gid,url){
  const res=await fetch(url||csvUrl(gid),{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const csv=await res.text();
  if(/^\s*</.test(csv)) throw new Error('The sheet returned a web page instead of CSV — re-check File → Share → Publish to web → CSV.');
  const p=Papa.parse(csv.trim(),{header:true,skipEmptyLines:'greedy',transformHeader:h=>String(h||'').trim()});
  const rows=p.data.filter(r=>Object.values(r).some(v=>v!=null&&v!==''));
  if(!rows.length) throw new Error('The sheet loaded but returned no rows.');
  return {rows,headers:(p.meta.fields||[]).filter(Boolean)};
}
async function fetchRows(){
  /* 1. live read by tab name */
  const lu=liveUrl();
  if(lu){
    try{ const r=await pullCsv('',lu); state.gid=''; state.srcMode='live'; return r; }
    catch(err){ console.warn('live sheet read failed, falling back to the published CSV:',err.message); }
  }
  /* 2. published CSV, tab resolved to a gid (never a silently different tab) */
  const gid=await resolveGid();
  state.gid=gid;
  try{ const r=await pullCsv(gid); state.srcMode=gid?'published':'published-first'; return r; }
  catch(err){
    if(!gid) throw err;
    /* a stale or wrong gid should never break the page — fall back to the default sheet */
    localStorage.removeItem(SLUG+'_gid'); state.gid='';
    const r=await pullCsv(''); state.srcMode='published-first'; return r;
  }
}

async function loadData(silent){
  try{
    const {rows,headers}=await fetchRows();
    state.rows=rows; state.headers=headers; state.ts=Date.now();
    try{localStorage.setItem(K.cache,JSON.stringify({rows,headers,ts:state.ts}));}catch(e){}
    $('#staleBanner').classList.remove('on'); $('#errBanner').classList.remove('on');
    return true;
  }catch(err){
    const c=localStorage.getItem(K.cache);
    if(c){
      try{
        const {rows,headers,ts}=JSON.parse(c);
        state.rows=rows;state.headers=headers;state.ts=ts;
        const b=$('#staleBanner'); b.classList.add('on');
        b.innerHTML='⚠ Live sheet unreachable — showing the last successful pull from <b>'+new Date(ts).toLocaleString('en-GB')+'</b>.';
        return true;
      }catch(e){}
    }
    const b=$('#errBanner'); b.classList.add('on');
    b.innerHTML='✕ Could not load the Google Sheet. '+esc(err.message||'')+' — check that the sheet is still published to the web as CSV.';
    return false;
  }
}

/* ======================= PREP ======================= */
function prepare(){
  const saved=loadSavedMap()||(CONFIG.baked&&CONFIG.baked.map)||null;
  const auto=autoMap(state.headers);
  state.colMap = saved ? Object.assign({},auto,saved) : auto;
  Object.keys(state.colMap).forEach(k=>{ if(!state.headers.includes(state.colMap[k])) delete state.colMap[k]; });

  state.present=new Set(Object.keys(state.colMap));
  state.dims=DIMENSIONS.filter(d=>state.colMap[d.key]);

  const dc=state.colMap.date;
  const pairs=SUM_KEYS.filter(k=>state.colMap[k]).map(k=>[k,state.colMap[k]]);
  state.rows.forEach(r=>{
    r.__d = dc?parseDate(r[dc]):null; r.__dk = r.__d?dkey(r.__d):'';
    const m={}; for(let i=0;i<pairs.length;i++) m[pairs[i][0]]=toNum(r[pairs[i][1]]);
    r.__m=m;
  });

  state.brandRules=loadBrandRules();
  resolveBrands();
  /* No Brand column in the sheet? Synthesise one from the detected brand so the
     exec chart, the Brand filter and the brand tabs all keep working. */
  state.brandSynthetic=false; state.brandNormalised=false;
  if(state.rows.some(r=>r.__b)){
    const brandCol=state.colMap.brand;
    const lbl={}; CONFIG.brands.forEach(b=>lbl[b.key]=b.label);
    /* Group on the detected brand, not the raw cell, so "DEKA" and
       "DEKA Middle East" are one brand. Rows matching none of the configured
       brands are left blank and drop out of the brand charts and filter, so
       only the three real brands are ever shown. */
    state.rows.forEach(r=>{ r.__brand = r.__b ? lbl[r.__b] : ''; });
    state.colMap.brand='__brand';
    state.brandSynthetic=!brandCol; state.brandNormalised=true;
    state.present.add('brand');
    state.dims=DIMENSIONS.filter(d=>state.colMap[d.key]);
  }

  buildSearchIndex();
  const ds=state.rows.map(r=>r.__d).filter(Boolean).sort((a,b)=>a-b);
  state.minDate=ds[0]||null; state.maxDate=ds[ds.length-1]||null;
}
/* ---------- brand detection ----------
   A brand is matched against the Brand column when it exists; when it doesn't
   (or nothing matches) we scan the other text dimensions, because campaign and
   ad-set names almost always carry the brand. Fully overridable in Admin → Brands. */
const BRAND_SCAN=['brand','campaign_name','adset','creative_name','market','objective'];
function loadBrandRules(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(K.brands)||'null');}catch(e){}
  if(!saved && CONFIG.baked && CONFIG.baked.brands) saved=CONFIG.baked.brands;
  const out={};
  CONFIG.brands.forEach(b=>{
    const s=saved&&saved[b.key];
    out[b.key]={ col:(s&&s.col)||'auto',
                 match:(s&&Array.isArray(s.match)&&s.match.length)?s.match.slice():b.match.slice() };
  });
  return out;
}
function saveBrandRules(){ try{localStorage.setItem(K.brands,JSON.stringify(state.brandRules));}catch(e){} }
function resolveBrands(){
  const rules=state.brandRules||{};
  /* longest match strings win, so "deka" beats a generic "spartan" in "Spartan DEKA …" */
  const tests=[];
  CONFIG.brands.forEach(b=>{
    const r=rules[b.key]||{col:'auto',match:b.match};
    const cols=((r.col&&r.col!=='auto')?[r.col]:BRAND_SCAN).map(c=>state.colMap[c]).filter(Boolean);
    /* the raw Meta "Ad name" carries the whole naming convention even when the
       split-out Brand cell is blank, so it is always part of the auto scan */
    if(!(r.col&&r.col!=='auto')){ const an=rawAdNameCol(); if(an&&!cols.includes(an)) cols.push(an); }
    (r.match||[]).map(norm).filter(Boolean).forEach(m=>tests.push({key:b.key,m,cols,len:m.length}));
  });
  tests.sort((a,b)=>b.len-a.len);
  state.rows.forEach(r=>{
    r.__b='';
    for(let i=0;i<tests.length;i++){
      const t=tests[i];
      for(let j=0;j<t.cols.length;j++){
        const v=r[t.cols[j]];
        if(v && norm(v).includes(t.m)){ r.__b=t.key; break; }
      }
      if(r.__b)break;
    }
  });
}
function rawAdNameCol(){ return state.headers.find(h=>['ad name','ad','ad_name'].includes(norm(h)))||null; }
function brandRows(key){ return state.rows.filter(r=>r.__b===key); }
function brandSourceLabel(key){
  const r=(state.brandRules||{})[key]||{};
  if(r.col&&r.col!=='auto') return (DIMENSIONS.find(d=>d.key===r.col)||{}).label||r.col;
  const hit=BRAND_SCAN.find(c=>state.colMap[c]&&state.rows.some(x=>x.__b===key&&norm(x[state.colMap[c]]).match(new RegExp((r.match||[]).map(m=>norm(m).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')||'$^'))));
  return hit?((DIMENSIONS.find(d=>d.key===hit)||{}).label||hit):'—';
}
function metricAvailable(key){
  const m=METRICS[key]; if(!m)return false;
  return m.need.every(n=>state.present.has(n));
}
function availableMetrics(){ return METRIC_KEYS.filter(metricAvailable); }

function distinct(dimKey,rows){
  const col=state.colMap[dimKey]; if(!col)return [];
  const m=new Map();
  (rows||state.rows).forEach(r=>{
    const v=r[col]; if(v==null||v==='')return;
    const s=String(v).trim(); if(!s)return;
    m.set(s,(m.get(s)||0)+1);
  });
  return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]);
}
function buildSearchIndex(){
  const idx=[];
  state.dims.forEach(d=>{
    distinct(d.key).forEach(([v,n])=>idx.push({dim:d.key,dimLabel:d.label,val:v,n,lc:norm(v)}));
  });
  state.searchIdx=idx;
}

/* ======================= AGGREGATION ======================= */
const SUM_KEYS=Object.keys(MEASURES);
function totals(rows){
  const t={}; SUM_KEYS.forEach(k=>t[k]=0);
  for(let i=0;i<rows.length;i++){
    const m=rows[i].__m; if(!m)continue;
    for(const k in m) t[k]+=m[k];
  }
  t.__n=rows.length;
  return t;
}
function groupBy(rows,dimKey){
  const col=state.colMap[dimKey]; const g=new Map();
  if(!col)return g;
  /* the normalised brand column is blank for rows matching no configured
     brand — those get no bucket at all rather than a "(not set)" one */
  const drop=col==='__brand';
  rows.forEach(r=>{
    const blank=(r[col]==null||r[col]==='');
    if(blank&&drop)return;
    const v=blank?'(not set)':String(r[col]).trim();
    if(!g.has(v))g.set(v,[]); g.get(v).push(r);
  });
  return g;
}
function groupByDay(rows){
  const g=new Map();
  rows.forEach(r=>{ if(!r.__dk)return; if(!g.has(r.__dk))g.set(r.__dk,[]); g.get(r.__dk).push(r); });
  return new Map(Array.from(g.entries()).sort((a,b)=>a[0]<b[0]?-1:1));
}
</script>
<script>
/* ======================= WIDGET TYPES ======================= */

const WIDTHS=[['full','Full'],['twothird','2/3'],['half','Half'],['third','Third']];

/* ======================= DEFAULT LAYOUT ======================= */

      exec:{
        title:'Executive Summary', skin:'itp', logo:'itp', sq:true, mark:'itp', markSq:true, sub:'ITP Sports · all brands',

          W({type:'brandcards',title:'Brand Scoreboard',metrics:['revenue','roas','purchases'],
             help:'One card per brand. The large figure is Sales, with ROAS and Purchases underneath and the brand’s share of total media investment shown as a bar. Click a card to filter the whole page to that brand.'})
        ]
      },
      analytics:{
        title:'Analytics', skin:'itp', logo:'itp', sq:true, mark:'itp', markSq:true, sub:'Deep dive · all brands',
        filters:['brand','age','gender','campaign_name','funnel','objective','language','post_type','creative_type','creative_name','platform','market','placement','adset'],
        widgets:[
          W({type:'kpis',title:'Key Metrics',metrics:['spend','impressions','reach','frequency','cpm','link_clicks','ctr','cpc_link','vtr','purchases','cpa','revenue','roas','aov','cvr']}),
          W({type:'line',title:'Daily Delivery — Spend vs Sales',metrics:['spend','revenue'],chart:'line'}),
          W({type:'pie',title:'Spend Share by Brand',dim:'brand',metric:'spend',w:'third'}),
          W({type:'doughnut',title:'Purchases by Funnel Stage',dim:'funnel',metric:'purchases',w:'third'}),
          W({type:'pie',title:'Spend by Objective',dim:'objective',metric:'spend',w:'third'}),
          W({type:'bar',title:'Campaigns — Spend vs ROAS',dim:'campaign_name',metrics:['spend','roas'],limit:10}),
          W({type:'hbar',title:'Top Creative by Sales',dim:'creative_name',metrics:['revenue'],limit:10,w:'half'}),
          W({type:'stacked',title:'Spend by Age, split by Gender',dim:'age',split:'gender',metric:'spend',limit:12,w:'half'}),
          W({type:'bar',title:'Creative Type — Impressions vs CTR',dim:'creative_type',metrics:['impressions','ctr'],limit:10,w:'third'}),
          W({type:'table',title:'Creative Performance',dim:'creative_name',
             metrics:['spend','impressions','ctr','vtr','link_clicks','purchases','cpa','revenue','roas'],limit:80,w:'twothird'})

let VIEWCFG=null;
function loadCfg(){
  try{const s=localStorage.getItem(K.cfg); if(s){const v=JSON.parse(s); if(v&&v.tabs&&v.order)return v;}}catch(e){}
  if(CONFIG.baked&&CONFIG.baked.cfg)return JSON.parse(JSON.stringify(CONFIG.baked.cfg));
  return defaultCfg();
}
function saveCfg(){ try{localStorage.setItem(K.cfg,JSON.stringify(VIEWCFG));toast('Layout saved to this browser');}catch(e){toast('Could not save');} }
function resetCfg(){ localStorage.removeItem(K.cfg); VIEWCFG=defaultCfg(); renderAll(); toast('Layout reset to default'); }

/* prune widgets/metrics whose columns are missing so nothing renders empty */
function usableWidget(w){
  const T=WTYPES[w.type]; if(!T)return false;
  if(T.fields.includes('dim')  && !state.colMap[w.dim]) return false;
  if(T.fields.includes('split')&& !state.colMap[w.split]) return false;
  if(T.fields.includes('metric')&& !metricAvailable(w.metric)) return false;
  if(T.fields.includes('metrics')){
    const ok=(w.metrics||[]).filter(metricAvailable);
    if(!ok.length) return false;
  }
  if(w.type==='line' && !state.colMap.date) return false;
  return true;
}
const wMetrics=w=>(w.metrics||[]).filter(metricAvailable);

/* ======================= FILTERS ======================= */
function tabCfg(){ return VIEWCFG.tabs[state.tab]; }
function lockedRows(){
  const t=tabCfg();
  if(t.lockBrand) return state.rows.filter(r=>r.__b===t.lockBrand);
  return state.rows;
}
let _lvCache={tab:null,set:null};
function lockedValues(){
  const t=tabCfg(); if(!t.lockBrand)return null;
  if(_lvCache.tab===state.tab&&_lvCache.set)return _lvCache.set;
  const s=new Set(), lr=lockedRows();
  state.dims.forEach(d=>{ const col=state.colMap[d.key];
    lr.forEach(r=>{ const v=(r[col]==null||r[col]==='')?'(not set)':String(r[col]).trim(); s.add(d.key+'|'+v); }); });
  _lvCache={tab:state.tab,set:s}; return s;
}
function applyFilters(rows){
  const cm=state.colMap, f=state.filters, keys=Object.keys(f);
  return (rows||lockedRows()).filter(r=>{
    for(let i=0;i<keys.length;i++){
      const k=keys[i], set=f[k], c=cm[k];
      if(!c||!set||!set.size)continue;
      const v=(r[c]==null||r[c]==='')?'(not set)':String(r[c]).trim();
      if(!set.has(v))return false;
    }
    if(r.__d){
      if(state.dateFrom&&r.__d<state.dateFrom)return false;
      if(state.dateTo&&r.__d>state.dateTo)return false;
    }
    return true;
  });
}
function toggleFilter(dim,val){
  if(!state.colMap[dim])return;
  const s=state.filters[dim]||(state.filters[dim]=new Set());
  s.has(val)?s.delete(val):s.add(val);
  if(!s.size)delete state.filters[dim];
  renderAll();
}
function setFilter(dim,val){ state.filters[dim]=new Set([val]); renderAll(); }
function clearDim(dim){ delete state.filters[dim]; renderAll(); }
function clearAll(){ state.filters={}; state.dateFrom=state.dateTo=null;
  const a=$('#dFrom'),b=$('#dTo'); if(a)a.value=''; if(b)b.value=''; renderAll(); }
function toggleDate(k){
  const d=parseDate(k);
  if(state.dateFrom&&state.dateTo&&dkey(state.dateFrom)===k&&dkey(state.dateTo)===k){state.dateFrom=state.dateTo=null;}
  else{state.dateFrom=d;state.dateTo=d;}
  syncDateInputs(); renderAll();
}
function syncDateInputs(){
  const a=$('#dFrom'),b=$('#dTo');
  if(a)a.value=state.dateFrom?dkey(state.dateFrom):'';
  if(b)b.value=state.dateTo?dkey(state.dateTo):'';
}

/* ======================= UNIVERSAL SEARCH ======================= */
let sugHi=-1;
function runSearch(q){
  const box=$('#sugg'); if(!box)return;
  const t=norm(q);
  if(!t){box.classList.remove('on');box.innerHTML='';sugHi=-1;return;}
  const shown=new Set(tabCfg().filters||[]);
  const lv=lockedValues();
  const pool=state.searchIdx.filter(x=>(shown.has(x.dim)||!(tabCfg().filters||[]).length)&&(!lv||lv.has(x.dim+'|'+x.val)));
  const scored=[];
  for(const it of pool){
    let sc=-1;
    if(it.lc===t)sc=0;
    else if(it.lc.startsWith(t))sc=1;
    else if(it.lc.includes(t))sc=2;
    else if(norm(it.dimLabel)===t)sc=3;              // typing a dimension name
    else if(norm(it.dimLabel).includes(t))sc=4;
    if(sc>=0)scored.push({...it,sc});
  }
  scored.sort((a,b)=>a.sc-b.sc||b.n-a.n);
  const top=scored.slice(0,40);
  if(!top.length){ box.innerHTML='<div class="empty">No filter value matches “'+esc(q)+'”</div>'; box.classList.add('on'); sugHi=-1; return; }
  const groups={};
  top.forEach(x=>{(groups[x.dimLabel]=groups[x.dimLabel]||[]).push(x);});
  let h='',i=0;
  for(const [g,items] of Object.entries(groups)){
    h+='<div class="s-h">'+esc(g)+'</div>';
    items.forEach(x=>{
      const on=state.filters[x.dim]&&state.filters[x.dim].has(x.val);
      h+=`<button data-i="${i++}" onclick="pickSearch('${esc(x.dim)}',this.dataset.v)" data-v="${esc(x.val)}">
            <span class="tag">${esc(x.dimLabel)}</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.val)}</span>
            <span style="color:var(--text-faint);font-size:11px">${x.n}${on?' ✓':''}</span></button>`;
    });
  }
  box.innerHTML=h; box.classList.add('on'); sugHi=-1;
}
function pickSearch(dim,val){
  $('#sugg').classList.remove('on');
  const inp=$('#gsearch'); if(inp)inp.value='';
  toggleFilter(dim,val);
}
function searchKey(e){
  const box=$('#sugg'); if(!box||!box.classList.contains('on'))return;
  const btns=Array.from(box.querySelectorAll('button'));
  if(e.key==='ArrowDown'){e.preventDefault();sugHi=Math.min(sugHi+1,btns.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();sugHi=Math.max(sugHi-1,0);}
  else if(e.key==='Enter'){e.preventDefault();(btns[sugHi<0?0:sugHi]||{click(){}}).click();return;}
  else if(e.key==='Escape'){box.classList.remove('on');return;}
  else return;
  btns.forEach((b,i)=>b.classList.toggle('hi',i===sugHi));
  if(btns[sugHi])btns[sugHi].scrollIntoView({block:'nearest'});
}

<script>
/* ======================= COLOURS ======================= */
const BRANDCOL={ spartan:{d:'#A9BACB',l:'#4E637A'}, tm:{d:'#F2570A',l:'#D94A05'}, deka:{d:'#FF3B30',l:'#D81410'} };
const CAT_D=['#F2570A','#4DA3FF','#FFC043','#2FC4A0','#FF6B6B','#B27CF0','#A9BACB','#63B3ED','#F5D36B','#7DDFC3','#FF9BB0','#C9A0FF'];
const CAT_L=['#D94A05','#1F6FD0','#B07800','#0E8F72','#D13B3B','#7A45C4','#54677A','#2C6FA8','#9A7B12','#2E8F79','#C4526C','#8A55C9'];
const isDark=()=>document.documentElement.getAttribute('data-theme')!=='light';
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||
              getComputedStyle(document.body).getPropertyValue(n).trim();
function catColors(labels,dim){
  const pal=isDark()?CAT_D:CAT_L;
  return labels.map((l,i)=>{
    if(dim==='brand'){
      const v=norm(l), b=CONFIG.brands.find(x=>x.match.some(m=>v.includes(m)));
      if(b&&BRANDCOL[b.key])return isDark()?BRANDCOL[b.key].d:BRANDCOL[b.key].l;
    }
    return pal[i%pal.length];
  });
}
function seriesPrimary(){
  const b=(cssv('--brand')||'').trim();
  const m=b.match(/^#?([0-9a-fA-F]{6})$/);
  if(m){ const n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,bl=n&255;
    const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);
    const s=mx?(mx-mn)/mx:0, l=mx/255;
    if(s>0.28 && l>0.22) return b; }
  return isDark()?CAT_D[1]:CAT_L[1];
}
const alpha=(hex,a)=>{const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};

/* ======================= HELP TEXT ======================= */
function helpText(w){
  if(w.help)return {t:w.title||WTYPES[w.type].label,b:w.help,f:''};
  const ms=wMetrics(w), one=w.metric&&metricAvailable(w.metric)?w.metric:(ms[0]||'spend');
  const dl=(state.dims.find(d=>d.key===w.dim)||{}).label||'';
  const lbl=k=>METRICS[k]?METRICS[k].label:k;
  const f=(w.type==='table'?ms:(w.metric?[w.metric]:ms)).filter(k=>METRICS[k])
          .map(k=>`${METRICS[k].label} = ${METRICS[k].formula}`).join('\n');
  const body={
    bigkpis :()=>`Headline numbers for everything currently in view. ${ms.map(k=>METRICS[k].label+' — '+METRICS[k].help).join(' ')}`,
    kpis    :()=>`Every headline metric for the current filter selection. Values recalculate the moment you change a filter, click a bar, or pick a date.`,
    line    :()=>`${ms.map(lbl).join(' and ')} plotted day by day, so you can see delivery, spikes and dips over the flight. Click any point to filter the whole page to that single day.`,
    bar     :()=>`${lbl(ms[0])} shown as bars against ${dl}${ms[1]?`, with ${lbl(ms[1])} overlaid as a line on the right axis`:''}. Bars are ranked and capped at the top ${w.limit||12}. Click a bar to filter the page to that ${dl.toLowerCase()}.`,
    hbar    :()=>`The top ${w.limit||10} ${dl.toLowerCase()} values ranked by ${lbl(ms[0])}. Click a bar to filter the page to it.`,
    stacked :()=>`${lbl(one)} broken out by ${dl}, with each bar split by ${(state.dims.find(d=>d.key===w.split)||{}).label||'the split dimension'}. Useful for reading audience mix inside each group.`,
    pie     :()=>`Share of total ${lbl(one)} held by each ${dl.toLowerCase()}. Slices are proportional to the value; click one to filter the page.`,
    doughnut:()=>`Share of total ${lbl(one)} held by each ${dl.toLowerCase()}. Click a segment to filter the page to it.`,
    polar   :()=>`Each ${dl.toLowerCase()} drawn as a wedge whose radius is its ${lbl(one)}. Click a wedge to filter.`,
    radar   :()=>`${dl} compared across ${ms.map(lbl).join(', ')}. Each metric is scaled to its own maximum so shapes stay comparable.`,
    funnel  :()=>`The journey step by step: ${ms.map(lbl).join(' → ')}. Each bar shows the absolute number and the drop-off from the step before it.`,
    table   :()=>`Every ${dl.toLowerCase()} with ${ms.map(lbl).join(', ')}. Click any column header to sort — click again to reverse. Click a row to filter the whole page to it.`
  }[w.type];
  return {t:w.title||WTYPES[w.type].label, b:body?body():'', f};
}
function helpHTML(w){
  const h=helpText(w);
  return `<span class="hlp"><button onclick="this.parentNode.classList.toggle('on');event.stopPropagation()" aria-label="What is this?">?</button>
    <span class="tip"><b>${esc(h.t||WTYPES[w.type].label)}</b>${esc(h.b)}${h.f?`<code>${esc(h.f)}</code>`:''}</span></span>`;
}
document.addEventListener('click',e=>{ if(!e.target.closest('.hlp')) $$('.hlp.on').forEach(x=>x.classList.remove('on')); });

/* ======================= SHELL RENDER ======================= */
function visibleTabs(){
  return VIEWCFG.order.filter(k=>{
    const t=VIEWCFG.tabs[k]; if(!t)return false;
    /* admin always sees every brand tab so an unmatched brand can be fixed;
       the client only sees a brand tab once it actually has rows */
    if(t.lockBrand && ROLE!=='admin') return state.rows.some(r=>r.__b===t.lockBrand);
    return true;
  });
}
function renderTabs(){
  $('#tabNav').innerHTML=visibleTabs().map(k=>{
    const t=VIEWCFG.tabs[k]; if(!t)return '';
    const mk=t.mark||t.logo, cls=(t.markSq?'sq':'')+(t.inv?' inv mk':'');

      ${mk?`<img class="${cls}" src="${LOGOS[mk]||''}" alt="">`:''}<span>${esc(t.title)}</span></button>`;
  }).join('');
}
function switchTab(k){
  if(!VIEWCFG.tabs[k])return;
  state.tab=k;
  const t=VIEWCFG.tabs[k];
  Object.keys(state.filters).forEach(d=>{ if(!(t.filters||[]).includes(d)&&d!=='brand')delete state.filters[d]; });
  if(t.lockBrand)delete state.filters.brand;
  document.body.setAttribute('data-brandskin',t.skin||'itp');
  renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}
function periodLabel(rows){
  const ds=rows.map(r=>r.__d).filter(Boolean).sort((a,b)=>a-b);
  if(!ds.length)return '—';
  const a=ds[0],b=ds[ds.length-1];
  return dkey(a)===dkey(b)?a.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})
    :`${a.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})} – ${b.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`;
}

function controlBar(){
  const t=tabCfg();
  const dims=(t.filters||[]).map(k=>state.dims.find(d=>d.key===k)).filter(Boolean);
  const hasDate=!!state.colMap.date;
  if(!dims.length&&!hasDate&&state.tab!=='analytics')return chipsHTML()?`<div class="stickybar"><div class="chips">${chipsHTML()}</div></div>`:'';
  let h='<div class="stickybar"><div class="ctrls">';
  if(dims.length)
    h+=`<div class="search-wrap"><span class="ic">⌕</span>
        <input id="gsearch" placeholder="Search anything — 65+, male, awareness, video…" autocomplete="off" spellcheck="false"
               oninput="runSearch(this.value)" onkeydown="searchKey(event)" onfocus="runSearch(this.value)">

          <input class="dt-in" id="dFrom" type="date" title="From" onchange="state.dateFrom=this.value?parseDate(this.value):null;renderAll()">

        </span>`;
  h+='</div>';
  const c=chipsHTML(); if(c)h+=`<div class="chips">${c}</div>`;
