}
function fpFilter(inp){
  const q=norm(inp.value);
  inp.parentNode.querySelectorAll('label').forEach(l=>{
    l.style.display=norm(l.querySelector('.val').textContent).includes(q)?'':'none';
  });
}
function chipsHTML(){
  let h='';
  Object.entries(state.filters).forEach(([d,set])=>{
    const lbl=(DIMENSIONS.find(x=>x.key===d)||{}).label||d;
    set.forEach(v=>{h+=`<span class="chip"><b>${esc(lbl)}</b>${esc(v)}<button onclick="toggleFilter('${esc(d)}',this.dataset.v)" data-v="${esc(v)}">×</button></span>`;});
  });
  if(state.dateFrom||state.dateTo)
    h+=`<span class="chip"><b>Dates</b>${state.dateFrom?dkey(state.dateFrom):'…'} → ${state.dateTo?dkey(state.dateTo):'…'}<button onclick="state.dateFrom=state.dateTo=null;syncDateInputs();renderAll()">×</button></span>`;
  if(h)h+=`<span class="chip clr"><button onclick="clearAll()" style="opacity:1">Clear all ×</button></span>`;
  return h;
}
function bandHTML(){
  const t=tabCfg(); if(!t.band)return '';
  const rows=applyFilters(), tt=totals(rows);
  const stat = metricAvailable('spend') ? ['spend','Total Investment']
             : (metricAvailable('impressions') ? ['impressions','Impressions'] : null);
  const live = state.ts && !$('#staleBanner').classList.contains('on');
  const marks = CONFIG.brands.map(b=>{
    const mk=b.mark||b.logo;
    return `<img class="${b.inv?'mk':''}" src="${LOGOS[mk]||''}" alt="${esc(b.label)}" title="${esc(b.label)}">`;
  }).join('');
  const nBrands=new Set(state.rows.filter(r=>r.__b).map(r=>r.__b)).size;
  return `<div class="band">
    <img class="bl" src="${LOGOS.itp||''}" alt="ITP Media Group">
    <div class="bt">
      <div class="ovl">ITP Media Group · Paid Media</div>
      <h1>Executive Summary</h1>
      <div class="meta">
        <span>${esc(periodLabel(rows))}</span><span style="opacity:.35">|</span>
        <span>${nBrands||CONFIG.brands.length} brands</span><span style="opacity:.35">|</span>
        <span class="dot"><i></i>${live?'Live from Google Sheets':'Cached data'}</span>
      </div>
    </div>
    ${stat?`<div class="bstat"><b>${fmt(stat[0],METRICS[stat[0]].num(tt))}</b><span>${stat[1]}</span>
      <div class="bmarks">${marks}</div></div>`:''}
  </div>`;
}
function heroHTML(){
  const t=tabCfg(); if(!t.lockBrand)return '';
  const rows=applyFilters(), tt=totals(rows);
  const head=metricAvailable('roas')?['roas','ROAS']:(metricAvailable('spend')?['spend','Amount Spent']:null);
  const cls=(t.sq?'sq':'')+(t.inv?' inv':'');
  return `<div class="hero"><img class="hl ${cls}" src="${LOGOS[t.logo]||''}" alt="${esc(t.title)}">
    <div><h1>${esc(t.title)}</h1><p>${esc(t.sub||'')} · ${rows.length.toLocaleString()} rows in view</p></div>
    ${head?`<div class="hstat"><b>${fmt(head[0],METRICS[head[0]].num(tt))}</b><span>${head[1]}</span></div>`:''}</div>`;
}
</script>
<script>
/* ======================= RENDER ======================= */
function renderAll(){
  CHARTS.forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS=[];
  const vis=visibleTabs();
  if(!vis.includes(state.tab)) state.tab=vis[0]||'analytics';
  const t=tabCfg(); if(!t)return;
  document.body.setAttribute('data-brandskin',t.skin||'itp');
  document.body.setAttribute('data-tab',state.tab);
  const mk=t.mark||t.logo, cls=(t.markSq?'sq':'')+(t.inv?' inv mk':'');
  $('#hdrLogo').src=LOGOS[mk]||''; $('#hdrLogo').className='lg '+cls;
  $('#hdrTitle').textContent=CONFIG.org; $('#hdrSub').textContent=t.title;
  renderTabs();

  const rows=applyFilters();
  $('#periodPill').textContent=periodLabel(rows);
  $('#ftRows').textContent=rows.length.toLocaleString()+' of '+state.rows.length.toLocaleString()+' rows';
  $('#ftUpd').textContent=state.ts?('Updated '+new Date(state.ts).toLocaleString('en-GB')):'';
  const tab=srcOverride().tab||CONFIG.sheetTab;
  $('#ftSrc').textContent=
    state.srcMode==='live'            ? 'Live source: Google Sheets · '+tab+' · read live' :
    state.srcMode==='published'       ? 'Source: published CSV · '+tab+' (gid '+state.gid+') · up to 5 min behind' :
    state.srcMode==='published-first' ? 'Source: published CSV · first tab (tab "'+tab+'" could not be resolved) · up to 5 min behind' :
                                        'Source: Google Sheets · '+tab;

  const widgets=(t.widgets||[]).filter(usableWidget);
  let html=controlBar()+bandHTML()+heroHTML()+(ROLE==='admin'?adminHTML():'');
  if(!rows.length){
    html+=`<div class="panel"><div class="empty-st"><b>No data in view</b>Nothing matches the current filters. Remove a filter above to bring the numbers back.</div></div>`;
  }else if(!widgets.length){
    html+=`<div class="panel"><div class="empty-st"><b>Nothing to show yet</b>None of this view's widgets could be matched to columns in the sheet. Open Admin → Column Mapping to point them at the right columns.</div></div>`;
  }else{
    html+='<div class="wgrid">'+widgets.map(w=>widgetHTML(w,rows)).join('')+'</div>';
  }
  $('#viewHost').innerHTML=html;
  syncDateInputs();
  requestAnimationFrame(()=>{ widgets.forEach(w=>{ try{drawWidget(w,rows)}catch(e){console.warn('widget',w.type,e)} }); });
}

/* ---------- widget markup ---------- */
function widgetHTML(w,rows){
  const t=totals(rows);
  if(w.type==='brandcards') return brandCardsHTML(w,rows);
  if(w.type==='bigkpis'||w.type==='kpis'){
    const big=w.type==='bigkpis';
    const cards=wMetrics(w).map(k=>{
      const m=METRICS[k], v=fmt(k,m.num(t));
      const L=v.length>(big?12:11)?'l':(v.length>(big?9:8)?'m':'');
      const note=big?plainEnglish(k,t):esc(m.formula);
      return `<div class="kpi"><div class="kl">${esc(m.label)}${helpKPI(k)}</div>
        <div class="kv"${L?` data-len="${L}"`:''}>${esc(v)}</div>
        <div class="kd">${note}</div></div>`;
    }).join('');
    return `<div class="cell" data-w="${w.w||'full'}">
      ${w.title?`<div style="display:flex;align-items:center;gap:9px;margin-bottom:10px"><h3 style="font-family:var(--fd);font-size:14.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">${esc(w.title)}</h3>${helpHTML(w)}</div>`:''}
      <div class="kgrid ${big?'big lux':''}">${cards}</div></div>`;
  }
  const body = w.type==='table' ? `<div class="tbl-wrap"><table class="dt" id="tb_${w.id}"></table></div>`
                                : `<div class="cwrap"><canvas id="cv_${w.id}"></canvas></div>`;
  return `<div class="cell" data-w="${w.w||'full'}"><div class="panel">
      <div class="ph"><h3>${esc(w.title||WTYPES[w.type].label)}</h3>${helpHTML(w)}</div>
      <div class="pbody">${body}</div></div></div>`;
}
/* one plain-English line per headline number — written for a non-technical reader */
function plainEnglish(k,t){
  const v=METRICS[k].num(t)||0;
  const cur=CUR==='USD'?'$1':'AED 1';
  const back=MONEY_METRICS.has('revenue')&&CUR==='USD'?'$':'AED ';
  const map={
    roas    :()=>`For every <b>${cur}</b> invested in media, <b>${(v).toFixed(2)}</b> came back in sales.`,
    revenue :()=>`Total revenue the paid campaigns generated across all brands this period.`,
    purchases:()=>`Orders placed by people who came from a paid ad this period.`,
    spend   :()=>`Total media investment behind the numbers on this page.`,
    impressions:()=>`Times an ITP Sports ad appeared on someone’s screen.`,
    reach   :()=>`Individual people reached at least once by the campaigns.`,
    cpa     :()=>`Average media cost behind each order.`,
    aov     :()=>`Average value of an order driven by paid media.`
  };
  return map[k]?map[k]():esc(METRICS[k].help);
}
/* ---------- brand scoreboard ---------- */
function brandCardsHTML(w,rows){
  const ms=wMetrics(w);
  const hero=ms[0]||'revenue', s1=ms[1], s2=ms[2];
  const hasSpend=metricAvailable('spend');
  const all=applyFilters(state.rows);                 /* ignore the brand lock: exec view is cross-brand */
  const totalSpend=hasSpend?METRICS.spend.num(totals(all)):0;
  const cards=CONFIG.brands.map(b=>{
    const rs=all.filter(r=>r.__b===b.key);
    const t=totals(rs);
    const on=state.filters.brand&&Array.from(state.filters.brand).some(v=>norm(v).includes(b.match[0]));
    const col=(isDark()?(BRANDCOL[b.key]||{}).d:(BRANDCOL[b.key]||{}).l)||cssv('--brand');
    const sp=hasSpend?METRICS.spend.num(t):0;
    const share=totalSpend?sp/totalSpend*100:0;
    const mk=b.mark||b.logo;
    const label=rs.length?'':'<span style="font-size:10px;color:var(--text-faint);letter-spacing:.05em">no matching rows</span>';
    return `<button class="bcard ${on?'on':''}" style="--bc:${col}" onclick="defer(()=>pickBrand('${b.key}'))">
      <div class="bh">
        <img class="${b.inv?'mk':(b.sq?'sq':'')}" src="${LOGOS[mk]||''}" alt="${esc(b.label)}">
        <span class="nm">${esc(b.label)}</span><span class="tick">● Filtered</span>
      </div>
      <div class="bmain"><div class="l">${esc(METRICS[hero].label)}</div>
        <div class="v">${rs.length?fmt(hero,METRICS[hero].num(t)):'—'}</div>${label}</div>
      ${(s1||s2)?`<div class="brow">
        ${s1?`<div><div class="l">${esc(METRICS[s1].label)}</div><div class="v">${rs.length?fmt(s1,METRICS[s1].num(t)):'—'}</div></div>`:''}
        ${s2?`<div><div class="l">${esc(METRICS[s2].label)}</div><div class="v">${rs.length?fmt(s2,METRICS[s2].num(t)):'—'}</div></div>`:''}
      </div>`:''}
      ${hasSpend?`<div class="bar"><div class="t"><span>Share of investment</span><b>${share.toFixed(1)}% · ${fmt('spend',sp)}</b></div>
        <div class="track"><div class="fill" style="width:${Math.max(share,rs.length?2:0).toFixed(1)}%"></div></div></div>`:''}
    </button>`;
  }).join('');
  return `<div class="cell" data-w="${w.w||'full'}">
    ${w.title?`<div style="display:flex;align-items:center;gap:9px;margin:6px 0 11px"><h3 style="font-family:var(--fd);font-size:14.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">${esc(w.title)}</h3>${helpHTML(w)}</div>`:''}
    <div class="bcards">${cards}</div></div>`;
}
function pickBrand(key){
  const b=CONFIG.brands.find(x=>x.key===key); if(!b)return;
  const col=state.colMap.brand;
  const vals=col ? Array.from(new Set(brandRows(key).map(r=>String(r[col]||'').trim()).filter(Boolean))) : [];
  if(vals.length){
    const cur=state.filters.brand;
    const same=cur&&cur.size===vals.length&&vals.every(v=>cur.has(v));
    if(same)delete state.filters.brand; else state.filters.brand=new Set(vals);
    renderAll();
  } else {                                   /* no Brand column → jump to the brand's own tab */
    switchTab(key);
  }
}
function helpKPI(k){
  const m=METRICS[k];
  return `<span class="hlp"><button onclick="this.parentNode.classList.toggle('on');event.stopPropagation()">?</button>
    <span class="tip"><b>${esc(m.label)}</b>${esc(m.help)}<code>${esc(m.formula)}</code></span></span>`;
}

/* ---------- value labels on short bar charts ---------- */
const VLAB={ id:'vlab',
  afterDatasetsDraw(c,args,o){
    if(!o||!o.on)return;
    const ds=c.data.datasets[0]; if(!ds)return;
    const meta=c.getDatasetMeta(0); if(!meta||meta.type!=='bar')return;
    const ctx=c.ctx; ctx.save();
    ctx.font='600 11px '+(getComputedStyle(document.body).getPropertyValue('--ff')||'Inter, sans-serif').replace(/^\s*'?/,'').split(',')[0];
    ctx.font="600 11.5px 'Barlow Condensed', Inter, sans-serif";
    ctx.fillStyle=cssv('--text-dim'); ctx.textAlign='center'; ctx.textBaseline='bottom';
    meta.data.forEach((el,i)=>{
      const v=ds.data[i]; if(v==null)return;
      const txt=o.fmt?o.fmt(v):abbr(v);
      if(o.horiz){ ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(txt, el.x+7, el.y); }
      else { ctx.fillText(txt, el.x, el.y-5); }
    });
    ctx.restore();
  }};

/* ---------- shared chart config ---------- */
function baseOpts(){
  const grid=cssv('--grid')||'rgba(255,255,255,.06)', text=cssv('--text-dim')||'#98a2ae';
  Chart.defaults.font.family="'Inter',system-ui,sans-serif";
  Chart.defaults.font.size=11;
  return {
    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:true,position:'top',align:'end',
        labels:{color:text,boxWidth:9,boxHeight:9,usePointStyle:true,pointStyle:'rectRounded',padding:12,font:{size:11}}},
      tooltip:{backgroundColor:isDark()?'#232830':'#ffffff',titleColor:cssv('--text'),bodyColor:text,
        borderColor:cssv('--border-2'),borderWidth:1,padding:10,cornerRadius:8,displayColors:true,boxPadding:4}
    },
    scales:{
      x:{grid:{display:false},ticks:{color:text,maxRotation:45,minRotation:0,autoSkip:true,maxTicksLimit:14,
         callback(v){const l=this.getLabelForValue(v);return String(l).length>22?String(l).slice(0,21)+'…':l;}},border:{color:grid}},
      y:{grid:{color:grid,drawBorder:false},ticks:{color:text,maxTicksLimit:6},border:{display:false},beginAtZero:true}
    }
  };
}
function abbr(n){const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(1)+'B'; if(a>=1e6)return (n/1e6).toFixed(1)+'M';
  if(a>=1e3)return (n/1e3).toFixed(a>=1e5?0:1)+'K'; return (a<10&&a%1?n.toFixed(2):Math.round(n).toString());}
function tipFmt(key){ return ctx=>` ${METRICS[key].label}: ${fmtC(key,ctx.parsed.y!=null?ctx.parsed.y:ctx.parsed)}`; }

/* ---------- grouped aggregation for dimension charts ---------- */
function dimSeries(w,rows){
  const g=groupBy(rows,w.dim);
  const ms=wMetrics(w);
  let arr=Array.from(g.entries()).map(([label,rs])=>{
    const t=totals(rs); const o={label,_t:t};
    ms.forEach(k=>o[k]=rawVal(k,t));
    return o;
  });
  const sortK=ms[0];
  arr.sort((a,b)=>(b[sortK]||0)-(a[sortK]||0));
  const lim=+w.limit||12;
  if(arr.length>lim){
    const head=arr.slice(0,lim);
    arr=head;
  }
  return {arr,ms};
}

/* ======================= DRAW ======================= */
function drawWidget(w,rows){
  if(w.type==='bigkpis'||w.type==='kpis'||w.type==='brandcards')return;
  if(w.type==='table')return drawTable(w,rows);
  const cv=document.getElementById('cv_'+w.id); if(!cv)return;
  const fn={line:drawLine,bar:drawBar,hbar:drawBar,stacked:drawStacked,pie:drawPie,doughnut:drawPie,
            polar:drawPie,radar:drawRadar,funnel:drawFunnel}[w.type];
  if(fn)fn(w,rows,cv);
}

function drawLine(w,rows,cv){
  const days=groupByDay(rows), ms=wMetrics(w);
  const labels=Array.from(days.keys());
  const per=labels.map(d=>totals(days.get(d)));
  const pal=isDark()?CAT_D:CAT_L;
  const brand=seriesPrimary();
  const ds=ms.map((k,i)=>{
    const col=i===0?brand:pal[(i+1)%pal.length];
    return {label:METRICS[k].label,data:per.map(t=>rawVal(k,t)),borderColor:col,
      backgroundColor:w.chart==='bar'?alpha(col,.75):alpha(col,.13),
      type:w.chart==='bar'?'bar':'line',fill:w.chart!=='bar'&&i===0,tension:.32,borderWidth:2,
      pointRadius:0,pointHoverRadius:5,pointBackgroundColor:col,yAxisID:i===0?'y':(ms.length>1?'y1':'y'),order:i};
  });
  const o=baseOpts();
  o.scales.x.ticks.callback=function(v){const l=this.getLabelForValue(v);const d=parseDate(l);return d?dlabel(d):l;};
  o.scales.y.ticks.callback=v=>abbr(v);
  if(ms.length>1)o.scales.y1={position:'right',grid:{display:false},border:{display:false},
    ticks:{color:cssv('--text-dim'),maxTicksLimit:6,callback:v=>abbr(v)},beginAtZero:true};
  o.plugins.tooltip.callbacks={label:ctx=>` ${ctx.dataset.label}: ${fmtC(ms[ctx.datasetIndex],ctx.parsed.y)}`,
    title:it=>{const d=parseDate(it[0].label);return d?d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}):it[0].label;}};
  o.onClick=(e,el)=>{ if(el.length){const v=labels[el[0].index]; defer(()=>toggleDate(v));} };
  CHARTS.push(new Chart(cv,{type:w.chart==='bar'?'bar':'line',data:{labels:labels,datasets:ds},options:o}));
}

function drawBar(w,rows,cv){
  const {arr,ms}=dimSeries(w,rows);
  const horiz=w.type==='hbar';
  const labels=arr.map(a=>a.label);
  const prim=seriesPrimary();
  const n=labels.length;
  const fill = w.dim==='brand' ? catColors(labels,w.dim)
             : labels.map((_,i)=>alpha(prim, horiz? (0.95-(i/Math.max(n-1,1))*0.55) : 0.88));
  const thick = horiz ? 30 : (n<=3?120:(n<=5?86:(n<=8?60:46)));
  const ds=[{label:METRICS[ms[0]].label,data:arr.map(a=>a[ms[0]]),
    backgroundColor:fill,borderRadius:5,borderSkipped:false,maxBarThickness:thick,order:2,yAxisID:'y'}];
  if(ms[1]&&!horiz){
    const c2=(isDark()?CAT_D:CAT_L)[1];
    ds.push({label:METRICS[ms[1]].label,data:arr.map(a=>a[ms[1]]),type:'line',borderColor:c2,
      backgroundColor:c2,borderWidth:2,tension:.3,pointRadius:3,pointHoverRadius:6,yAxisID:'y1',order:1});
  }
  const o=baseOpts();
  o.indexAxis=horiz?'y':'x';
  if(horiz){ o.scales.x.grid={color:cssv('--grid')}; o.scales.x.ticks={color:cssv('--text-dim'),callback:v=>abbr(v)};
             o.scales.y.grid={display:false}; o.scales.y.ticks={color:cssv('--text-dim'),autoSkip:false,
               callback(v){const l=this.getLabelForValue(v);return String(l).length>26?String(l).slice(0,25)+'…':l;}};
             o.interaction={mode:'nearest',intersect:true}; }
  else { o.scales.y.ticks.callback=v=>abbr(v);
         if(ms[1])o.scales.y1={position:'right',grid:{display:false},border:{display:false},
           ticks:{color:cssv('--text-dim'),maxTicksLimit:6,callback:v=>abbr(v)},beginAtZero:true}; }
  o.plugins.legend.display=ds.length>1||horiz===false&&ms.length>1;
  o.plugins.tooltip.callbacks={label:ctx=>{
    const k=ctx.datasetIndex===0?ms[0]:ms[1];
    return ` ${METRICS[k].label}: ${fmtC(k,horiz?ctx.parsed.x:ctx.parsed.y)}`;},
    afterBody:it=>{const a=arr[it[0].dataIndex];if(!a)return'';
      const extra=[];
      if(metricAvailable('spend')&&ms[0]!=='spend')extra.push('Spend: '+fmt('spend',METRICS.spend.num(a._t)));
      if(metricAvailable('roas')&&!ms.includes('roas'))extra.push('ROAS: '+fmt('roas',METRICS.roas.num(a._t)));
      return extra.length?'\n'+extra.join('\n'):'';}};
  o.onClick=(e,el)=>{ if(el.length){const v=labels[el[0].index]; defer(()=>toggleFilter(w.dim,v));} };
  const showVals = n<=10 && ds.length===1;
  if(showVals) o.plugins.vlab={on:true,horiz,fmt:v=>fmtC(ms[0],v)};
  if(showVals&&horiz) o.layout={padding:{right:56}};
  if(showVals&&!horiz) o.layout={padding:{top:18}};
  CHARTS.push(new Chart(cv,{type:'bar',data:{labels,datasets:ds},options:o,plugins:showVals?[VLAB]:[]}));
}

function drawStacked(w,rows,cv){
  const mk=metricAvailable(w.metric)?w.metric:wMetrics(w)[0];
  const g=groupBy(rows,w.dim), sc=state.colMap[w.split];
  const splits=Array.from(new Set(rows.map(r=>(r[sc]==null||r[sc]==='')?'(not set)':String(r[sc]).trim()))).slice(0,10);
  let labels=Array.from(g.keys());
  labels.sort((a,b)=>rawVal(mk,totals(g.get(b)))-rawVal(mk,totals(g.get(a))));
  labels=labels.slice(0,+w.limit||12);
  const pal=isDark()?CAT_D:CAT_L;
  const ds=splits.map((s,i)=>({label:s,backgroundColor:pal[i%pal.length],borderRadius:4,borderSkipped:false,maxBarThickness:52,
    data:labels.map(l=>{const sub=g.get(l).filter(r=>((r[sc]==null||r[sc]==='')?'(not set)':String(r[sc]).trim())===s);
      return sub.length?rawVal(mk,totals(sub)):0;})}));
  const o=baseOpts();
  o.scales.x.stacked=true; o.scales.y.stacked=true; o.scales.y.ticks.callback=v=>abbr(v);
  o.plugins.tooltip.callbacks={label:ctx=>` ${ctx.dataset.label}: ${fmtC(mk,ctx.parsed.y)}`};
  o.onClick=(e,el)=>{ if(el.length){const v=labels[el[0].index]; defer(()=>toggleFilter(w.dim,v));} };
  CHARTS.push(new Chart(cv,{type:'bar',data:{labels,datasets:ds},options:o}));
}

function drawPie(w,rows,cv){
  const mk=metricAvailable(w.metric)?w.metric:wMetrics(w)[0];
  const g=groupBy(rows,w.dim);
  let arr=Array.from(g.entries()).map(([label,rs])=>({label,v:rawVal(mk,totals(rs))}))
          .filter(a=>a.v>0).sort((a,b)=>b.v-a.v);
  const lim=+w.limit||10;
  if(arr.length>lim){ const rest=arr.slice(lim-1).reduce((s,a)=>s+a.v,0); arr=arr.slice(0,lim-1).concat([{label:'Other',v:rest,_o:1}]); }
  const labels=arr.map(a=>a.label), cols=catColors(labels,w.dim);
  const total=arr.reduce((s,a)=>s+a.v,0)||1;
  const o=baseOpts(); delete o.scales; o.interaction={mode:'nearest',intersect:true};
  o.plugins.legend.position='right'; o.plugins.legend.align='center';
  o.plugins.legend.labels.pointStyle='circle'; o.plugins.legend.labels.padding=9;
  o.plugins.tooltip.callbacks={label:ctx=>` ${ctx.label}: ${fmtC(mk,ctx.parsed)} (${(ctx.parsed/total*100).toFixed(1)}%)`};
  o.onClick=(e,el)=>{ if(el.length&&!arr[el[0].index]._o){const v=labels[el[0].index]; defer(()=>toggleFilter(w.dim,v));} };
  if(w.type==='doughnut')o.cutout='58%';
  CHARTS.push(new Chart(cv,{type:w.type==='polar'?'polarArea':(w.type==='doughnut'?'doughnut':'pie'),
    data:{labels,datasets:[{data:arr.map(a=>a.v),backgroundColor:cols,borderColor:cssv('--surface'),borderWidth:2,hoverOffset:6}]},options:o}));
}

function drawRadar(w,rows,cv){
  const ms=wMetrics(w), g=groupBy(rows,w.dim);
  let labels=Array.from(g.keys());
  labels.sort((a,b)=>rawVal(ms[0],totals(g.get(b)))-rawVal(ms[0],totals(g.get(a))));
  labels=labels.slice(0,+w.limit||6);
  const raw=labels.map(l=>{const t=totals(g.get(l));return ms.map(k=>rawVal(k,t));});
  const max=ms.map((_,i)=>Math.max(...raw.map(r=>r[i]))||1);
  const pal=isDark()?CAT_D:CAT_L;
  const ds=labels.map((l,i)=>({label:l,data:raw[i].map((v,j)=>v/max[j]*100),
    borderColor:pal[i%pal.length],backgroundColor:alpha(pal[i%pal.length],.14),borderWidth:2,pointRadius:2}));
  const o=baseOpts(); delete o.scales; o.interaction={mode:'nearest',intersect:false};
  o.scales={r:{angleLines:{color:cssv('--grid')},grid:{color:cssv('--grid')},
    pointLabels:{color:cssv('--text-dim'),font:{size:10.5}},ticks:{display:false},suggestedMin:0,suggestedMax:100}};
  o.plugins.tooltip.callbacks={label:ctx=>` ${ctx.dataset.label} · ${METRICS[ms[ctx.dataIndex]].label}: ${fmtC(ms[ctx.dataIndex],raw[ctx.datasetIndex][ctx.dataIndex])}`};
  CHARTS.push(new Chart(cv,{type:'radar',data:{labels:ms.map(k=>METRICS[k].label),datasets:ds},options:o}));
}

function drawFunnel(w,rows,cv){
  const ms=wMetrics(w), t=totals(rows);
  const vals=ms.map(k=>rawVal(k,t));
  const pal=isDark()?CAT_D:CAT_L;
  const o=baseOpts(); o.indexAxis='y'; o.plugins.legend.display=false;
  o.scales.x.grid={color:cssv('--grid')}; o.scales.x.ticks={color:cssv('--text-dim'),callback:v=>abbr(v)};
  o.scales.y.grid={display:false}; o.scales.y.ticks={color:cssv('--text-dim'),autoSkip:false};
  o.plugins.tooltip.callbacks={label:ctx=>{
    const i=ctx.dataIndex, drop=i>0&&vals[i-1]?` · ${(vals[i]/vals[i-1]*100).toFixed(1)}% of previous step`:'';
    return ` ${fmtC(ms[i],vals[i])}${drop}`;}};
  CHARTS.push(new Chart(cv,{type:'bar',data:{labels:ms.map(k=>METRICS[k].label),
    datasets:[{data:vals,backgroundColor:ms.map((_,i)=>alpha(pal[i%pal.length],.85)),borderRadius:5,borderSkipped:false,maxBarThickness:34}]},options:o}));
}

/* ---------- sortable table ---------- */
function drawTable(w,rows){
  const el=document.getElementById('tb_'+w.id); if(!el)return;
  const ms=wMetrics(w), g=groupBy(rows,w.dim);
  let arr=Array.from(g.entries()).map(([label,rs])=>{
    const t=totals(rs); const o={label,_t:t}; ms.forEach(k=>o[k]=METRICS[k].num(t)); return o;
  });
  const sk=w.sortKey&&(w.sortKey==='label'||ms.includes(w.sortKey))?w.sortKey:ms[0];
  const sd=w.sortDir||'desc';
  arr.sort((a,b)=> sk==='label'
    ? (sd==='asc'?String(a.label).localeCompare(b.label):String(b.label).localeCompare(a.label))
    : (sd==='asc'?(a[sk]||0)-(b[sk]||0):(b[sk]||0)-(a[sk]||0)));
  arr=arr.slice(0,+w.limit||100);
  const grand=totals(rows);
  const dl=(state.dims.find(d=>d.key===w.dim)||{}).label||w.dim;
  const sel=state.filters[w.dim]||new Set();
  const ar=k=>sk===k?`<span class="ar">${sd==='asc'?'▲':'▼'}</span>`:'<span class="ar">↕</span>';
  el.innerHTML=
    `<thead><tr><th class="${sk==='label'?'srt':''}" onclick="sortTable('${w.id}','label')">${esc(dl)}${ar('label')}</th>
      ${ms.map(k=>`<th class="${sk===k?'srt':''}" onclick="sortTable('${w.id}','${k}')">${esc(METRICS[k].label)}${ar(k)}</th>`).join('')}</tr></thead>
     <tbody>${arr.map(a=>`<tr class="${sel.has(a.label)?'sel':''}" onclick="defer(()=>toggleFilter('${esc(w.dim)}',this.dataset.v))" data-v="${esc(a.label)}">
       <td title="${esc(a.label)}">${esc(a.label)}</td>
       ${ms.map(k=>`<td>${fmt(k,a[k])}</td>`).join('')}</tr>`).join('')}</tbody>
     <tfoot><tr><td>Total · ${arr.length} rows</td>${ms.map(k=>`<td>${fmt(k,METRICS[k].num(grand))}</td>`).join('')}</tr></tfoot>`;
}
function sortTable(id,key){
  const t=tabCfg(); const w=(t.widgets||[]).find(x=>x.id===id); if(!w)return;
  if(w.sortKey===key)w.sortDir=w.sortDir==='asc'?'desc':'asc';
  else{w.sortKey=key;w.sortDir=key==='label'?'asc':'desc';}
  drawTable(w,applyFilters());
}
</script>
<script>
/* ======================= ADMIN PANEL ======================= */
let ADM={open:false,tab:'layout'};
function admHost(){ return VIEWCFG.tabs[state.tab]; }
function optList(arr,sel,fmtL){ return arr.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:(fmtL?fmtL(x):x);
  return `<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`;}).join(''); }

function mselHTML(wid,field,selected,options,labelFor){
  const sel=selected||[];
  const txt=sel.length?sel.map(k=>labelFor(k)).join(', '):'— none —';
  return `<details class="msel"><summary title="${esc(txt)}">${esc(txt)}</summary><div class="mp">
    ${options.map(k=>`<label><input type="checkbox" ${sel.includes(k)?'checked':''} onchange="admMulti('${wid}','${field}','${esc(k)}',this.checked)">${esc(labelFor(k))}</label>`).join('')}
  </div></details>`;
}
function adminHTML(){
  const t=admHost(), dims=state.dims, avail=availableMetrics();
  const ml=k=>METRICS[k]?METRICS[k].label:k;
  const dl=k=>(DIMENSIONS.find(d=>d.key===k)||{}).label||k;

  let layout=`<div class="asec"><h4>Widgets on “${esc(t.title)}”</h4>`;
  (t.widgets||[]).forEach((w,i)=>{
    const T=WTYPES[w.type]||{fields:[]};
    let f=`<div class="fld"><label>Title</label><input value="${esc(w.title||'')}" oninput="admSet('${w.id}','title',this.value)"></div>
      <div class="fld"><label>Type</label><select onchange="admSet('${w.id}','type',this.value)">${optList(Object.entries(WTYPES).map(([k,v])=>[k,v.label]),w.type)}</select></div>
      <div class="fld"><label>Width</label><select onchange="admSet('${w.id}','w',this.value)">${optList(WIDTHS,w.w||'full')}</select></div>`;
    if(T.fields.includes('dim'))
      f+=`<div class="fld"><label>Dimension</label><select onchange="admSet('${w.id}','dim',this.value)">${optList(dims.map(d=>[d.key,d.label]),w.dim)}</select></div>`;
    if(T.fields.includes('split'))
      f+=`<div class="fld"><label>Split by</label><select onchange="admSet('${w.id}','split',this.value)">${optList(dims.map(d=>[d.key,d.label]),w.split)}</select></div>`;
    if(T.fields.includes('metric'))
      f+=`<div class="fld"><label>Metric</label><select onchange="admSet('${w.id}','metric',this.value)">${optList(avail.map(k=>[k,ml(k)]),w.metric)}</select></div>`;
    if(T.fields.includes('metrics'))
      f+=`<div class="fld"><label>Metrics${w.type==='bar'?' (1st = bars, 2nd = line)':''}</label>${mselHTML(w.id,'metrics',w.metrics,avail,ml)}</div>`;
    if(T.fields.includes('chart'))
      f+=`<div class="fld"><label>Style</label><select onchange="admSet('${w.id}','chart',this.value)">${optList([['line','Line'],['bar','Bar']],w.chart||'line')}</select></div>`;
    if(T.fields.includes('limit'))
      f+=`<div class="fld"><label>Max rows</label><input type="number" min="2" max="500" value="${w.limit||12}" onchange="admSet('${w.id}','limit',+this.value)"></div>`;
    f+=`<div class="fld"><label>Custom “?” text (optional)</label><input value="${esc(w.help||'')}" placeholder="leave blank for the auto explanation" oninput="admSet('${w.id}','help',this.value)"></div>`;
    layout+=`<div class="wrow"><span class="grip">${i+1}</span><div class="fields">${f}</div>
      <div class="acts">
        <button onclick="admMove('${w.id}',-1)" title="Move up" ${i===0?'disabled':''}>↑</button>
        <button onclick="admMove('${w.id}',1)" title="Move down" ${i===t.widgets.length-1?'disabled':''}>↓</button>
        <button onclick="admDup('${w.id}')" title="Duplicate">⧉</button>
        <button class="del" onclick="admDel('${w.id}')" title="Remove">✕</button></div></div>`;
  });
  layout+=`<div class="wrow" style="border-style:dashed"><div class="fields">
      <div class="fld"><label>Add a widget</label><select id="admAdd">${optList(Object.entries(WTYPES).map(([k,v])=>[k,v.label]),'kpis')}</select></div>
      <div class="fld"><label>&nbsp;</label><button class="pill" onclick="admAdd()" style="padding:7px 10px">+ Add to this tab</button></div>
    </div></div></div>
    <div class="asec"><h4>Filters shown on this tab</h4><div class="map-grid">
      ${DIMENSIONS.map(d=>{const has=!!state.colMap[d.key];const on=(t.filters||[]).includes(d.key);
        return `<label class="map-row" style="cursor:${has?'pointer':'not-allowed'};opacity:${has?1:.4}">
          <input type="checkbox" ${on?'checked':''} ${has?'':'disabled'} onchange="admFilterDim('${d.key}',this.checked)" style="accent-color:var(--brand)">
          <span style="flex:1">${esc(d.label)}</span>
          <span style="color:var(--text-faint);font-size:10.5px">${has?esc(state.colMap[d.key]):'not in sheet'}</span></label>`;}).join('')}
    </div></div>`;

  const mapRow=(key,label,cur,ok)=>`<div class="map-row"><span title="${esc(label)}">${esc(label)}</span>
    <select class="${ok?'ok':''}" onchange="admMap('${key}',this.value)">
      <option value="">— none —</option>
      ${key==='brand'&&state.brandNormalised?`<option value="__brand" selected>— ${state.brandSynthetic?'auto-detected from campaign names':'grouped by detected brand'} —</option>`:''}
      ${optList(state.headers,cur)}</select></div>`;
  let mapping=`<div class="asec"><h4>Dimensions → sheet columns</h4><div class="map-grid">
      ${DIMENSIONS.map(d=>mapRow(d.key,d.label,state.colMap[d.key],!!state.colMap[d.key])).join('')}
      ${mapRow('date','Date',state.colMap.date,!!state.colMap.date)}</div></div>
    <div class="asec"><h4>Measures → sheet columns</h4><div class="map-grid">
      ${Object.keys(MEASURES).map(k=>mapRow(k,k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),state.colMap[k],!!state.colMap[k])).join('')}</div>
      <div class="note" style="margin-top:9px">Every KPI and chart is built from these columns. A metric only appears in the pickers once all of its source columns are mapped — e.g. <code>ROAS</code> needs both <code>revenue</code> and <code>spend</code>. Unmapped columns in the sheet: <b>${esc(state.headers.filter(h=>!Object.values(state.colMap).includes(h)).join(', ')||'none')}</b>.</div></div>`;

  const o=srcOverride();
  let source=`<div class="asec"><h4>Data source</h4><div class="map-grid">
      <div class="map-row"><span>Spreadsheet ID <small style="color:var(--text-faint)">(live read)</small></span><input class="fld" style="flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0" id="srcId" value="${esc(o.id||CONFIG.sheetId||'')}" placeholder="the /d/<id>/ part of the sheet URL"></div>
      <div class="map-row"><span>Published URL <small style="color:var(--text-faint)">(fallback)</small></span><input class="fld" style="flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0" id="srcBase" value="${esc(o.base||CONFIG.sheetBase)}"></div>
      <div class="map-row"><span>Tab name</span><input style="flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0" id="srcTab" value="${esc(o.tab||CONFIG.sheetTab)}"></div>
      <div class="map-row"><span>gid (optional)</span><input style="flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0" id="srcGid" value="${esc(o.gid||CONFIG.sheetGid||state.gid||'')}" placeholder="auto-detected from the tab name"></div>
      <div class="map-row"><span>AED per 1 USD</span><input type="number" step="0.0001" style="flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0" id="srcRate" value="${RATE}"></div>
    </div>
    <div class="abtns" style="border:0;padding-top:9px"><button class="primary" onclick="admSaveSrc()">Apply &amp; reload sheet</button>
      <button onclick="localStorage.removeItem(K.src);localStorage.removeItem(SLUG+'_gid');location.reload()">Reset source</button></div>
    <div class="note" style="margin-top:9px">The tab name is resolved to a <code>gid</code> automatically from the published workbook. If resolution ever fails, open sheet2 in Google Sheets, copy the number after <code>#gid=</code> in the address bar, and paste it above.</div></div>`;

  const inp='flex:1;padding:5px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;min-width:0';
  let brands=`<div class="asec"><h4>How each brand is identified</h4>
    <div class="note" style="margin-bottom:10px">A row belongs to a brand when the chosen column contains any of the match words below (not case sensitive). Leave the column on <b>Auto</b> and the dashboard scans Brand, then Campaign Name, Ad Set and Creative Name — so it still works when the sheet has no Brand column. Longer match words win, so <code>deka</code> beats <code>spartan</code> inside “Spartan DEKA”.</div>
    <div class="map-grid">`;
  CONFIG.brands.forEach(b=>{
    const r=(state.brandRules||{})[b.key]||{col:'auto',match:b.match};
    const n=state.rows.filter(x=>x.__b===b.key).length;
    brands+=`<div style="border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--surface-2)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <img src="${LOGOS[b.mark||b.logo]||''}" style="height:20px;width:20px;border-radius:5px;object-fit:${b.inv?'contain':'cover'};background:${b.inv?'transparent':'#000'};filter:${b.inv?'invert(var(--logo-invert))':'none'}">
        <b style="font-size:12px;letter-spacing:.05em">${esc(b.label)}</b>
        <span style="margin-left:auto;font-size:10.5px;color:${n?'var(--pos)':'var(--neg)'};font-weight:700">${n.toLocaleString()} rows</span></div>
      <div class="map-row" style="margin-bottom:6px"><span>Look in</span>
        <select onchange="admBrand('${b.key}','col',this.value)">
          <option value="auto" ${r.col==='auto'?'selected':''}>Auto (scan all)</option>
          ${state.dims.map(d=>`<option value="${d.key}" ${r.col===d.key?'selected':''}>${esc(d.label)}</option>`).join('')}
        </select></div>
      <div class="map-row"><span>Match words</span>
        <input style="${inp}" value="${esc((r.match||[]).join(', '))}" placeholder="spartan, spartan race"
               onchange="admBrand('${b.key}','match',this.value)"></div>
      <div style="font-size:10px;color:var(--text-faint);margin-top:6px">${n?'Matched via '+esc(brandSourceLabel(b.key)):'Nothing matched — widen the match words or pick the right column.'}</div>
    </div>`;
  });
  brands+='</div></div>';

  const body={layout,mapping,source,brands}[ADM.tab]||layout;
  return `<details class="adm" ${ADM.open?'open':''} ontoggle="ADM.open=this.open">
    <summary>⚙ Admin — Edit this dashboard<span class="tg">changes are live · Save to keep them</span></summary>
    <div class="adm-body">
      <div class="adm-tabs">
        <button class="${ADM.tab==='layout'?'on':''}" onclick="ADM.tab='layout';renderAll()">Layout &amp; Metrics</button>
        <button class="${ADM.tab==='mapping'?'on':''}" onclick="ADM.tab='mapping';renderAll()">Column Mapping</button>
        <button class="${ADM.tab==='brands'?'on':''}" onclick="ADM.tab='brands';renderAll()">Brands</button>
        <button class="${ADM.tab==='source'?'on':''}" onclick="ADM.tab='source';renderAll()">Data Source</button>
      </div>
      ${body}
      <div class="abtns">
        <button class="primary" onclick="saveCfg()">Save view</button>
        <button onclick="resetCfg()">Reset to default</button>
        <button onclick="copyCfg()">Copy config JSON</button>
        <button onclick="admApplyAll()">Apply this layout to all brand tabs</button>
      </div>
      <div class="note" style="margin-top:10px">Saved layouts live in <b>this browser only</b> — they do not travel to the client's device. To make a layout the permanent default for everyone, hit <b>Copy config JSON</b> and paste it into the <code>CONFIG.baked</code> line at the top of this file, then re-send the file.</div>
    </div></details>`;
}
function findW(id){ for(const k of VIEWCFG.order){const w=(VIEWCFG.tabs[k].widgets||[]).find(x=>x.id===id); if(w)return {w,t:VIEWCFG.tabs[k]};} return {}; }
function admSet(id,f,v){ const {w}=findW(id); if(!w)return;
  w[f]=v;
  if(f==='type'){ const T=WTYPES[v];
    if(T.fields.includes('dim')&&!state.colMap[w.dim])w.dim=(state.dims[0]||{}).key;
    if(T.fields.includes('split')&&!state.colMap[w.split])w.split=(state.dims[1]||state.dims[0]||{}).key;
    if(T.fields.includes('metric')&&!metricAvailable(w.metric))w.metric=availableMetrics()[0];
    if(T.fields.includes('metrics')&&!wMetrics(w).length)w.metrics=[availableMetrics()[0]].filter(Boolean); }
  renderAll(); }
function admMulti(id,f,val,on){ const {w}=findW(id); if(!w)return;
  w[f]=w[f]||[]; if(on){if(!w[f].includes(val))w[f].push(val);} else w[f]=w[f].filter(x=>x!==val);
  renderAll(); }
function admMove(id,d){ const t=admHost(); const i=t.widgets.findIndex(x=>x.id===id); const j=i+d;
  if(i<0||j<0||j>=t.widgets.length)return; const [x]=t.widgets.splice(i,1); t.widgets.splice(j,0,x); renderAll(); }
function admDel(id){ const t=admHost(); t.widgets=t.widgets.filter(x=>x.id!==id); renderAll(); }
function admDup(id){ const t=admHost(); const i=t.widgets.findIndex(x=>x.id===id);
  const c=JSON.parse(JSON.stringify(t.widgets[i])); c.id=uid(); t.widgets.splice(i+1,0,c); renderAll(); }
function admAdd(){ const type=$('#admAdd').value, t=admHost(), av=availableMetrics();
  t.widgets.push(W({type,title:WTYPES[type].label,dim:(state.dims[0]||{}).key,split:(state.dims[1]||state.dims[0]||{}).key,
    metric:av[0],metrics:av.slice(0,2),w:'half'})); ADM.open=true; renderAll(); }
function admFilterDim(k,on){ const t=admHost(); t.filters=t.filters||[];
  t.filters = on ? Array.from(new Set(t.filters.concat([k]))) : t.filters.filter(x=>x!==k);
  if(!on)delete state.filters[k]; renderAll(); }
function admBrand(key,field,val){
  state.brandRules=state.brandRules||loadBrandRules();
  const r=state.brandRules[key]||(state.brandRules[key]={col:'auto',match:[]});
  if(field==='match') r.match=String(val).split(',').map(x=>x.trim()).filter(Boolean);
  else r[field]=val;
  saveBrandRules(); resolveBrands(); buildSearchIndex(); _lvCache={tab:null,set:null};
  renderAll(); toast('Brand rules updated');
}
function admMap(key,col){ if(col)state.colMap[key]=col; else delete state.colMap[key];
  saveMap(); prepare(); renderAll(); toast('Column mapping updated'); }
function admSaveSrc(){
  const o={id:$('#srcId').value.trim(),base:$('#srcBase').value.trim(),tab:$('#srcTab').value.trim(),gid:$('#srcGid').value.trim()};
  RATE=parseFloat($('#srcRate').value)||CONFIG.usdRate;
  localStorage.setItem(K.src,JSON.stringify(o)); localStorage.removeItem(SLUG+'_gid');
  toast('Reloading from the new source…'); setTimeout(()=>location.reload(),600);
}
function admApplyAll(){ const src=JSON.parse(JSON.stringify(admHost().widgets));
  ['spartan','tm','deka'].forEach(k=>{ if(k===state.tab)return;
    VIEWCFG.tabs[k].widgets=src.map(w=>Object.assign({},w,{id:uid()})); });
  renderAll(); toast('Applied to all three brand tabs'); }
function copyCfg(){
  const blob={cfg:VIEWCFG,map:state.colMap,brands:state.brandRules,rate:RATE};
  const txt='CONFIG.baked = '+JSON.stringify(blob)+';';
  navigator.clipboard.writeText(txt).then(()=>toast('Config copied — paste it into CONFIG.baked'),
    ()=>{const w=window.open('','_blank');w.document.write('<pre>'+esc(txt)+'</pre>');});
}

/* ======================= AUTH / CHROME ======================= */
function attemptLogin(){
  const v=$('#passcode').value.trim(), err=$('#loginError');
  if(v&&v===CONFIG.adminCode)ROLE='admin';
  else if(v&&v===CONFIG.accessCode)ROLE='client';
  else{err.textContent='That access code isn’t right. Check the one you were sent.';$('#passcode').value='';return;}
  sessionStorage.setItem(K.sess,'1'); sessionStorage.setItem(K.role,ROLE); err.textContent=''; showApp();
}
function signOut(){ sessionStorage.removeItem(K.sess); sessionStorage.removeItem(K.role); location.reload(); }
async function showApp(){
  $('#login').style.display='none'; $('#app').classList.add('on');
  $('#rolePill').textContent = ROLE==='admin'?'Admin · edit mode':'Client view';
  const ok=await loadData();
  if(ok){ prepare(); VIEWCFG=loadCfg(); renderAll(); }
  else { $('#viewHost').innerHTML='<div class="panel"><div class="empty-st"><b>No data</b>The dashboard could not reach the Google Sheet and has no cached copy yet.</div></div>'; }
}
async function refreshData(){
  toast('Pulling the latest sheet…');
  localStorage.removeItem(SLUG+'_gid');
  const ok=await loadData(); if(ok){ prepare(); renderAll(); toast('Updated'); }
}
function setCurrency(c){ CUR=c; localStorage.setItem(K.cur,c);
  $('#curAED').classList.toggle('on',c==='AED'); $('#curUSD').classList.toggle('on',c==='USD');
  if(VIEWCFG)renderAll(); }
$('#themeToggle').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(K.theme,next); if(VIEWCFG)renderAll();
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap')) {const s=$('#sugg'); if(s)s.classList.remove('on');}
  if(!e.target.closest('details.fdd')) $$('details.fdd[open]').forEach(d=>d.open=false);
  if(!e.target.closest('details.msel')) $$('details.msel[open]').forEach(d=>d.open=false);
});
window.addEventListener('resize',()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(VIEWCFG)renderAll(); },350); });

/* ======================= INIT ======================= */
(function init(){
  document.documentElement.setAttribute('data-theme',localStorage.getItem(K.theme)||CONFIG.defaultTheme);
  CUR=localStorage.getItem(K.cur)||CONFIG.defaultCurrency;
  RATE=(CONFIG.baked&&CONFIG.baked.rate)||CONFIG.usdRate;
  $('#curAED').classList.toggle('on',CUR==='AED'); $('#curUSD').classList.toggle('on',CUR==='USD');
  $('#lgITP').src=LOGOS.itp; $('#lgSP').src=LOGOS.spartanMark; $('#lgTM').src=LOGOS.tm; $('#lgDK').src=LOGOS.deka;
  if(sessionStorage.getItem(K.sess)==='1'){ ROLE=sessionStorage.getItem(K.role)||'client'; showApp(); }
  else setTimeout(()=>$('#passcode').focus(),250);
})();
</script>
