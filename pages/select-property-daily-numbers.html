<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select Property · Daily Numbers · ITP Live</title>
<!--
  ITP LIVE · DAILY NUMBERS  (charts only build)
  Same palette and type as the full sheet. Prose removed on purpose:
  labels, figures and graphs only.
  Set CONFIG.sheetUrl to a published CSV to go live.
-->
<script>
const CONFIG = {
  client:'Select Property', brand:'itp-live', sheetUrl:null, currency:'USD',
  market:'UAE + KSA', vertical:'real-estate', language:'en', theme:'paper',
  defaultPeriod:'flight', sharedLink:'reports.itplive.me/select-property',
  contact:'performance@itp.com', refreshMins:15, showFlags:true
};
</script>
<style>
:root{
  --paper:#F1EDE3; --paper-2:#E9E3D6; --paper-3:#DFD8C7;
  --ink:#16130F; --ink-2:#4C463C; --ink-3:#8A8274;
  --rule:#CDC4B1; --rule-hard:#16130F;
  --stamp:#A82E1C; --pen:#24476B; --mark:#9C6B12; --grow:#3D6B3F;
  --serif:'Newsreader',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --maxw:1400px;
}
html[data-theme="ink"]{
  --paper:#12100D; --paper-2:#1A1713; --paper-3:#221E19;
  --ink:#F2EDE1; --ink-2:#B4AB99; --ink-3:#7A7263;
  --rule:#332D25; --rule-hard:#F2EDE1;
  --stamp:#E06A52; --pen:#7FA8D1; --mark:#D9A63F; --grow:#7BB07E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;
  padding:0 clamp(12px,3vw,40px) 50px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(var(--rule) .5px,transparent .5px);background-size:4px 4px;mix-blend-mode:multiply}
html[data-theme="ink"] body::before{mix-blend-mode:screen;opacity:.18}
.wrap{max-width:var(--maxw);margin:0 auto;position:relative;z-index:1}
.lbl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

/* masthead */
.mast{padding:20px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.mast img{height:24px;width:auto;display:block}
html[data-theme="ink"] .mast img{filter:invert(1)}
.mast-l{display:flex;align-items:flex-end;gap:13px}
.mast-tag{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-bottom:2px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button{font-family:var(--mono);font-size:10.5px;color:var(--ink);background:transparent;border:1px solid var(--rule);
  padding:5px 9px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:background .15s,border-color .15s}
button:hover{background:var(--paper-2);border-color:var(--ink-3)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex}.seg button{border-right:0}.seg button:last-child{border-right:1px solid var(--rule)}
.link-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:5px 9px;font-size:10.5px;color:var(--ink-2)}
.link-pill b{font-weight:500;color:var(--ink)}
.link-pill button{border:0;padding:0 0 0 2px;color:var(--pen)}
.dateline{display:flex;flex-wrap:wrap;border-top:2px solid var(--rule-hard);border-bottom:1px solid var(--rule-hard);margin-top:8px}
.dateline>div{padding:7px 15px 7px 0;margin-right:15px;border-right:1px solid var(--rule);
  font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.dateline>div:last-child{border-right:0;margin-right:0}
.dateline b{color:var(--ink);font-weight:600}
.live{display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grow);animation:pulse 2.4s infinite}
@keyframes pulse{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
.sample{color:var(--mark)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--rule-hard)}
.kpi{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
.kpi .k-lbl{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.kpi .v{font-size:clamp(22px,2.2vw,31px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.kpi .sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.delta{font-size:10px}
.up{color:var(--grow)}.down{color:var(--stamp)}.flat{color:var(--ink-3)}
.pin{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.pin.good{background:var(--grow)}.pin.warn{background:var(--mark)}.pin.bad{background:var(--stamp)}
.spark{width:100%;height:22px;display:block;margin-top:10px;overflow:visible}

/* flags: severity + metric + value, nothing more */
.flags{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--rule-hard)}
.flag{display:flex;align-items:center;gap:9px;padding:11px 18px 11px 0;margin-right:18px;
  border-right:1px solid var(--rule)}
.flag:last-child{border-right:0;margin-right:0}
.stamp{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid currentColor;
  padding:2px 5px;transform:rotate(-1.2deg);font-weight:600;white-space:nowrap}
.stamp.bad{color:var(--stamp)}.stamp.warn{color:var(--mark)}.stamp.good{color:var(--grow)}
.flag .fv{font-size:12.5px;font-variant-numeric:tabular-nums}
.flag .fk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}

/* pacing */
.pacing{padding:18px 0 22px;border-bottom:2px solid var(--rule-hard)}
.pace-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:11px}
.pace-figs{display:flex;gap:26px;flex-wrap:wrap}
.pace-figs>div span{display:block}
.pace-figs .v{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:3px}
.pace-bar{position:relative;height:24px;background:var(--paper-2);border:1px solid var(--rule)}
.pace-fill{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.86}
.pace-proj{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--ink-3) 0 1px,transparent 1px 6px)}
.pace-mark{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--stamp)}
.pace-mark span{position:absolute;top:-14px;left:0;transform:translateX(-50%);font-size:9px;color:var(--stamp);white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:9px;font-size:9.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:11px;height:3px;margin-right:5px;vertical-align:middle}

/* panels */
.row{display:grid;gap:0;border-bottom:2px solid var(--rule-hard)}
.row.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.pane{padding:20px 30px 22px 0;border-right:1px solid var(--rule);min-width:0}
.pane:last-child{border-right:0;padding-right:0}
.row.two .pane:last-child,.row.three .pane:last-child,.row.wide .pane:last-child{padding-left:30px}
.row.three .pane:nth-child(2){padding-left:30px}
.p-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.p-h h2{font-family:var(--serif);font-weight:400;font-size:16px;letter-spacing:-.005em}
.p-h .m{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}

svg.g{width:100%;display:block;overflow:visible}
svg.g text{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
svg.g .gl{stroke:var(--rule);stroke-width:1}
svg.g .axis{stroke:var(--rule-hard);stroke-width:1;opacity:.6}
svg.g .bar{fill:var(--ink);opacity:.22}
svg.g .bar.hot{opacity:.46}
svg.g .ln{fill:none;stroke:var(--stamp);stroke-width:1.75}
svg.g .ln2{fill:none;stroke:var(--pen);stroke-width:1.5;stroke-dasharray:4 3}
svg.g .pt{fill:var(--stamp)}
svg.g .ref{stroke:var(--pen);stroke-width:1;stroke-dasharray:3 3}
svg.g .val{fill:var(--ink);font-weight:500}
svg.g .hb{fill:var(--ink);opacity:.8}
svg.g .hb.alt{fill:var(--pen);opacity:.75}
svg.g .hb.warnb{fill:var(--mark);opacity:.85}
svg.g .hb.badb{fill:var(--stamp);opacity:.85}
svg.g .track{fill:var(--paper-3)}
svg.g .tick{stroke:var(--stamp);stroke-width:1.5}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 9px;
  font-size:10px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}

/* table */
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:right;
  padding:0 0 7px;border-bottom:1px solid var(--rule-hard);font-weight:400;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 0;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover td{background:var(--paper-2)}
tfoot td{border-bottom:0;border-top:1px solid var(--rule-hard);font-weight:600;padding-top:9px}

/* benchmark cells */
.bench-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.bm{background:var(--paper);padding:14px 15px}
.bm-row{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.bm-row .ours{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.bm-row .theirs{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bm-scale{height:4px;background:var(--paper-3);position:relative;margin-top:11px}
.bm-scale i{position:absolute;top:0;bottom:0;background:var(--ink-3);opacity:.5}
.bm-scale u{position:absolute;top:-4px;bottom:-4px;width:2px;text-decoration:none}
details{margin-top:14px}
summary{cursor:pointer;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
details ul{margin:10px 0 0 16px;font-size:10px;color:var(--ink-3);line-height:1.7}

/* cadence strip: times and labels only */
.cad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.cad div{background:var(--paper);padding:13px 15px}
.cad .t{font-size:11px;color:var(--stamp);font-variant-numeric:tabular-nums}
.cad h4{font-family:var(--serif);font-size:15px;font-weight:400;margin-top:5px}

footer{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:26px;flex-wrap:wrap}
footer p{font-size:10px;color:var(--ink-3);line-height:1.7}
.backlink{margin-top:7px}
.backlink a{color:var(--pen);text-decoration:none;border-bottom:1px solid var(--rule)}
.backlink a:hover{color:var(--ink);border-bottom-color:var(--ink-3)}
.foot-sp svg{width:118px;height:auto;color:var(--ink-3);display:block}
.foot-sp .cap{font-size:9px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}

html[dir="rtl"] th,html[dir="rtl"] td{text-align:left}
html[dir="rtl"] th:first-child,html[dir="rtl"] td:first-child{text-align:right}
html[dir="rtl"] .pane{padding:20px 0 22px 30px;border-right:0;border-left:1px solid var(--rule)}
html[dir="rtl"] .pane:last-child{border-left:0;padding-left:0;padding-right:30px}
html[dir="rtl"] .dateline>div{padding:7px 0 7px 15px;margin:0 0 0 15px;border-right:0;border-left:1px solid var(--rule)}
html[dir="rtl"] .flag{padding:11px 0 11px 18px;margin:0 0 0 18px;border-right:0;border-left:1px solid var(--rule)}
.ltr{direction:ltr}

@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{border-bottom:1px solid var(--rule)}
  .kpi:nth-child(3n){border-right:0}
  .kpi:nth-child(n+4){border-bottom:0}
  .row.two,.row.three,.row.wide{grid-template-columns:minmax(0,1fr)}
  .pane{padding:20px 0 22px!important;border-right:0;border-bottom:1px solid var(--rule)}
  .pane:last-child{border-bottom:0}
  html[dir="rtl"] .pane{border-left:0}
  .bench-grid,.cad{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-child(n+3){border-bottom:1px solid var(--rule)}
  .kpi:nth-child(n+5){border-bottom:0}
  .bench-grid,.cad{grid-template-columns:minmax(0,1fr)}
  .flag{border-right:0;margin-right:0;width:100%}
  table{font-size:10.5px}th{font-size:8.5px}
}
@media print{
  body{padding:0;font-size:10px}body::before{display:none}
  .ctl,.tip{display:none!important}
  .row.two,.row.three,.row.wide{grid-template-columns:minmax(0,1fr)}
  .row,.bench-grid,.cad{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function agg(days){
  const o = {spend:0,impr:0,clicks:0,leads:0,qual:0,byLine:{}};
  days.forEach(d => d.r.forEach(r => {
    o.spend += r.s; o.impr += r.i; o.clicks += r.c; o.leads += r.ld; o.qual += r.q;
    const b = o.byLine[r.l] || (o.byLine[r.l] = {spend:0,impr:0,clicks:0,leads:0,qual:0,freq:0});
    b.spend += r.s; b.impr += r.i; b.clicks += r.c; b.leads += r.ld; b.qual += r.q; b.freq = r.f;
  }));
  o.cpl = o.leads ? o.spend/o.leads : 0;
  o.cpql = o.qual ? o.spend/o.qual : 0;
  o.ctr = o.impr ? o.clicks/o.impr : 0;
  o.cpm = o.impr ? o.spend/o.impr*1000 : 0;
  let w = 0; o.freq = 0;
  Object.keys(o.byLine).forEach(k => { const b = o.byLine[k];
    b.cpl = b.leads ? b.spend/b.leads : 0;
    b.cpql = b.qual ? b.spend/b.qual : 0;
    b.ctr = b.impr ? b.clicks/b.impr : 0;
    o.freq += b.freq * b.spend; w += b.spend; });
  o.freq = w ? o.freq/w : 0;
  return o;
}

  return {cur:d, prev:[]};
};

/* ---------- kpis ---------- */
function sparkline(vals){
  const w = 100, h = 22, mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  const pts = vals.map((v,i) => [i/(Math.max(1,vals.length-1))*w, h - (v-mn)/rg*(h-3) - 1.5]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const l = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'
    + '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/>'
    + '<circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="1.9" fill="currentColor"/></svg>';
}
function pinCls(key, v){ const b = BENCH[key]; if(!b) return null;
  return b.dir === 'up' ? (v >= b.mid ? 'good' : v >= b.lo ? 'warn' : 'bad')
                        : (v <= b.lo ? 'good' : v <= b.hi ? 'warn' : 'bad'); }
function deltaHtml(cur, prev, lowerIsBetter){
  if(!prev || !isFinite(prev) || prev === 0) return '<span class="delta flat">&middot;</span>';
  const pc = (cur-prev)/prev;
  if(Math.abs(pc) < 0.005) return '<span class="delta flat">0.0%</span>';
  return '<span class="delta '+((lowerIsBetter ? pc < 0 : pc > 0) ? 'up' : 'down')+'">'
    + (pc>0?'+':'') + (pc*100).toFixed(1) + '%</span>';
}
function renderKpis(){
  const {cur, prev} = window_();
  const a = agg(cur), p = prev.length ? agg(prev) : null;
  const daily = k => DATA.days.slice(-10).map(d => agg([d])[k] || 0);
  const cards = [
    {k:'spent', v:fmt.usd0(a.spend), raw:a.spend, pv:p&&p.spend, lower:false, s:daily('spend'), bm:null, hint:'Amount spent'},
    {k:'leads', v:fmt.n0(a.leads),   raw:a.leads, pv:p&&p.leads, lower:false, s:daily('leads'), bm:null, hint:'Leads'},
    {k:'cpl',   v:fmt.usd2(a.cpl),   raw:a.cpl,   pv:p&&p.cpl,   lower:true,  s:daily('cpl'),   bm:'cpl', hint:'CPL'},
    {k:'ctr',   v:fmt.pct(a.ctr),    raw:a.ctr,   pv:p&&p.ctr,   lower:false, s:daily('ctr'),   bm:'ctr', hint:'CTR'},
    {k:'freq',  v:fmt.x(a.freq),     raw:a.freq,  pv:p&&p.freq,  lower:true,  s:daily('freq'),  bm:'freq',hint:'Frequency'},
    {k:'qual',  v:fmt.n0(a.qual),    raw:a.qual,  pv:p&&p.qual,  lower:false, s:daily('qual'),  bm:null, hint:'Sales qualified'}
  ];
  $('#kpis').innerHTML = cards.map(c => {
    const pc = c.bm ? pinCls(c.bm, c.raw) : null;
    return '<div class="kpi"><div class="k-lbl"><span class="lbl" title="'+c.hint+'">'+t(c.k)+'</span>'

/* ---------- flags: label plus number, nothing else ---------- */
function renderFlags(){
  if(!CONFIG.showFlags){ $('#flags').style.display = 'none'; return; }
  const a = agg(DATA.days), out = [];
  const worstFreq = Object.entries(a.byLine).filter(([,b]) => b.spend > 100)
    .sort((x,y) => y[1].freq - x[1].freq)[0];
  if(worstFreq && worstFreq[1].freq > 4)
    out.push({sev:'bad', k:lineById(worstFreq[0]).short + ' ' + t('freqc'), v:fmt.x(worstFreq[1].freq)});
  if(a.ctr < BENCH.ctr.mid)
    out.push({sev:'warn', k:t('ctr') + ' vs ' + fmt.pct(BENCH.ctr.mid), v:fmt.pct(a.ctr)});
  const dev = (a.cpl - PLAN.cpl)/PLAN.cpl;
  out.push({sev: dev > 0.15 ? 'bad' : dev > 0.04 ? 'warn' : 'good',
            k:t('cpl') + ' vs ' + fmt.usd2(PLAN.cpl), v:(dev>0?'+':'') + (dev*100).toFixed(0) + '%'});
  const best = Object.entries(a.byLine).filter(([,b]) => b.leads > 3).sort((x,y) => x[1].cpl - y[1].cpl)[0];
  if(best) out.push({sev:'good', k:lineById(best[0]).short + ' ' + t('cplc'), v:fmt.usd2(best[1].cpl)});
  const order = {bad:0, warn:1, good:2};
  const txt = {bad:t('actNow'), warn:t('watch'), good:t('working')};
  $('#flags').innerHTML = out.sort((x,y) => order[x.sev]-order[y.sev]).slice(0,4).map(f =>
    '<div class="flag"><span class="stamp '+f.sev+'">'+txt[f.sev]+'</span>'
    + '<div><div class="fk">'+f.k+'</div><div class="fv">'+f.v+'</div></div></div>').join('');
}

function renderPacing(){

/* ---------- chart: daily spend bars + cpl line ---------- */
function gDaily(){
  const days = DATA.days, W = 720, H = 230, pl = 42, pr = 42, pb = 26, pt = 14;
  const iw = W-pl-pr, ih = H-pt-pb;
  const sp = days.map(d => agg([d]).spend), cp = days.map(d => agg([d]).cpl);
  const maxS = Math.max(...sp)*1.25, maxC = Math.max(...cp)*1.2;
  const gap = iw/days.length, bw = gap*0.6;
  let s = '';
  for(let i = 0; i <= 4; i++){
    const y = pt+ih-ih*i/4;
    s += '<line class="gl" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'"/>'
      +  '<text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(maxS*i/4)+'</text>'
      +  '<text x="'+(W-pr+6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="start" fill="var(--stamp)">'+Math.round(maxC*i/4)+'</text>';
  }
  const rx = days.findIndex(d => d.d === DATA.meta.refreshDay);
  if(rx >= 0){ const x = pl+rx*gap+gap/2;
    s += '<line class="ref" x1="'+x.toFixed(1)+'" y1="'+pt+'" x2="'+x.toFixed(1)+'" y2="'+(pt+ih)+'"/>'; }
  days.forEach((d,i) => {
    const h = sp[i]/maxS*ih, x = pl+i*gap+(gap-bw)/2;
    s += '<rect class="bar'+(d.d >= 13 && d.d <= 14 ? ' hot' : '')+'" x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)
      + '" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'"/>';
    if(i%3 === 0 || i === days.length-1)
      s += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+fmt.dshort(d.dt)+'</text>';
  });
  const pts = cp.map((v,i) => [pl+i*gap+gap/2, pt+ih-v/maxC*ih]);
  s += '<path class="ln" d="'+pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+'"/>';
  pts.forEach(p => s += '<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2"/>');
  days.forEach((d,i) => s += '<rect class="hz" data-i="'+i+'" x="'+(pl+i*gap).toFixed(1)+'" y="'+pt
    + '" width="'+gap.toFixed(1)+'" height="'+ih+'" fill="transparent"/>');
  const el = $('#gDaily'); el.innerHTML = s;
  $('#lgDaily').innerHTML =
      '<span><i style="background:var(--ink);opacity:.3;height:8px"></i>'+t('lgDailySpend')+'</span>'
    + '<span><i style="background:var(--stamp)"></i>'+t('lgDailyCpl')+'</span>'
    + '<span><i style="background:var(--pen)"></i>'+t('lgRefresh')+' &middot; '+(L==='ar'?'اليوم ١٥':'day 15')+'</span>';
  const tip = $('#tip');
  el.querySelectorAll('.hz').forEach(z => {
    z.addEventListener('mouseenter', () => {
      const d = days[+z.dataset.i], x = agg([d]);
      tip.innerHTML = '<b>'+fmt.dshort(d.dt)+'</b> &nbsp; '+fmt.usd0(x.spend)+' &nbsp; '
        + fmt.n1(x.leads)+' '+t('lds').toLowerCase()+' &nbsp; '+fmt.usd2(x.cpl);
      tip.style.opacity = 1;
      const r = el.getBoundingClientRect(), b = z.getBoundingClientRect();
      tip.style.left = Math.min(r.width-230, Math.max(0, b.left-r.left+b.width/2-100))+'px';
      tip.style.top = '2px';
    });
    z.addEventListener('mouseleave', () => tip.style.opacity = 0);
  });
}

/* ---------- chart: cumulative leads vs plan ---------- */
function gCum(){
  const m = DATA.meta, W = 460, H = 230, pl = 36, pr = 14, pb = 26, pt = 14;
  const iw = W-pl-pr, ih = H-pt-pb;
  let run = 0;
  const act = DATA.days.map(d => { run += agg([d]).leads; return run; });
  const perDay = act[act.length-1]/m.dayN;
  const maxY = Math.max(PLAN.leads, perDay*m.flightDays)*1.1;
  const X = i => pl + i/(m.flightDays-1)*iw;
  const Y = v => pt + ih - v/maxY*ih;
  let s = '';
  for(let i = 0; i <= 4; i++){
    const y = pt+ih-ih*i/4;
    s += '<line class="gl" x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'"/>'
      +  '<text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(maxY*i/4)+'</text>';
  }
  // plan line, straight to target
  s += '<path class="ln2" d="M'+X(0).toFixed(1)+' '+Y(PLAN.leads/m.flightDays).toFixed(1)
    + ' L'+X(m.flightDays-1).toFixed(1)+' '+Y(PLAN.leads).toFixed(1)+'"/>';
  // actual, filled
  const ap = act.map((v,i) => [X(i), Y(v)]);
  s += '<path d="M'+ap[0][0].toFixed(1)+' '+(pt+ih)+' '
    + ap.map(p => 'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')
    + ' L'+ap[ap.length-1][0].toFixed(1)+' '+(pt+ih)+' Z" fill="var(--ink)" opacity=".14"/>';
  s += '<path d="'+ap.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')
    + '" fill="none" stroke="var(--ink)" stroke-width="1.9"/>';
  // projection tail
  s += '<path class="ln" style="stroke-dasharray:4 3" d="M'+ap[ap.length-1][0].toFixed(1)+' '+ap[ap.length-1][1].toFixed(1)
    + ' L'+X(m.flightDays-1).toFixed(1)+' '+Y(perDay*m.flightDays).toFixed(1)+'"/>';
  // end markers
  s += '<circle cx="'+X(m.flightDays-1).toFixed(1)+'" cy="'+Y(PLAN.leads).toFixed(1)+'" r="2.6" fill="var(--pen)"/>'
    +  '<text class="val" x="'+(X(m.flightDays-1)-4).toFixed(1)+'" y="'+(Y(PLAN.leads)-7).toFixed(1)+'" text-anchor="end" fill="var(--pen)">'+PLAN.leads+'</text>'
    +  '<circle cx="'+X(m.flightDays-1).toFixed(1)+'" cy="'+Y(perDay*m.flightDays).toFixed(1)+'" r="2.6" fill="var(--stamp)"/>'
    +  '<text class="val" x="'+(X(m.flightDays-1)-4).toFixed(1)+'" y="'+(Y(perDay*m.flightDays)+13).toFixed(1)+'" text-anchor="end" fill="var(--stamp)">'+Math.round(perDay*m.flightDays)+'</text>';
  // today marker
  s += '<line x1="'+X(m.dayN-1).toFixed(1)+'" y1="'+pt+'" x2="'+X(m.dayN-1).toFixed(1)+'" y2="'+(pt+ih)
    + '" stroke="var(--stamp)" stroke-width="1" opacity=".5"/>'
    + '<text x="'+(X(m.dayN-1)+4).toFixed(1)+'" y="'+(pt+9)+'" fill="var(--stamp)">'+t('lgToday')+'</text>';
  [1, 8, 15, 22, 30].forEach(d => s += '<text x="'+X(d-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+d+'</text>');
  $('#gCum').innerHTML = s;
  $('#lgCum').innerHTML =
      '<span><i style="background:var(--ink);height:8px"></i>'+t('lgActual')+' '+Math.round(act[act.length-1])+'</span>'
    + '<span><i style="background:var(--pen)"></i>'+t('lgPlan')+' '+PLAN.leads+'</span>'
    + '<span><i style="background:var(--stamp)"></i>'+t('lgProjLine')+' '+Math.round(perDay*m.flightDays)+'</span>';
}

      + '<div class="bm-scale"><i style="left:'+(b.lo/hi*100).toFixed(0)+'%;width:'+((b.hi-b.lo)/hi*100).toFixed(0)+'%"></i>'
      + '<u style="left:'+(v/hi*100).toFixed(0)+'%;background:'+(good ? 'var(--grow)' : 'var(--stamp)')+'"></u></div></div>';

  set('#tagPerf', t('tagPerf')); set('#lblShared', t('shared')); set('#sharedUrl', CONFIG.sharedLink);

  set('#pToday', t('today')); set('#p7d', t('d7')); set('#pFlight', t('flight'));
  set('#themeBtn', document.documentElement.dataset.theme === 'ink' ? t('themeAlt') : t('theme'));
  set('#printBtn', t('print'));
  ['hDaily','hCum','hByLine','hFunnel','hVs','hCre','hMkt','hPlace','hAge','hTable','hBench','hCad']
    .forEach(k => set('#'+k, t(k)));

  set('#mByLine', L === 'ar' ? 'مقابل الخطة' : 'against plan');

  $('#footStamp').innerHTML = (CONFIG.sheetUrl ? '' : '<b>'+t('sample')+'</b> &middot; ')
    + 'ITP Live &middot; ' + now.toLocaleString('en-GB') + ' &middot; ' + CONFIG.contact;
}

/* ---------- live sheet ---------- */
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){ const c = text[i];
    if(q){ if(c === '"' && text[i+1] === '"'){ cell += '"'; i++; } else if(c === '"'){ q = false; } else cell += c; }
    else if(c === '"') q = true;
    else if(c === ',') { row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r') cell += c; }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h,i) => [h,r[i]])));
}
const HEADER_MAP = {
  date:['day','date','reporting starts','stat time day'],
  spend:['amount spent (usd)','amount spent','cost','spend','total spend'],
  impr:['impressions','impression','paid impressions'],
  clicks:['link clicks','clicks (all)','clicks','swipe ups','swipes'],
  leads:['leads','on-facebook leads','website leads','conversions','total conversions'],
  freq:['frequency','avg. impressions per user']
};
const pick = (row,key) => { const keys = Object.keys(row);
  for(const c of HEADER_MAP[key]){ const h = keys.find(k => k.toLowerCase().trim() === c); if(h) return row[h]; }
  for(const c of HEADER_MAP[key]){ const h = keys.find(k => k.toLowerCase().includes(c)); if(h) return row[h]; }
  return null; };
const num = v => { const n = parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : 0; };
let lastGood = null;
async function loadLive(){
  if(!CONFIG.sheetUrl) return null;
  try{
    const res = await fetch(CONFIG.sheetUrl,{cache:'no-store'});
    if(!res.ok) throw new Error('unreachable');
    const rows = parseCsv(await res.text()), byDate = {};
    rows.forEach(r => { const dt = (pick(r,'date')||'').slice(0,10); if(!dt) return;
      (byDate[dt] = byDate[dt] || []).push({l:'L1', s:num(pick(r,'spend')), i:num(pick(r,'impr')),
        c:num(pick(r,'clicks')), ld:num(pick(r,'leads')), q:num(pick(r,'leads'))*0.26, f:num(pick(r,'freq'))||1}); });
    const days = Object.keys(byDate).sort().map((dt,i) => ({d:i+1, dt, r:byDate[dt]}));
    if(!days.length) throw new Error('empty');
    lastGood = {when:new Date(), days};
    return days;
  }catch(e){
    if(lastGood){ $('#dlSample').textContent = t('stale',{t:fmt.clock(lastGood.when)}); return lastGood.days; }
    $('#dlSample').textContent = t('sample'); return null;
  }
}

/* ---------- boot ---------- */
function renderAll(){
  renderChrome(); renderKpis(); renderFlags(); renderPacing();
  gDaily(); gCum(); gByLine(); gFunnel(); gVs(); gCre(); gMkt();
  bars('#gPlace', DATA.splits.placement, 340);
  bars('#gAge', DATA.splits.age, 340);
  renderTable(); renderBench(); renderCad();
}
document.querySelectorAll('[data-period]').forEach(b => b.addEventListener('click', () => {
  period = b.dataset.period; renderChrome(); renderKpis(); gByLine(); gFunnel(); renderTable(); }));
$('#langBtn').addEventListener('click', () => { L = L === 'en' ? 'ar' : 'en'; renderAll(); });
$('#themeBtn').addEventListener('click', () => { const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'ink' ? 'paper' : 'ink';
  $('#themeBtn').textContent = h.dataset.theme === 'ink' ? t('themeAlt') : t('theme'); });
$('#printBtn').addEventListener('click', () => window.print());
$('#copyBtn').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText('https://'+CONFIG.sharedLink);
    $('#copyBtn').textContent = L === 'ar' ? 'تم' : 'copied';
    setTimeout(() => $('#copyBtn').textContent = 'copy', 1600); }catch(e){ $('#copyBtn').textContent = 'n/a'; }
});
document.documentElement.dataset.theme = CONFIG.theme;
(async () => { const live = await loadLive(); if(live) DATA.days = live; renderAll(); })();
setInterval(async () => { const live = await loadLive(); if(live) DATA.days = live; renderAll(); }, CONFIG.refreshMins*60000);
</script>
